              <h1 class="font-heading font-black text-xl leading-tight tracking-wide">仁德非營利幼兒園</h1>

          <button @click="exportInventoryCSV()" class="flex items-center gap-1.5 px-4 py-2 rounded-full bg-paper/15 hover:bg-paper/25 text-paper text-xs font-bold transition">⬇️ 下載財產清冊（CSV）</button>
          <span x-show="shareLinkNotice" x-text="shareLinkNotice" class="text-xs text-cream/90 font-bold"></span>
        </div>
        <nav class="max-w-6xl mx-auto px-5 flex flex-wrap gap-2 pb-3">
          <button @click="view='teacher'"
            class="px-5 py-2 rounded-full font-heading font-bold text-sm transition-all"
            :class="view==='teacher' ? 'washi-tab-active' : 'bg-paper/20 text-paper/85 hover:bg-paper/30'">
            🧸 老師借還登記區
          </button>
          <button @click="view='laminate'"
            class="px-5 py-2 rounded-full font-heading font-bold text-sm transition-all"
            :class="view==='laminate' ? 'washi-tab-active' : 'bg-paper/20 text-paper/85 hover:bg-paper/30'">
            🧷 護貝膜申請
          </button>
          <button @click="view='plan'"
            class="px-5 py-2 rounded-full font-heading font-bold text-sm transition-all"
            :class="view==='plan' ? 'washi-tab-active' : 'bg-paper/20 text-paper/85 hover:bg-paper/30'">
            📚 教學計畫
          </button>
          <button x-show="isAdmin" @click="view='admin'"
            x-effect="if (!titleTimer) document.title = (isAdmin && adminPendingCount>0 ? `(${adminPendingCount}) ` : '') + baseTitle"
            class="px-5 py-2 rounded-full font-heading font-bold text-sm transition-all"
            :class="view==='admin' ? 'washi-tab-active' : 'bg-paper/20 text-paper/85 hover:bg-paper/30'">
            📋 管理者後台
            <span x-show="adminPendingCount>0" class="ml-1 px-2 py-0.5 rounded-full bg-coral text-paper text-xs font-num" x-text="adminPendingCount"></span>
          </button>
        </nav>
      </header>

      <main class="max-w-6xl mx-auto px-5 mt-6">

        <!-- ============ 老師端 ============ -->
        <section x-show="view==='teacher'" class="grid md:grid-cols-5 gap-6">

          <div class="md:col-span-2 paper-card rounded-3xl p-6 shadow-card h-fit">
            <h2 class="font-heading font-black text-lg mb-4 flex items-center gap-2"><span class="text-2xl">✏️</span> 借還登記</h2>
            <div class="flex bg-sage-light rounded-full p-1 mb-5">
              <button @click="formMode='borrow'" class="flex-1 py-2 rounded-full text-sm font-heading font-bold transition-all"
                :class="formMode==='borrow' ? 'bg-sage text-paper shadow' : 'text-sage-dark'">📚 借用</button>
              <button @click="formMode='return'" class="flex-1 py-2 rounded-full text-sm font-heading font-bold transition-all"
                :class="formMode==='return' ? 'bg-sage text-paper shadow' : 'text-sage-dark'">↩️ 歸還</button>
            </div>

            <!-- 借用表單 -->
            <template x-if="formMode==='borrow'">
              <form @submit.prevent="submitBorrow" class="space-y-4">
                <div>
                  <label class="text-sm font-bold text-wood-dark/80">老師姓名</label>
                  <div>
                  <select x-model="teacherPick" @change="$nextTick(() => { borrowForm.borrower = (teacherPick==='__other__' ? '' : teacherPick); })"
                    class="mt-1 w-full rounded-xl border bg-paper px-3 py-2 text-sm"
                    :class="!borrowForm.borrower.trim() ? 'border-coral/60' : 'border-wood-light/50'">
                    <option value="">請選擇老師</option>
                    <template x-for="n in teacherSuggestions" :key="'bt_'+n"><option :value="n" x-text="n"></option></template>
                    <option value="__other__">✏️ 其他（手動輸入姓名）</option>
                  </select>
                  <input x-show="teacherPick==='__other__'" x-model="borrowForm.borrower" placeholder="請輸入老師姓名，例如：王老師"
                    class="mt-2 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
                  </div>
                  <p x-show="!borrowForm.borrower.trim()" class="text-coral text-xs font-bold mt-1">必填</p>
                </div>
                <div>
                  <label class="text-sm font-bold text-wood-dark/80">班級</label>
                  <select x-model="borrowForm.className" required class="mt-1 w-full rounded-xl border bg-paper px-3 py-2 text-sm"
                    :class="!borrowForm.className ? 'border-coral/60' : 'border-wood-light/50'">
                    <option value="">請選擇班級</option>
                    <template x-for="c in classes" :key="c"><option :value="c" x-text="c"></option></template>
                  </select>
                  <p x-show="!borrowForm.className" class="text-coral text-xs font-bold mt-1">必填</p>
                </div>

                <div>
                  <label class="text-sm font-bold text-wood-dark/80">① 選擇類別（可切換類別繼續複選其他項目）</label>
                  <select x-model="borrowForm.categoryId" @change="if(borrowForm.searchKeyword.trim()) pickForceOpen=true" required class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
                    <option value="">請選擇類別</option>
                    <template x-for="cat in categories" :key="cat.id"><option :value="cat.id" x-text="`${cat.emoji} ${cat.name}`"></option></template>
                  </select>
                </div>

                <div class="bg-cream rounded-2xl p-3">
                  <label class="text-xs font-bold text-wood-dark/70">🔎 查詢班級／老師已借用未歸還的項目</label>
                  <input type="text" x-model="borrowLookupText" placeholder="輸入班級或老師姓名，例如：向日葵班 或 林老師"
                    class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
                  <template x-if="borrowLookupText.trim()">
                    <div class="mt-2 space-y-2 max-h-48 overflow-y-auto">
                      <template x-for="r in borrowLookupMatches" :key="r.id">
                        <div class="flex items-center gap-2 bg-paper rounded-lg p-2 border border-wood-light/30">
                          <img x-show="photoOf(getItemById(r.itemId))" :src="photoOf(getItemById(r.itemId))" class="w-8 h-8 rounded-lg object-cover border border-wood-light/30">
                          <template x-if="!photoOf(getItemById(r.itemId))"><div class="w-8 h-8 rounded-lg flex items-center justify-center text-sm" :style="categoryStyleByName(r.category)" x-text="categoryEmojiByName(r.category)"></div></template>
                          <div class="flex-1">
                            <p class="text-xs font-bold" x-text="r.itemName"></p>
                            <p class="text-[11px] text-wood-dark/50" x-text="`${r.borrower}（${r.className}）－借用 ${r.borrowDate}，尚欠 ${outstanding(r)} 件`"></p>
                          </div>
                        </div>
                      </template>
                      <p x-show="borrowLookupMatches.length===0" class="text-xs text-wood-dark/40 text-center py-2">查無符合的未歸還項目</p>
                    </div>
                  </template>
                </div>

                <div>
                  <label class="text-sm font-bold text-wood-dark/80">🔍 搜尋品項關鍵字（可輸入品項名稱或出版社）</label>
                  <input type="text" x-model="borrowForm.searchKeyword" @input="pickForceOpen=false" placeholder="例如：毛毛蟲 或 信誼出版社"
                    class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
                  <button type="button" x-show="borrowForm.searchKeyword.trim() && borrowForm.categoryId" @click="pickForceOpen=!pickForceOpen"
                    class="mt-2 text-xs font-bold text-sage-dark underline" x-text="pickForceOpen ? '↩︎ 回到搜尋結果（收合 ② 選擇借用項目）' : '▼ 展開 ② 選擇借用項目'"></button>
                </div>

                <template x-if="borrowForm.searchKeyword.trim() && !pickForceOpen">
                  <div>
                    <label class="text-sm font-bold text-wood-dark/80">搜尋結果（可複選）</label>
                    <div class="mt-1 grid grid-cols-2 gap-2 max-h-64 overflow-y-auto p-1">
                      <template x-for="it in searchResultItems" :key="it.id">
                        <div @click="toggleBorrowItem(it)" class="item-pick-card rounded-xl p-2 bg-paper border border-wood-light/30 flex flex-col gap-1 relative"
                          :class="[isBorrowItemSelected(it.id) ? 'selected' : '', it.remaining<=0 ? 'disabled' : '']">
                          <input type="checkbox" :checked="isBorrowItemSelected(it.id)" @click.stop="toggleBorrowItem(it)" class="absolute top-1.5 right-1.5 w-4 h-4 accent-sage">
                          <img x-show="photoOf(it)" :src="photoOf(it)" class="w-full h-16 object-cover rounded-lg">
                          <template x-if="!photoOf(it)"><div class="w-full h-16 rounded-lg flex items-center justify-center text-2xl" :style="categoryStyle(it.categoryId)" x-text="categoryEmojiOf(it.categoryId)"></div></template>
                          <p class="text-xs font-bold leading-tight" x-text="it.name"></p>
                          <p class="text-[10px] text-wood-dark/40" x-text="categoryNameOf(it.categoryId)"></p>
                          <p class="text-[11px] font-num" :class="it.remaining<=0 ? 'text-coral' : 'text-sage-dark'" x-text="it.remaining<=0 ? '已借出' : `可借用 ${it.remaining}/${it.total}`"></p>
                          <p x-show="it.remaining<=0" class="text-[10px] text-wood-dark/50 leading-tight" x-text="`借出者：${currentBorrowersOf(it.id)}`"></p>
                        </div>
                      </template>
                      <p x-show="searchResultItems.length===0" class="col-span-2 text-xs text-wood-dark/40 text-center py-4">找不到符合的品項</p>
                    </div>
                  </div>
                </template>

                <template x-if="borrowForm.categoryId && (!borrowForm.searchKeyword.trim() || pickForceOpen)">
                  <div>
                    <label class="text-sm font-bold text-wood-dark/80">② 選擇借用項目（可複選）</label>
                    <div class="mt-1 grid grid-cols-2 gap-2 max-h-64 overflow-y-auto p-1">
                      <template x-for="it in borrowCategoryItems" :key="it.id">
                        <div @click="toggleBorrowItem(it)" class="item-pick-card rounded-xl p-2 bg-paper border border-wood-light/30 flex flex-col gap-1 relative"
                          :class="[isBorrowItemSelected(it.id) ? 'selected' : '', it.remaining<=0 ? 'disabled' : '']">
                          <input type="checkbox" :checked="isBorrowItemSelected(it.id)" @click.stop="toggleBorrowItem(it)" class="absolute top-1.5 right-1.5 w-4 h-4 accent-sage">
                          <img x-show="photoOf(it)" :src="photoOf(it)" class="w-full h-16 object-cover rounded-lg">
                          <template x-if="!photoOf(it)"><div class="w-full h-16 rounded-lg flex items-center justify-center text-2xl" :style="categoryStyle(it.categoryId)" x-text="categoryEmojiOf(it.categoryId)"></div></template>
                          <p class="text-xs font-bold leading-tight" x-text="it.name"></p>
                          <p class="text-[11px] font-num" :class="it.remaining<=0 ? 'text-coral' : 'text-sage-dark'" x-text="it.remaining<=0 ? '已借出' : `可借用 ${it.remaining}/${it.total}`"></p>
                          <p x-show="it.remaining<=0" class="text-[10px] text-wood-dark/50 leading-tight" x-text="`借出者：${currentBorrowersOf(it.id)}`"></p>
                        </div>
                      </template>
                      <p x-show="borrowCategoryItems.length===0" class="col-span-2 text-xs text-wood-dark/40 text-center py-4">此類別目前尚無項目</p>
                    </div>
                  </div>
                </template>

                <template x-if="selectedBorrowEntries.length">
                  <div class="space-y-2">
                    <p class="text-sm font-bold text-wood-dark/80">已選擇的品項（可跨類別複選，分別設定數量）</p>
                    <template x-for="entry in selectedBorrowEntries" :key="entry.it.id">
                      <div class="flex items-center gap-2 bg-cream rounded-xl p-2 border border-wood-light/30">
                        <img x-show="photoOf(entry.it)" :src="photoOf(entry.it)" class="w-10 h-10 rounded-lg object-cover border border-wood-light/40">
                        <template x-if="!photoOf(entry.it)"><div class="w-10 h-10 rounded-lg flex items-center justify-center text-lg" :style="categoryStyle(entry.it.categoryId)" x-text="categoryEmojiOf(entry.it.categoryId)"></div></template>
                        <div class="flex-1">
                          <p class="text-sm font-bold" x-text="entry.it.name"></p>
                          <p class="text-[10px] text-wood-dark/40" x-text="categoryNameOf(entry.it.categoryId)"></p>
                        </div>
                        <input type="number" min="1" :max="entry.it.remaining" x-model.number="borrowForm.selected[entry.it.id]" class="w-16 rounded-lg border border-wood-light/50 bg-paper px-2 py-1 text-sm text-center">
                        <button type="button" @click="removeBorrowSelection(entry.it.id)" class="text-coral text-xs font-bold hover:underline">移除</button>
                      </div>
                    </template>
                  </div>
                </template>

                <div>
                  <label class="text-sm font-bold text-wood-dark/80">借用日期</label>
                  <input type="date" x-model="borrowForm.borrowDate" required class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
                </div>
                <p x-show="borrowError" x-text="borrowError" class="text-coral text-xs font-bold"></p>
                <button type="submit" :disabled="!borrowForm.borrower.trim() || !borrowForm.className || submitting"
                  class="w-full py-3 rounded-xl font-heading font-bold transition-colors"
                  :class="(!borrowForm.borrower.trim() || !borrowForm.className || submitting) ? 'bg-wood-light/40 text-wood-dark/40 cursor-not-allowed' : 'bg-sage text-paper hover:bg-sage-dark'">
                  <span x-text="submitting ? '處理中…' : '確認借用'"></span>
                </button>
              </form>
            </template>

            <!-- 歸還表單 -->
            <template x-if="formMode==='return'">
              <form @submit.prevent="submitReturn" class="space-y-4">
                <div>
                  <label class="text-sm font-bold text-wood-dark/80">選擇班級或老師姓名</label>
                  <select x-model="returnForm.filterText" @change="returnForm.itemNameFilter=''; returnForm.selected={}"
                    class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
                    <option value="">請選擇班級或老師姓名</option>
                    <optgroup label="👩‍🏫 老師">
                      <template x-for="n in teacherSuggestions" :key="'t_'+n"><option :value="n" x-text="n"></option></template>
                    </optgroup>
                    <optgroup label="🏫 班級">
                      <template x-for="c in classes" :key="'c_'+c"><option :value="c" x-text="c"></option></template>
                    </optgroup>
                  </select>
                </div>
                <template x-if="returnForm.filterText.trim()">
                  <div>
                    <label class="text-sm font-bold text-wood-dark/80">教具／繪本名稱（可選填以縮小範圍）</label>
                    <select x-model="returnForm.itemNameFilter" class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
                      <option value="">全部品項</option>
                      <template x-for="n in teacherItemNameOptions" :key="n"><option :value="n" x-text="n"></option></template>
                    </select>
                  </div>
                </template>
                <template x-if="returnForm.filterText.trim()">
                  <div>
                    <label class="text-sm font-bold text-wood-dark/80">選擇要歸還的項目（可複選）</label>
                    <div class="mt-1 space-y-2 max-h-64 overflow-y-auto p-1">
                      <template x-for="r in matchingOpenRecords" :key="r.id">
                        <div class="flex items-center gap-2 bg-paper rounded-xl p-2 border border-wood-light/30">
                          <input type="checkbox" :checked="isReturnSelected(r.id)" @change="toggleReturnRecord(r)" class="w-4 h-4 accent-sage shrink-0">
                          <img x-show="photoOf(getItemById(r.itemId))" :src="photoOf(getItemById(r.itemId))" class="w-10 h-10 rounded-lg object-cover border border-wood-light/40">
                            <div class="flex-1">
                            <p class="text-sm font-bold" x-text="r.itemName"></p>
                            <p class="text-xs text-wood-dark/50" x-text="`${r.borrower}（${r.className}）－尚欠 ${outstanding(r)} 件`"></p>
                            <p x-show="pendingReturnQtyOf(r.id)>0" class="text-[11px] text-mustard font-bold" x-text="`已有 ${pendingReturnQtyOf(r.id)} 件送出待管理員確認`"></p>
                          </div>
                          <input x-show="isReturnSelected(r.id)" type="number" min="1" :max="availableToReturn(r)" x-model.number="returnForm.selected[r.id]" class="w-16 rounded-lg border border-wood-light/50 bg-paper px-2 py-1 text-sm text-center">
                        </div>
                      </template>
                      <p x-show="matchingOpenRecords.length===0" class="text-xs text-wood-dark/40 text-center py-4">沒有符合的未歸還項目（或皆已送出待確認）</p>
                    </div>
                  </div>
                </template>

                <div class="bg-cream rounded-2xl p-3">
                  <label class="text-xs font-bold text-wood-dark/70">📅 依日期查詢當天全部歸還項目</label>
                  <input type="date" x-model="returnDateLookup" class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
                  <template x-if="returnDateLookup">
                    <div class="mt-2 space-y-2 max-h-48 overflow-y-auto">
                      <template x-for="r in returnDateLookupMatches" :key="r.id">
                        <div class="flex items-center gap-2 bg-paper rounded-lg p-2 border border-wood-light/30">
                          <img x-show="photoOf(getItemById(r.itemId))" :src="photoOf(getItemById(r.itemId))" class="w-8 h-8 rounded-lg object-cover border border-wood-light/30">
                          <template x-if="!photoOf(getItemById(r.itemId))"><div class="w-8 h-8 rounded-lg flex items-center justify-center text-sm" :style="categoryStyleByName(r.category)" x-text="categoryEmojiByName(r.category)"></div></template>
                          <div class="flex-1">
                            <p class="text-xs font-bold" x-text="r.itemName"></p>
                            <p class="text-[11px] text-wood-dark/50" x-text="`${r.borrower}（${r.className}）－歸還 ${r.qty} 件`"></p>
                          </div>
                          <span x-show="timeOnly(r.returnTimestamp)" class="text-xs font-num text-wood-dark/50">🕐 <span x-text="timeOnly(r.returnTimestamp)"></span></span>
                        </div>
                      </template>
                      <p x-show="returnDateLookupMatches.length===0" class="text-xs text-wood-dark/40 text-center py-2">當天沒有歸還紀錄</p>
                    </div>
                  </template>
                </div>

                <div>
                  <label class="text-sm font-bold text-wood-dark/80">歸還日期</label>
                  <input type="date" x-model="returnForm.returnDate" required class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
                </div>
                <p class="text-[11px] text-wood-dark/50">💡 送出後將由管理員清點確認，確認完成後才會更新為已歸還。</p>
                <p x-show="returnError" x-text="returnError" class="text-coral text-xs font-bold"></p>
                <button type="submit" :disabled="submitting" class="w-full py-3 rounded-xl bg-mustard text-wood-dark font-heading font-bold hover:brightness-95 transition disabled:opacity-50">
                  <span x-text="submitting ? '處理中…' : '送出歸還申請'"></span>
                </button>
              </form>
            </template>
          </div>

          <!-- 類別品項狀態顯示 -->
          <div class="md:col-span-3">
            <h2 class="font-heading font-black text-lg mb-3 flex items-center gap-2"><span class="text-2xl">📊</span> 類別品項狀態顯示</h2>
            <div class="mb-4">
              <label class="text-sm font-bold text-wood-dark/80">選擇類別</label>
              <select x-model="browseCategoryFilter" class="mt-1 w-full sm:w-72 rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
                <option value="">請選擇類別</option>
                <template x-for="cat in categories" :key="cat.id"><option :value="cat.id" x-text="`${cat.emoji} ${cat.name}`"></option></template>
              </select>
            </div>
            <template x-if="browseCategoryFilter">
              <div class="grid sm:grid-cols-2 gap-4">
                <template x-for="it in filteredBrowseItems" :key="it.id">
                  <div class="paper-card rounded-2xl p-4 shadow-card flex flex-col gap-3">
                    <img x-show="photoOf(it)" :src="photoOf(it)" class="w-full h-32 object-cover rounded-xl border border-wood-light/30">
                    <template x-if="!photoOf(it)"><div class="w-full h-32 rounded-xl flex items-center justify-center text-4xl" :style="categoryStyle(it.categoryId)" x-text="categoryEmojiOf(it.categoryId)"></div></template>
                    <div class="flex items-start justify-between">
                      <span class="tag-badge" :style="categoryStyle(it.categoryId)" x-text="categoryNameOf(it.categoryId)"></span>
                    </div>
                    <h3 class="font-heading font-bold text-base" x-text="it.name"></h3>
                    <p x-show="isBookCategory(it.categoryId) && publisherNameOf(it.publisherId)" class="text-xs text-wood-dark/50 -mt-2" x-text="`出版社：${publisherNameOf(it.publisherId)}`"></p>
                    <span class="text-xs font-bold" :class="it.remaining<=0 ? 'text-coral' : 'text-sage-dark'" x-text="it.remaining<=0 ? '已借出' : `可借用 ${it.remaining}/${it.total}`"></span>
                    <p x-show="it.remaining<=0" class="text-[11px] text-wood-dark/50 -mt-2" x-text="`借出者：${currentBorrowersOf(it.id)}`"></p>
                  </div>
                </template>
                <p x-show="filteredBrowseItems.length===0" class="col-span-2 text-center text-wood-dark/40 py-8">此類別目前沒有項目</p>
              </div>
            </template>
            <p x-show="!browseCategoryFilter" class="text-center text-wood-dark/40 py-8">請先選擇類別以顯示品項狀態</p>
          </div>
        </section>

        <!-- ============ 護貝膜申請（老師端） ============ -->
        <section x-show="view==='laminate'" class="grid md:grid-cols-5 gap-6">
          <div class="md:col-span-2 paper-card rounded-3xl p-6 shadow-card h-fit">
            <h2 class="font-heading font-black text-lg mb-4 flex items-center gap-2"><span class="text-2xl">🧷</span> 護貝膜申請</h2>
            <form @submit.prevent="submitLaminate" class="space-y-4">
              <div><label class="text-sm font-bold text-wood-dark/80">老師姓名</label>
                <input list="laminateTeachers" x-model="laminateForm.borrower" required placeholder="例如：王老師" class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
                <datalist id="laminateTeachers"><template x-for="n in teacherSuggestions" :key="n"><option :value="n"></option></template></datalist></div>
              <div><label class="text-sm font-bold text-wood-dark/80">班級</label>
                <select x-model="laminateForm.className" required class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm"><option value="">請選擇班級</option>
                  <template x-for="c in classes" :key="c"><option :value="c" x-text="c"></option></template></select></div>
              <div><label class="text-sm font-bold text-wood-dark/80">申請張數</label>
                <input type="number" min="1" :max="laminateAvailable" x-model.number="laminateForm.qty" required class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
                <p class="text-[11px] text-wood-dark/50 mt-1" x-text="`目前可申請 ${laminateAvailable} 張`"></p></div>
              <div><label class="text-sm font-bold text-wood-dark/80">用途</label>
                <textarea x-model="laminateForm.purpose" rows="2" required placeholder="例如：教室角落字卡、班級公約" class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm"></textarea></div>
              <div class="bg-cream rounded-2xl p-3 space-y-2">
                <p class="text-sm font-bold text-wood-dark/80">① 先將要護貝的檔案上傳到雲端資料夾</p>
                <a href="https://drive.google.com/drive/folders/1J8M-CQjOvRfuwrydiA5VINlis1R_JXEJ?usp=sharing" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-brand text-paper text-sm font-bold hover:bg-brand-dark transition">📂 開啟雲端資料夾上傳檔案</a>
                <label class="text-xs font-bold text-wood-dark/70 block pt-1">② 填寫您上傳的檔案名稱（方便管理員找檔案）</label>
                <input x-model="laminateForm.fileNote" required placeholder="例如：王老師_語文區字卡.pdf" class="w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
                <label class="flex items-center gap-2 text-xs font-bold text-wood-dark/80"><input type="checkbox" x-model="laminateForm.uploaded" class="w-4 h-4 accent-sage"> 我已將檔案上傳到雲端資料夾</label>
              </div>
              <div><label class="text-sm font-bold text-wood-dark/80">申請日期</label>
                <input type="date" x-model="laminateForm.requestDate" required class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm"></div>
              <p x-show="laminateError" x-text="laminateError" class="text-coral text-xs font-bold"></p>
              <p class="text-[11px] text-wood-dark/50">💡 送出後由管理員確認，確認後才會扣除護貝膜張數。</p>
              <button type="submit" :disabled="submitting" class="w-full py-3 rounded-xl bg-sage text-paper font-heading font-bold hover:bg-sage-dark transition disabled:opacity-50" x-text="submitting ? '送出中…' : '送出申請'"></button>
            </form>
          </div>
          <div class="md:col-span-3 space-y-4">
            <div class="paper-card rounded-3xl p-5 shadow-card flex flex-wrap items-center gap-6">
              <div><p class="text-xs font-bold text-wood-dark/60">護貝膜剩餘</p><p class="font-num font-black text-3xl" x-text="laminateStock ? laminateRemaining + ' 張' : '尚未設定'"></p></div>
              <div><p class="text-xs font-bold text-wood-dark/60">待管理員確認</p><p class="font-num font-black text-xl" x-text="laminatePendingQty + ' 張'"></p></div>
              <div><p class="text-xs font-bold text-wood-dark/60">目前可申請</p><p class="font-num font-black text-xl text-sage-dark" x-text="laminateAvailable + ' 張'"></p></div>
            </div>
            <div class="paper-card rounded-3xl p-5 shadow-card">
              <h3 class="font-heading font-bold text-sm mb-2">最近申請</h3>
              <template x-for="r in recentLaminateRequests" :key="r.id"><div class="flex items-center justify-between gap-2 border-b border-wood-light/15 py-2 text-sm">
                <span x-text="`${r.borrower}（${r.className}）${r.qty} 張－${r.purpose}`"></span>
                <span class="tag-badge" :class="r.status==='confirmed' ? 'tag-returned' : 'tag-pending'" x-text="r.status==='confirmed' ? '已確認' : '待確認'"></span></div></template>
              <p x-show="laminateRequests.length===0" class="text-xs text-wood-dark/40 text-center py-4">目前沒有申請紀錄</p>
            </div>
          </div>
        </section>

        <!-- ============ 教學計畫 ============ -->
        <section x-show="view==='plan' && currentUser" x-effect="if(view==='plan'&&currentUser&&window.PlanUI) PlanUI.sync($data)" class="space-y-4">
          <div id="planRoot" class="paper-card rounded-3xl p-6 shadow-card"></div>
        </section>

        <!-- ============ 管理者端 ============ -->

          <div class="paper-card rounded-3xl p-6 shadow-card" x-show="publisherPanelOpen" x-cloak>
            <div class="flex items-center justify-between mb-4">
              <h2 class="font-heading font-black text-lg flex items-center gap-2"><span class="text-2xl">🏢</span> 繪本書籍出版社管理</h2>
              <button @click="publisherPanelOpen = false" class="text-xs font-bold text-wood-dark/50 hover:underline">收合</button>
            </div>
            <form @submit.prevent="savePublisher" class="flex flex-wrap items-end gap-3 bg-cream rounded-2xl p-4 mb-4">
              <div class="flex-1 min-w-[180px]">
                <label class="text-xs font-bold text-wood-dark/60">出版社名稱</label>
                <input x-model="publisherForm.name" required placeholder="例如：信誼出版社" class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
              </div>
              <button type="submit" :disabled="submitting" class="py-2 px-5 rounded-xl bg-sage text-paper font-bold text-sm hover:bg-sage-dark transition disabled:opacity-50" x-text="publisherForm.id ? '儲存修改' : '＋ 新增出版社'"></button>
              <button type="button" x-show="publisherForm.id" @click="resetPublisherForm()" class="py-2 px-3 rounded-xl bg-paper border border-wood-light/40 text-xs font-bold">取消編輯</button>
            </form>

            <div class="bg-cream rounded-2xl p-4 mb-5">
              <label class="text-xs font-bold text-wood-dark/60">批次新增出版社（每行一個名稱，貼上後按下方按鈕，已存在的會自動略過）</label>
              <textarea x-model="publisherBatchText" rows="4" placeholder="三民書局&#10;三采&#10;上誼文化&#10;信誼&#10;..." class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm font-num"></textarea>
              <div class="flex items-center gap-3 mt-2">
                <button type="button" @click="batchAddPublishers()" :disabled="submitting" class="py-2 px-5 rounded-xl bg-wood text-paper font-bold text-sm hover:bg-wood-dark transition disabled:opacity-50">📥 批次新增</button>
                <span x-show="publisherBatchSummary" x-text="publisherBatchSummary" class="text-xs text-sage-dark font-bold"></span>
              </div>
            </div>
            <p x-show="publisherError" x-text="publisherError" class="text-coral text-xs font-bold mb-3"></p>
            <div class="flex flex-wrap gap-3">
              <template x-for="p in publishers" :key="p.id">
                <div class="flex items-center gap-2 paper-card rounded-full pl-4 pr-2 py-1">
                  <span class="text-sm font-bold" x-text="p.name"></span>
                  <button @click="editPublisher(p)" class="text-sage-dark text-xs font-bold hover:underline">編輯</button>
                  <button @click="deletePublisher(p)" class="text-coral text-xs font-bold hover:underline">刪除</button>
                </div>
              </template>
              <p x-show="publishers.length===0" class="text-xs text-wood-dark/40 py-2">尚未新增任何出版社</p>
            </div>
          </div>

          <div class="paper-card rounded-3xl p-6 shadow-card">
            <div class="flex items-center justify-between gap-3 mb-2 flex-wrap">
              <h2 class="font-heading font-black text-lg flex items-center gap-2"><span class="text-2xl">🗂️</span> 繪本與教具資料管理</h2>
              <div class="flex items-center gap-2 flex-wrap">
                <button @click="downloadImportTemplate()" class="px-3 py-2 rounded-xl bg-paper border border-wood-light/40 text-xs font-bold text-wood-dark/70 hover:bg-cream transition">⬇️ 下載匯入範本</button>
                <label class="px-3 py-2 rounded-xl bg-brand text-paper text-xs font-bold hover:bg-brand-dark transition cursor-pointer">
                  📥 匯入 Excel
                  <input type="file" accept=".xlsx,.xls,.csv" @change="handleExcelImport($event)" class="hidden">
                </label>
                <button x-show="!itemFormOpen" @click="resetItemForm(); itemFormOpen=true" class="px-4 py-2 rounded-xl bg-sage text-paper text-sm font-bold hover:bg-sage-dark transition">＋ 新增項目（先選類別）</button>
              </div>
            </div>
            <p x-show="importing" class="text-xs text-sage-dark font-bold mb-3">匯入處理中，請稍候…</p>
            <template x-if="importSummary">
              <div class="mb-4 bg-cream rounded-2xl p-3 text-xs text-wood-dark/70 whitespace-pre-line" x-text="importSummary"></div>
            </template>
            <form id="itemEditForm" x-show="itemFormOpen" @submit.prevent="saveItem" class="grid sm:grid-cols-5 gap-3 mb-6 bg-cream rounded-2xl p-4 items-start scroll-mt-32">
              <div>
                <label class="text-xs font-bold text-wood-dark/60">分類</label>
                <select x-model="itemForm.categoryId" required class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
                  <option value="">選擇分類</option>
                  <template x-for="cat in categories" :key="cat.id"><option :value="cat.id" x-text="`${cat.emoji} ${cat.name}`"></option></template>
                </select>
              </div>
              <div x-show="itemForm.categoryId">
                <label class="text-xs font-bold text-wood-dark/60">名稱</label>
                <input x-model="itemForm.name" required placeholder="項目名稱" class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
                <template x-if="similarItemMatches.length">
                  <div class="mt-1.5 bg-mustard/15 border border-mustard/50 rounded-lg p-2">
                    <p class="text-[11px] font-bold text-wood-dark/70">⚠️ 資料庫中已有名稱相似的品項，確認不是重複新增：</p>
                    <div class="flex flex-wrap gap-1 mt-1">
                      <template x-for="it in similarItemMatches" :key="it.id">
                        <span class="tag-badge" :style="categoryStyle(it.categoryId)" x-text="`${it.name}（剩餘${it.remaining}/${it.total}）`"></span>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
              <template x-if="itemForm.categoryId && isBookCategory(itemForm.categoryId)">
                <div>
                  <label class="text-xs font-bold text-wood-dark/60">出版社</label>
                  <select x-model="itemForm.publisherId" class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
                    <option value="">未選擇</option>
                    <template x-for="p in publishers" :key="p.id"><option :value="p.id" x-text="p.name"></option></template>
                  </select>
                </div>
              </template>
              <div class="sm:col-span-2" x-show="itemForm.categoryId">
                <label class="text-xs font-bold text-wood-dark/60">照片</label>
                <div class="flex bg-cream rounded-full p-1 mt-1 mb-2 w-fit text-xs">
                  <button type="button" @click="itemForm.photoMode='upload'" class="px-3 py-1 rounded-full font-bold" :class="itemForm.photoMode==='upload' ? 'bg-sage text-paper' : 'text-sage-dark'">📁 上傳檔案</button>
                  <button type="button" @click="itemForm.photoMode='url'" class="px-3 py-1 rounded-full font-bold" :class="itemForm.photoMode==='url' ? 'bg-sage text-paper' : 'text-sage-dark'">🔗 輸入網址</button>
                </div>
                <template x-if="itemForm.photoMode==='upload'">
                  <div>
                    <input type="file" accept="image/*" @change="handlePhotoUpload($event)" class="w-full text-xs file:mr-2 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:bg-sage file:text-paper file:font-bold file:text-xs">
                    <p x-show="uploadingPhoto" class="text-xs text-sage-dark mt-1">照片上傳中…</p>
                  </div>
                </template>
                <template x-if="itemForm.photoMode==='url'">
                  <input type="url" x-model="itemForm.photo" placeholder="https://example.com/photo.jpg" class="w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
                </template>
                <div class="mt-2 flex items-center gap-3" x-show="itemForm.photo">
                  <img :src="itemForm.photo" class="w-40 h-40 rounded-xl object-cover border-2 border-wood-light/50 shadow-sm" @error="photoUrlError=true" @load="photoUrlError=false">
                  <button type="button" @click="itemForm.photo = null" class="text-xs text-coral font-bold hover:underline">移除照片</button>
                </div>
                <p x-show="itemForm.photoMode==='url' && itemForm.photo && photoUrlError" class="text-coral text-xs font-bold mt-1">這個網址讀不到圖片，請確認網址是否正確、是否為公開可存取的圖片連結</p>
              </div>
              <div x-show="itemForm.categoryId">
                <label class="text-xs font-bold text-wood-dark/60">總數量</label>
                <input type="number" min="1" x-model.number="itemForm.total" required class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
              </div>
              <div class="flex items-end gap-2 h-full">
                <button type="submit" x-show="itemForm.categoryId" :disabled="submitting" class="w-full py-2 rounded-xl bg-sage text-paper font-bold text-sm hover:bg-sage-dark transition disabled:opacity-50" x-text="itemForm.id ? '儲存修改' : '新增項目'"></button>
                <button type="button" @click="itemFormOpen=false; resetItemForm()" class="py-2 px-3 rounded-xl bg-paper border border-wood-light/40 text-xs font-bold">取消</button>
              </div>

            </form>
            <div class="mb-4">
              <div class="relative">
                <input type="text" x-model="itemSearchText" placeholder="🔍 搜尋項目名稱或出版社，例如：毛毛蟲"
                  class="w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2.5 text-sm pr-20">
                <button type="button" x-show="itemSearchText" @click="itemSearchText=''" class="absolute right-2 top-1/2 -translate-y-1/2 px-3 py-1 rounded-full bg-cream text-xs font-bold text-wood-dark/70 hover:bg-sage-light">清除</button>
              </div>
              <p x-show="itemSearchText.trim()" class="text-xs text-sage-dark font-bold mt-2" x-text="`找到 ${filteredItemGroups.reduce((n,g)=>n+g.list.length,0)} 筆符合的項目，可直接按「編輯」修改名稱、數量、照片`"></p>
            </div>
            <div class="flex items-center justify-between gap-2 mb-3">
              <p class="text-xs text-wood-dark/50">點選類別即可展開／收合該類別的項目清單</p>
              <div class="flex items-center gap-2">
                <button type="button" @click="setAllGroups(true)" class="px-3 py-1.5 rounded-full bg-paper border border-wood-light/40 text-xs font-bold text-wood-dark/70 hover:bg-cream transition">全部展開</button>
                <button type="button" @click="setAllGroups(false)" class="px-3 py-1.5 rounded-full bg-paper border border-wood-light/40 text-xs font-bold text-wood-dark/70 hover:bg-cream transition">全部收合</button>
              </div>
            </div>
            <div class="space-y-3">
              <template x-for="group in filteredItemGroups" :key="groupKey(group)">
                <div class="border border-wood-light/30 rounded-2xl overflow-hidden">
                  <button type="button" @click="toggleGroup(group)" :aria-expanded="isGroupOpen(group)"
                    class="w-full flex items-center justify-between gap-3 px-4 py-3 bg-cream/60 hover:bg-cream transition text-left">
                    <span class="tag-badge" :style="`background:${group.bg};color:${group.text}`" x-text="`${group.emoji} ${group.name}（${group.list.length}）`"></span>
                    <span class="text-xs font-bold text-wood-dark/60 whitespace-nowrap" x-text="itemSearchText.trim() ? '' : (isGroupOpen(group) ? '收合 ▲' : '展開 ▼')"></span>
                  </button>
                  <div x-show="isGroupOpen(group)" class="px-3 pb-3">
                    <div class="overflow-x-auto">
                      <table class="w-full text-sm min-w-[560px]">
                        <thead>
                          <tr class="text-left text-wood-dark/50 text-xs uppercase tracking-wide border-b border-wood-light/30">
                            <th class="py-2 pr-3">照片</th><th class="py-2 pr-3">名稱</th>
                            <th class="py-2 pr-3" x-show="isBookCategory(group.id)">出版社</th>
                            <th class="py-2 pr-3">總數量</th><th class="py-2 pr-3">目前剩餘</th><th class="py-2 pr-3">操作</th>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="it in group.list" :key="it.id">
                            <tr class="border-b border-wood-light/15">
                              <td class="py-3 pr-3">
                                <img x-show="photoOf(it)" :src="photoOf(it)" class="w-20 h-20 rounded-lg object-cover border border-wood-light/30">
                              </td>
                              <td class="py-3 pr-3 font-bold" x-text="it.name"></td>
                              <td class="py-3 pr-3" x-show="isBookCategory(group.id)" x-text="publisherNameOf(it.publisherId) || '－'"></td>
                              <td class="py-3 pr-3 font-num" x-text="it.total"></td>
                              <td class="py-3 pr-3 font-num" x-text="it.remaining"></td>
                              <td class="py-3 pr-3 flex gap-3">
                                <button @click="editItem(it)" class="text-sage-dark font-bold text-xs hover:underline">編輯</button>
                                <button @click="deleteItem(it)" class="text-coral font-bold text-xs hover:underline">刪除</button>
                              </td>
                            </tr>
                          </template>
                          <tr x-show="group.list.length===0"><td :colspan="isBookCategory(group.id) ? 6 : 5" class="py-4 text-center text-wood-dark/30 text-xs">此類別尚無項目</td></tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </template>
              <p x-show="itemSearchText.trim() && filteredItemGroups.length===0" class="text-center text-wood-dark/40 text-sm py-8">找不到符合的項目，請換個關鍵字試試</p>
            </div>
          </div>

          <div class="paper-card rounded-3xl p-6 shadow-card">
            <h2 class="font-heading font-black text-lg mb-4 flex items-center gap-2"><span class="text-2xl">🏫</span> 班級與老師姓名管理</h2>
            <div class="grid sm:grid-cols-2 gap-6">
              <div>
                <h3 class="font-heading font-bold text-sm mb-2">班級清單</h3>
                <div class="flex items-end gap-2 mb-3">
                  <input x-model="newClassName" @keydown.enter.prevent="addClass()" placeholder="例如：貓咪班" class="flex-1 rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
                  <button @click="addClass()" class="px-4 py-2 rounded-xl bg-sage text-paper text-sm font-bold hover:bg-sage-dark transition">＋ 新增</button>
                </div>
                <div class="flex flex-wrap gap-2">
                  <template x-for="c in classes" :key="c"><div class="flex items-center gap-2 paper-card rounded-full pl-4 pr-2 py-1"><span class="text-sm font-bold" x-text="c"></span><button @click="deleteClass(c)" class="text-coral text-xs font-bold hover:underline">刪除</button></div></template>
                  <p x-show="classes.length===0" class="text-xs text-wood-dark/40 py-2">尚未新增任何班級</p>
                </div>
              </div>
              <div>
                <h3 class="font-heading font-bold text-sm mb-2">老師姓名清單</h3>
                <div class="flex items-end gap-2 mb-3">
                  <input x-model="newTeacherRosterName" @keydown.enter.prevent="addTeacherRoster()" placeholder="例如：吳老師" class="flex-1 rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
                  <button @click="addTeacherRoster()" class="px-4 py-2 rounded-xl bg-sage text-paper text-sm font-bold hover:bg-sage-dark transition">＋ 新增</button>
                </div>
                <div class="flex flex-wrap gap-2">
                  <template x-for="n in teacherRoster" :key="n"><div class="flex items-center gap-2 paper-card rounded-full pl-4 pr-2 py-1"><span class="text-sm font-bold" x-text="n"></span><button @click="deleteTeacherRoster(n)" class="text-coral text-xs font-bold hover:underline">刪除</button></div></template>
                  <p x-show="teacherRoster.length===0" class="text-xs text-wood-dark/40 py-2">尚未新增任何老師姓名</p>
                </div>
              </div>
            </div>
          </div>

          <div class="paper-card rounded-3xl p-6 shadow-card">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
              <h2 class="font-heading font-black text-lg flex items-center gap-2"><span class="text-2xl">🔑</span> 登入紀錄查詢</h2>
              <div class="flex items-center gap-2">
                <input x-model="loginSearchText" @input="loginLogsShowAll=false" @input.debounce.600ms="searchLoginLogs()" @keydown.enter.prevent="searchLoginLogs()" placeholder="輸入姓名或 Email 查詢" class="rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm w-56">
                <button type="button" @click="searchLoginLogs()" :disabled="loginSearching" class="px-4 py-2 rounded-xl bg-sage text-paper text-sm font-bold hover:bg-sage-dark transition disabled:opacity-50" x-text="loginSearching ? '查詢中…' : '🔍 查詢'"></button>
              </div>
            </div>
            <div x-show="loginLogsError" x-cloak class="mb-4 bg-coral/10 border border-coral/40 rounded-2xl p-3 text-xs text-wood-dark/80">
              <p class="font-bold text-coral">⚠️ 無法讀取登入紀錄（錯誤代碼：<span class="font-num" x-text="loginLogsError"></span>）</p>
              <p class="mt-1" x-show="loginLogsError==='permission-denied'">原因：Firestore 安全規則不允許目前帳號讀取 <b>loginLogs</b> 集合。請到 Firebase 後台 → Firestore Database → 規則，允許管理員讀取 loginLogs（其他功能不受影響）。</p>
              <p class="mt-1" x-show="loginLogsError!=='permission-denied'">請稍後重新整理頁面再試；若持續發生，請把這個錯誤代碼提供給系統維護者。</p>
            </div>
            <p x-show="!loginSearchText.trim()" class="text-xs text-wood-dark/50 mb-3">目前顯示最新登入紀錄。輸入姓名或 Email 後，會直接向資料庫查詢全部歷史紀錄。</p>
            <p x-show="loginSearchText.trim() && loginSearching" class="text-xs text-sage-dark font-bold mb-3">正在向資料庫查詢全部歷史紀錄…</p>
            <p x-show="loginSearchText.trim() && !loginSearching && loginSearchedKw===loginSearchText.trim() && !loginSearchError" class="text-xs text-sage-dark font-bold mb-3" x-text="`資料庫查詢完成，共找到 ${filteredLoginLogs.length} 筆紀錄（姓名／Email 需從開頭輸入才能查到較早的紀錄）`"></p>
            <p x-show="loginSearchError" class="text-xs text-coral font-bold mb-3" x-text="`資料庫查詢失敗（${loginSearchError}），目前僅顯示已載入的最新紀錄`"></p>
            <div class="overflow-x-auto">
              <table class="w-full text-sm min-w-[480px]">
                <thead>
                  <tr class="text-left text-wood-dark/50 text-xs uppercase tracking-wide border-b border-wood-light/30">
                    <th class="py-2 pr-3">姓名</th>
                    <th class="py-2 pr-3">Email</th>
                    <th class="py-2 pr-3">登入時間</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="l in visibleLoginLogs" :key="l.id">
                    <tr class="border-b border-wood-light/15 hover:bg-cream/60">
                      <td class="py-3 pr-3 font-bold" x-text="l.displayName || '（未提供姓名）'"></td>
                      <td class="py-3 pr-3 text-xs text-wood-dark/60" x-text="l.email"></td>
                      <td class="py-3 pr-3 font-num" x-text="l.timestamp"></td>
                    </tr>
                  </template>
                  <tr x-show="filteredLoginLogs.length===0"><td colspan="3" class="py-8 text-center text-wood-dark/40">目前沒有符合條件的登入紀錄</td></tr>
                </tbody>
              </table>
            </div>
            <div x-show="filteredLoginLogs.length>3" class="text-center mt-4">
              <button @click="loginLogsShowAll=!loginLogsShowAll" class="text-sage-dark text-sm font-bold hover:underline" x-text="loginLogsShowAll ? '收合紀錄 ▲' : `展開其餘 ${filteredLoginLogs.length-3} 筆 ▼`"></button>
            </div>
          </div>

          <div class="paper-card rounded-3xl p-6 shadow-card">
            <h2 class="font-heading font-black text-lg mb-3 flex items-center gap-2"><span class="text-2xl">🗑️</span> 刪除紀錄（可還原誤刪資料）</h2>
            <input x-model="delLogQ" @input="delLogShowAll=false" placeholder="🔍 搜尋老師名稱、項目或刪除人" class="w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm mb-3">
            <div class="space-y-2">
              <template x-for="l in visibleDeleteLogs" :key="l.id"><div class="bg-cream rounded-xl p-3 border border-wood-light/30 text-sm">
                <p><span class="tag-badge tag-pending" x-text="l.type"></span> <span class="font-bold" x-text="l.summary"></span></p>
                <p class="text-xs text-wood-dark/50 mt-1" x-text="`刪除人：${l.deletedBy}　時間：${l.deletedAt}`"></p>
                <div class="mt-2 flex items-center gap-2">
                  <button x-show="l.snapshot && !l.restored" @click="restoreDeleted(l)" class="px-3 py-1.5 rounded-lg bg-sage text-paper text-xs font-bold hover:bg-sage-dark">↩︎ 還原這筆</button>
                  <span x-show="l.restored" class="text-xs font-bold text-sage-dark" x-text="`✅ 已還原（${l.restoredBy}　${l.restoredAt}）`"></span>
                  <span x-show="!l.snapshot && !l.restored" class="text-[11px] text-wood-dark/40">（較早的刪除紀錄，無法還原）</span>
                </div></div></template>
              <p x-show="filteredDeleteLogs.length===0" class="text-xs text-wood-dark/40 text-center py-4">沒有符合的刪除紀錄</p>
            </div>
            <div x-show="filteredDeleteLogs.length>3" class="text-center mt-4">
              <button @click="delLogShowAll=!delLogShowAll" class="text-sage-dark text-sm font-bold hover:underline" x-text="delLogShowAll ? '收合紀錄 ▲' : `展開其餘 ${filteredDeleteLogs.length-3} 筆 ▼`"></button>
            </div>
          </div>
        </section>
      </main>

      <footer class="text-center text-xs text-wood-dark/40 py-6">by Kelly 2026.08</footer>
