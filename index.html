              <h1 class="font-heading font-black text-xl leading-tight tracking-wide">仁德非營利幼兒園</h1>

          <div class="flex items-center gap-3">

        <div x-show="isAdmin" class="max-w-6xl mx-auto px-5 pb-3 flex flex-wrap items-center gap-2">
          <button @click="shareSystemLink()" class="flex items-center gap-1.5 px-4 py-2 rounded-full bg-paper/15 hover:bg-paper/25 text-paper text-xs font-bold transition">📤 分享／複製系統連結</button>
          <button @click="exportInventoryCSV()" class="flex items-center gap-1.5 px-4 py-2 rounded-full bg-paper/15 hover:bg-paper/25 text-paper text-xs font-bold transition">⬇️ 下載財產清冊（CSV）</button>
          <span x-show="shareLinkNotice" x-text="shareLinkNotice" class="text-xs text-cream/90 font-bold"></span>
        </div>
        <nav class="max-w-6xl mx-auto px-5 flex flex-wrap gap-2 pb-3">
          <button @click="view='teacher'"
            class="px-5 py-2 rounded-full font-heading font-bold text-sm transition-all"
            :class="view==='teacher' ? 'washi-tab-active' : 'bg-paper/20 text-paper/85 hover:bg-paper/30'">
            🧸 老師借還登記區
          </button>
          <button @click="view='laminate'"
            class="px-5 py-2 rounded-full font-heading font-bold text-sm transition-all"
            :class="view==='laminate' ? 'washi-tab-active' : 'bg-paper/20 text-paper/85 hover:bg-paper/30'">
            🧷 護貝膜申請
          </button>
          <button x-show="(isAdmin || planOpen) && !restrictedPW" @click="view='plan'"
            class="px-5 py-2 rounded-full font-heading font-bold text-sm transition-all"
            :class="view==='plan' ? 'washi-tab-active' : 'bg-paper/20 text-paper/85 hover:bg-paper/30'">
            📚 教學計畫
          </button>
          <button x-show="!restrictedPW" @click="view='weekly'; weeklyMode='mine'; window.WeeklyUI && WeeklyUI.setMode('mine')"
            class="px-5 py-2 rounded-full font-heading font-bold text-sm transition-all"
            :class="(view==='weekly' && weeklyMode!=='all') ? 'washi-tab-active' : 'bg-paper/20 text-paper/85 hover:bg-paper/30'">
            📝 週誌
          </button>
          <button x-show="isAdmin && !restrictedPW" @click="view='weekly'; weeklyMode='all'; window.WeeklyUI && WeeklyUI.setMode('all')"
            class="px-5 py-2 rounded-full font-heading font-bold text-sm transition-all"
            :class="(view==='weekly' && weeklyMode==='all') ? 'washi-tab-active' : 'bg-paper/20 text-paper/85 hover:bg-paper/30'">
            🗂️ 週誌總覽
          </button>
          <button x-show="isAdmin" @click="view='admin'"
            x-effect="if (!titleTimer) document.title = (isAdmin && adminPendingCount>0 ? `(${adminPendingCount}) ` : '') + baseTitle"
            class="px-5 py-2 rounded-full font-heading font-bold text-sm transition-all"
            :class="view==='admin' ? 'washi-tab-active' : 'bg-paper/20 text-paper/85 hover:bg-paper/30'">
            📋 管理者後台
            <span x-show="adminPendingCount>0" class="ml-1 px-2 py-0.5 rounded-full bg-coral text-paper text-xs font-num" x-text="adminPendingCount"></span>
          </button>
        </nav>
      </header>

      <main class="max-w-6xl mx-auto px-5 mt-6">

        <!-- ============ 老師端 ============ -->
        <section x-show="view==='teacher'" class="grid md:grid-cols-5 gap-6">

          <div class="md:col-span-2 paper-card rounded-3xl p-6 shadow-card h-fit">
            <h2 class="font-heading font-black text-lg mb-4 flex items-center gap-2"><span class="text-2xl">✏️</span> 借還登記</h2>
            <div class="flex bg-sage-light rounded-full p-1 mb-5">
              <button @click="formMode='borrow'" class="flex-1 py-2 rounded-full text-sm font-heading font-bold transition-all"
                :class="formMode==='borrow' ? 'bg-sage text-paper shadow' : 'text-sage-dark'">📚 借用</button>
              <button @click="formMode='return'" class="flex-1 py-2 rounded-full text-sm font-heading font-bold transition-all"
                :class="formMode==='return' ? 'bg-sage text-paper shadow' : 'text-sage-dark'">↩️ 歸還</button>
            </div>

            <!-- 借用表單 -->
            <template x-if="formMode==='borrow'">
              <form @submit.prevent="submitBorrow" class="space-y-4">
                <div x-show="pairs.length>0">
                  <label class="text-sm font-bold text-wood-dark/80">老師／班級</label>
                  <select x-model="pairPick" @change="pickPair()" class="mt-1 w-full rounded-xl border bg-paper px-3 py-2 text-sm"
                    :class="(!borrowForm.borrower.trim() || !borrowForm.className) ? 'border-coral/60' : 'border-wood-light/50'">
                    <option value="">請選擇老師／班級</option>
                    <template x-for="p in pairObjs" :key="'pp_'+p.key"><option :value="p.key" x-text="p.key"></option></template>
                    <option value="__other__">✏️ 其他（手動輸入老師與班級）</option>
                  </select>
                  <p x-show="pairPick!=='__other__' && (!borrowForm.borrower.trim() || !borrowForm.className)" class="text-coral text-xs font-bold mt-1">必填</p>
                </div>
                <div x-show="pairs.length===0 || pairPick==='__other__'" class="space-y-4">
                <div>
                  <label class="text-sm font-bold text-wood-dark/80">老師姓名</label>
                  <div>
                  <select x-model="teacherPick" @change="$nextTick(() => { borrowForm.borrower = (teacherPick==='__other__' ? '' : teacherPick); })"
                    class="mt-1 w-full rounded-xl border bg-paper px-3 py-2 text-sm"
                    :class="!borrowForm.borrower.trim() ? 'border-coral/60' : 'border-wood-light/50'">
                    <option value="">請選擇老師</option>
                    <template x-for="n in teacherSuggestions" :key="'bt_'+n"><option :value="n" x-text="n"></option></template>
                    <option value="__other__">✏️ 其他（手動輸入姓名）</option>
                  </select>
                  <input x-show="teacherPick==='__other__'" x-model="borrowForm.borrower" placeholder="請輸入老師姓名，例如：王老師"
                    class="mt-2 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
                  </div>
                  <p x-show="!borrowForm.borrower.trim()" class="text-coral text-xs font-bold mt-1">必填</p>
                </div>

                          <tr class="text-left text-wood-dark/50 text-xs uppercase tracking-wide border-b border-wood-light/30">
                            <th class="py-2 pr-3">照片</th><th class="py-2 pr-3">名稱</th>
                            <th class="py-2 pr-3" x-show="isBookCategory(group.id)">出版社／分類</th>
                            <th class="py-2 pr-3">總數量</th><th class="py-2 pr-3">目前剩餘</th><th class="py-2 pr-3">操作</th>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="it in group.list" :key="it.id">
                            <tr class="border-b border-wood-light/15">
                              <td class="py-3 pr-3">
                                <img x-show="photoOf(it)" :src="photoOf(it)" class="w-20 h-20 rounded-lg object-cover border border-wood-light/30">
                              </td>
                              <td class="py-3 pr-3 font-bold" x-text="it.name"></td>
                              <td class="py-3 pr-3" x-show="isBookCategory(group.id)" x-text="(publisherNameOf(it.publisherId) || '－') + (genreLabel(it) ? '｜' + genreLabel(it) : '')"></td>
                              <td class="py-3 pr-3 font-num" x-text="it.total"></td>
                              <td class="py-3 pr-3 font-num" x-text="it.remaining"></td>
                              <td class="py-3 pr-3 flex gap-3">
                                <button @click="editItem(it)" class="text-sage-dark font-bold text-xs hover:underline">編輯</button>
                                <button @click="deleteItem(it)" class="text-coral font-bold text-xs hover:underline">刪除</button>
                              </td>
                            </tr>
                          </template>
                          <tr x-show="group.list.length===0"><td :colspan="isBookCategory(group.id) ? 6 : 5" class="py-4 text-center text-wood-dark/30 text-xs">此類別尚無項目</td></tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </template>
              <p x-show="itemSearchText.trim() && filteredItemGroups.length===0" class="text-center text-wood-dark/40 text-sm py-8">找不到符合的項目，請換個關鍵字試試</p>
            </div>
          </div>

          <div class="paper-card rounded-3xl p-6 shadow-card">
            <h2 class="font-heading font-black text-lg mb-4 flex items-center gap-2"><span class="text-2xl">🏫</span> 班級與老師姓名管理</h2>
            <div class="grid sm:grid-cols-2 gap-6">
              <div>
                <h3 class="font-heading font-bold text-sm mb-2">班級清單</h3>
                <div class="flex items-end gap-2 mb-3">
                  <input x-model="newClassName" @keydown.enter.prevent="addClass()" placeholder="例如：貓咪班" class="flex-1 rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
                  <button @click="addClass()" class="px-4 py-2 rounded-xl bg-sage text-paper text-sm font-bold hover:bg-sage-dark transition">＋ 新增</button>
                </div>
                <div class="flex flex-wrap gap-2">
                  <template x-for="c in classes" :key="c"><div class="flex items-center gap-2 paper-card rounded-full pl-4 pr-2 py-1"><span class="text-sm font-bold" x-text="c"></span><button @click="deleteClass(c)" class="text-coral text-xs font-bold hover:underline">刪除</button></div></template>
                  <p x-show="classes.length===0" class="text-xs text-wood-dark/40 py-2">尚未新增任何班級</p>
                </div>
              </div>
              <div>
                <h3 class="font-heading font-bold text-sm mb-2">老師姓名清單</h3>
                <div class="flex items-end gap-2 mb-3">
                  <input x-model="newTeacherRosterName" @keydown.enter.prevent="addTeacherRoster()" placeholder="例如：吳老師" class="flex-1 rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
                  <button @click="addTeacherRoster()" class="px-4 py-2 rounded-xl bg-sage text-paper text-sm font-bold hover:bg-sage-dark transition">＋ 新增</button>
                </div>
                <div class="flex flex-wrap gap-2">
                  <template x-for="n in teacherRoster" :key="n"><div class="flex items-center gap-2 paper-card rounded-full pl-4 pr-2 py-1"><span class="text-sm font-bold" x-text="n"></span><button @click="deleteTeacherRoster(n)" class="text-coral text-xs font-bold hover:underline">刪除</button></div></template>
                  <p x-show="teacherRoster.length===0" class="text-xs text-wood-dark/40 py-2">尚未新增任何老師姓名</p>
                </div>
              </div>
            </div>
          </div>

          <div class="paper-card rounded-3xl p-6 shadow-card">
            <h2 class="font-heading font-black text-lg mb-1 flex items-center gap-2"><span class="text-2xl">🧑‍🏫</span> 老師／班級組合（借用時一鍵選擇）</h2>
            <p class="text-xs text-wood-dark/50 mb-3">設定後，老師借用時只要選一個「老師／班級」，不用再分別選姓名和班級。例如：一一老師／仙草花班</p>
            <div class="flex flex-wrap items-end gap-2 mb-3">
              <input x-model="newPairTeacher" list="pairTeacherList" placeholder="老師姓名，例如：一一老師" class="flex-1 min-w-[150px] rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
              <datalist id="pairTeacherList"><template x-for="n in teacherRoster" :key="'dl_'+n"><option :value="n"></option></template></datalist>
              <input x-model="newPairClass" @keydown.enter.prevent="addPair()" list="pairClassList" placeholder="班級，例如：仙草花班" class="flex-1 min-w-[150px] rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
              <datalist id="pairClassList"><template x-for="c in classes" :key="'dc_'+c"><option :value="c"></option></template></datalist>
              <button @click="addPair()" class="px-4 py-2 rounded-xl bg-sage text-paper text-sm font-bold hover:bg-sage-dark transition">＋ 新增組合</button>
            </div>
            <div class="flex flex-wrap gap-2">
              <template x-for="p in pairObjs" :key="'pl_'+p.key"><div class="flex items-center gap-2 paper-card rounded-full pl-4 pr-2 py-1"><span class="text-sm font-bold" x-text="p.key"></span><button @click="deletePair(p.key)" class="text-coral text-xs font-bold hover:underline">刪除</button></div></template>
              <p x-show="pairs.length===0" class="text-xs text-wood-dark/40 py-2">尚未設定組合；未設定時，借用表單仍使用「姓名」與「班級」兩個選項。</p>
            </div>
          </div>

          <div class="paper-card rounded-3xl p-6 shadow-card">
            <h2 class="font-heading font-black text-lg mb-3 flex items-center gap-2"><span class="text-2xl">📚</span> 繪本分類與清冊匯出</h2>
            <div class="bg-cream rounded-2xl p-3 mb-4">
              <p class="text-sm font-bold mb-2">① 勾選要匯出的分類</p>
              <div class="flex flex-wrap gap-x-4 gap-y-2">
                <template x-for="g in [...genres, '未分類']" :key="'eg_'+g"><label class="flex items-center gap-1.5 text-sm font-bold"><input type="checkbox" :value="g" x-model="exportGenres" class="w-4 h-4 accent-sage"> <span x-text="g"></span></label></template>
              </div>
              <div x-show="exportGenres.includes('文化類')" class="mt-2 pl-4 border-l-4 border-sage/40">
                <p class="text-xs font-bold text-wood-dark/60 mb-1">文化類次目錄（不勾選＝全部文化類）</p>
                <div class="flex flex-wrap gap-x-4 gap-y-1"><template x-for="u in cultureSubs" :key="'es_'+u"><label class="flex items-center gap-1.5 text-sm"><input type="checkbox" :value="u" x-model="exportSubs" class="w-4 h-4 accent-sage"> <span x-text="u"></span></label></template></div>
              </div>
              <div class="flex flex-wrap items-center gap-2 mt-3">
                <button type="button" @click="exportGenres=[...genres,'未分類']" class="px-3 py-1.5 rounded-full bg-paper border border-wood-light/40 text-xs font-bold">全選</button>
                <button type="button" @click="exportGenres=[]; exportSubs=[]" class="px-3 py-1.5 rounded-full bg-paper border border-wood-light/40 text-xs font-bold">清除</button>
                <button type="button" @click="exportBooksCSV()" class="px-4 py-2 rounded-xl bg-brand text-paper text-xs font-bold hover:bg-brand-dark">⬇️ 匯出所選分類清冊（CSV）</button>
                <span class="text-xs text-sage-dark font-bold" x-text="`符合 ${exportBookList.length} 筆`"></span>
              </div>
            </div>
            <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
              <p class="text-sm font-bold">② 為繪本設定分類 <span class="text-xs font-normal text-wood-dark/50" x-text="classifyAll ? `（全部繪本 ${classifyTotal} 本）` : `（尚未分類 ${classifyTotal} 本）`"></span></p>
              <div class="flex items-center gap-2">
                <button type="button" @click="autoClassifyBooks()" class="px-3 py-1.5 rounded-full bg-paper border border-wood-light/40 text-xs font-bold">✨ 依書名自動分類</button>
                <label class="flex items-center gap-1.5 text-xs font-bold"><input type="checkbox" x-model="classifyAll" @change="classifyMore=false" class="w-4 h-4 accent-sage"> 顯示全部</label>
              </div>
            </div>
            <div class="space-y-2">
              <template x-for="it in classifyList" :key="'cf_'+it.id"><div class="flex flex-wrap items-center gap-2 bg-cream rounded-xl p-2 border border-wood-light/30">
                <span class="flex-1 min-w-[160px] text-sm font-bold" x-text="it.name"></span>
                <select @change="setItemGenre(it, $event.target.value)" class="rounded-lg border border-wood-light/50 bg-paper px-2 py-1 text-sm">
                  <option value="" :selected="!it.genre">未分類</option>
                  <template x-for="g in genres" :key="'cg_'+it.id+g"><option :value="g" :selected="it.genre===g" x-text="g"></option></template>
                </select>
                <select x-show="it.genre==='文化類'" @change="setItemSub(it, $event.target.value)" class="rounded-lg border border-wood-light/50 bg-paper px-2 py-1 text-sm">
                  <option value="" :selected="!it.sub">（未分次目錄）</option>
                  <template x-for="u in cultureSubs" :key="'cs_'+it.id+u"><option :value="u" :selected="it.sub===u" x-text="u"></option></template>
                </select>
              </div></template>
              <p x-show="classifyList.length===0" class="text-xs text-wood-dark/40 text-center py-4">所有繪本都已分類 🎉</p>
            </div>
            <div x-show="classifyTotal>10" class="text-center mt-3"><button @click="classifyMore=!classifyMore" class="text-sage-dark text-sm font-bold hover:underline" x-text="classifyMore ? '收合 ▲' : `展開其餘 ${classifyTotal-10} 本 ▼`"></button></div>
          </div>

          <div class="paper-card rounded-3xl p-6 shadow-card">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
              <h2 class="font-heading font-black text-lg flex items-center gap-2"><span class="text-2xl">🔑</span> 登入紀錄查詢</h2>
              <div class="flex items-center gap-2">
                <input x-model="loginSearchText" @input="loginLogsShowAll=false" @input.debounce.600ms="searchLoginLogs()" @keydown.enter.prevent="searchLoginLogs()" placeholder="輸入姓名或 Email 查詢" class="rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm w-56">
                <button type="button" @click="searchLoginLogs()" :disabled="loginSearching" class="px-4 py-2 rounded-xl bg-sage text-paper text-sm font-bold hover:bg-sage-dark transition disabled:opacity-50" x-text="loginSearching ? '查詢中…' : '🔍 查詢'"></button>
              </div>
            </div>
            <div x-show="loginLogsError" x-cloak class="mb-4 bg-coral/10 border border-coral/40 rounded-2xl p-3 text-xs text-wood-dark/80">
              <p class="font-bold text-coral">⚠️ 無法讀取登入紀錄（錯誤代碼：<span class="font-num" x-text="loginLogsError"></span>）</p>
              <p class="mt-1" x-show="loginLogsError==='permission-denied'">原因：Firestore 安全規則不允許目前帳號讀取 <b>loginLogs</b> 集合。請到 Firebase 後台 → Firestore Database → 規則，允許管理員讀取 loginLogs（其他功能不受影響）。</p>
              <p class="mt-1" x-show="loginLogsError!=='permission-denied'">請稍後重新整理頁面再試；若持續發生，請把這個錯誤代碼提供給系統維護者。</p>
            </div>
            <p x-show="!loginSearchText.trim()" class="text-xs text-wood-dark/50 mb-3">目前顯示最新登入紀錄。輸入姓名或 Email 後，會直接向資料庫查詢全部歷史紀錄。</p>
            <p x-show="loginSearchText.trim() && loginSearching" class="text-xs text-sage-dark font-bold mb-3">正在向資料庫查詢全部歷史紀錄…</p>
            <p x-show="loginSearchText.trim() && !loginSearching && loginSearchedKw===loginSearchText.trim() && !loginSearchError" class="text-xs text-sage-dark font-bold mb-3" x-text="`資料庫查詢完成，共找到 ${filteredLoginLogs.length} 筆紀錄（姓名／Email 需從開頭輸入才能查到較早的紀錄）`"></p>
            <p x-show="loginSearchError" class="text-xs text-coral font-bold mb-3" x-text="`資料庫查詢失敗（${loginSearchError}），目前僅顯示已載入的最新紀錄`"></p>
            <div class="overflow-x-auto">
              <table class="w-full text-sm min-w-[480px]">
                <thead>
                  <tr class="text-left text-wood-dark/50 text-xs uppercase tracking-wide border-b border-wood-light/30">
                    <th class="py-2 pr-3">姓名</th>
                    <th class="py-2 pr-3">Email</th>
                    <th class="py-2 pr-3">登入時間</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="l in visibleLoginLogs" :key="l.id">
                    <tr class="border-b border-wood-light/15 hover:bg-cream/60">
                      <td class="py-3 pr-3 font-bold" x-text="l.displayName || '（未提供姓名）'"></td>
                      <td class="py-3 pr-3 text-xs text-wood-dark/60" x-text="l.email"></td>
                      <td class="py-3 pr-3 font-num" x-text="l.timestamp"></td>
                    </tr>
                  </template>
                  <tr x-show="filteredLoginLogs.length===0"><td colspan="3" class="py-8 text-center text-wood-dark/40">目前沒有符合條件的登入紀錄</td></tr>
                </tbody>
              </table>
            </div>
            <div x-show="filteredLoginLogs.length>3" class="text-center mt-4">
              <button @click="loginLogsShowAll=!loginLogsShowAll" class="text-sage-dark text-sm font-bold hover:underline" x-text="loginLogsShowAll ? '收合紀錄 ▲' : `展開其餘 ${filteredLoginLogs.length-3} 筆 ▼`"></button>
            </div>
          </div>

          <div class="paper-card rounded-3xl p-6 shadow-card">
            <h2 class="font-heading font-black text-lg mb-3 flex items-center gap-2"><span class="text-2xl">🗑️</span> 刪除紀錄（可還原誤刪資料）</h2>
            <input x-model="delLogQ" @input="delLogShowAll=false" placeholder="🔍 搜尋老師名稱、項目或刪除人" class="w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm mb-3">
            <div class="space-y-2">
              <template x-for="l in visibleDeleteLogs" :key="l.id"><div class="bg-cream rounded-xl p-3 border border-wood-light/30 text-sm">
                <p><span class="tag-badge tag-pending" x-text="l.type"></span> <span class="font-bold" x-text="l.summary"></span></p>
                <p class="text-xs text-wood-dark/50 mt-1" x-text="`刪除人：${l.deletedBy}　時間：${l.deletedAt}`"></p>
                <div class="mt-2 flex items-center gap-2">
                  <button x-show="l.snapshot && !l.restored" @click="restoreDeleted(l)" class="px-3 py-1.5 rounded-lg bg-sage text-paper text-xs font-bold hover:bg-sage-dark">↩︎ 還原這筆</button>
                  <span x-show="l.restored" class="text-xs font-bold text-sage-dark" x-text="`✅ 已還原（${l.restoredBy}　${l.restoredAt}）`"></span>
                  <span x-show="!l.snapshot && !l.restored" class="text-[11px] text-wood-dark/40">（較早的刪除紀錄，無法還原）</span>
                </div></div></template>
              <p x-show="filteredDeleteLogs.length===0" class="text-xs text-wood-dark/40 text-center py-4">沒有符合的刪除紀錄</p>
            </div>
            <div x-show="filteredDeleteLogs.length>3" class="text-center mt-4">
              <button @click="delLogShowAll=!delLogShowAll" class="text-sage-dark text-sm font-bold hover:underline" x-text="delLogShowAll ? '收合紀錄 ▲' : `展開其餘 ${filteredDeleteLogs.length-3} 筆 ▼`"></button>
            </div>
          </div>
        </section>
      </main>

      <footer class="text-center text-xs text-wood-dark/40 py-6">by Kelly 2026.08</footer>
    </div>
  </template>

  <div x-show="toast" x-transition class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-wood-dark text-paper px-5 py-3 rounded-full shadow-soft font-bold text-sm z-50" x-text="toast"></div>
</div>

具，並附玩法說明書、幼兒能懂的工具書或完成圖。","拼圖依難易（案例12–100片）擺放，背面標示數字方便收納；提供挑戰紀錄表與貼紙／印章。","案例調整建議：增加測量工具（體重機、溫度計、沙漏）、含相對與絕對方位的迷宮、六形六色相關範例卡。"]],["展示與合作",["作品標示姓名、日期、作品名稱，每月更換；可請能力好的幼兒擔任關主，教師降低指導。"]]]},{"area":"積木區","src":"邁入學習區的第一步3（積木區 整體規劃設置、區中區設置）","sec":[["規劃前先思考",["本學期積木區的學習目標？教室現有環境條件？依空間與年齡放哪類積木與配件？收納與動線是否順暢？操作與展示方式是否恰當？"]],["空間",["避開主要動線，以櫃／架與其他區區隔；全區至少容納3–4人（一人約0.49坪，不含拿取動線），案例有3–4人或5–6人。","地面平坦；以地線標示搭建區，工作櫃與搭建區之間預留易拿取的動線；牆面保留大面積作圖示與歷程記錄；設置展示區。","至少兩座開放式工作櫃，隨幼兒成熟度再增加。"]],["積木類別與數量",["提供1–3種適齡類別（數量足夠時1種即可）：積木片類（Kapla、骨牌）、小型（小單位積木）、中型（單位積木、火車軌道）、大型（城市積木、空心積木）、自製大積木。","一櫃約為積木片600片、中小型積木約200塊、大型積木約80塊。","選單位積木時，中小班初期可先提供約半套，再視經驗提供整套。"]],["區中區",["規劃練功區（基本步驟、可貼原尺寸範例圖）、挑戰區（平面鋪排與立體搭建）、固定（興趣）發展區（如橋樑、校園附近建築）；幼兒有合作意圖時，區中區逐漸整合成方案。"]],["收納與配件",["中小班用等比例積木圖片加文字標示以便歸位；中大班用完整形狀或倍數關係；較輕放上層、較重放下層；牆面可貼全套積木圖示。","配件：基本與進階範例圖（以顏色圓點或星級標示難易）、實景圖與模型、鬆散素材（紙捲筒、PVC管、木片、壓克力板）、科學材料（彈珠、骨牌）。"]]]},{"area":"組合建構區","src":"邁入學習區的第一步（一）組合建構區環境規劃","sec":[["空間與分區",["獨立完整區域，全區至少容納3–4人、區中區至少2人；案例有5–6人或7–8人，依教具分區中區（如Gigo、LAQ、OK積木、百力智慧片）。","提供地面、桌面、牆面不同操作區；零件小的教具用桌面，零件大的用地面。","櫃體高度約60公分；地線與櫃體至少保留30公分，以免拿取時碰倒作品；各區中區設未完成區與展示空間。"]],["收納",["依形狀、大小、顏色分別擺放（空間小可只依單一元素），並用照片、實物或數字做收拾對應。","籃子高度不超過櫃體空間高度的3/5，幼兒才一眼看到內容。"]],["教具與範例圖",["教具類別：搭接組合類、卡榫組合類；安全、足量、符合年齡（案例3–5歲）；配鬆散材料或科學實驗材料。","範例圖依年齡與經驗分初階到高階：3歲或初次接觸者先模仿拼好的簡單作品，再進入步驟分解圖。範例僅供參考，目標是啟發創造力與想像力。"]],["展示與記錄",["作品介紹含幼兒姓名、日期、作品名稱、特色說明；用不同櫃架、燈光與自然元素做情境展示；拍照與繪圖記錄歷程。"]]]},{"area":"美勞區","src":"邁入學習區的第一步２（美勞區 整體規劃設置）","sec":[["規劃前先思考",["本學期美勞區的學習目標？現有環境？依目標放哪些教具？動線順不順暢？內容能否引起興趣、是否安全？"]],["空間",["規劃平面畫作、立體造型、工藝等不同藝術經驗；全區至少容納3–4人（案例曾有10–11人），區中區至少2人；櫃體長約90公分、高約60公分。","設置在光線充足處（靠窗）；操作桌面與地面照度至少500 Lux（案例）。","水彩區：中小班宜靠近水源或方便取水，大班確認取水動線即可。"]],["桌面與櫃體",["桌面約1/3放材料、步驟圖卡、繪本，約2/3供操作；一座開放式多功能工作櫃加兩個以上區中區；設未完成作品保留區。"]],["展示",["各區中區近期（約三週）作品展示在平視至仰角45度內；較早作品以專題或同類別放高處或教室外展示。"]],["美感空間五層級",["雜亂→整齊明亮→色彩和諧→自然材質與綠化→燈光設計（聚焦凸顯作品、點綴營造氛圍）。"]]]},{"area":"扮演區","src":"邁入學習區的第一步3（扮演區 整體規劃設置）","sec":[["設計原則",["扮演情境要貼近幼兒真實生活經驗，使其「假戲真做」；全區至少容納3–4人（案例5–6人）。","依操作類別設區中區並確認動線；用紗簾、珠簾、燈光營造氛圍；案例操作桌面與地面照度至少500 Lux。"]],["設置類別",["家庭扮演類（廚房、親子、野餐、露營）、社區機構類（醫生、郵差、商店、醫院）、想像角色類（恐龍、太空、童話）。"]],["材料與安全",["年齡越小，材料結構性越高、越具象；年齡越大，結構性越低、創造性越高。","物品分類擺放並有歸位標示；提供尊重不同性別與氣質的玩具；檢查道具有無微小鈕扣可能誤食、電器是否漏電。"]]]}],"two":{"語文區":["兩歲專班語文區全區約容納5–6名幼兒，閱讀角光線充足、安靜柔和，備柔軟坐墊。","分成指物命名區、手指謠區、閱讀區、聽區、一句話區等小區；指物命名以圖片搭配實物、主題更換，可加錄音按鈕或點讀筆讓幼兒自己聽正確發音。","聽區用半隱密空間與點讀筆，書架用紙盒書架方便幼兒取放。"],"數學區":["兩歲專班數學區全區約容納4–6名幼兒；教具以具體可操作、一對一對應為原則，教師先示範「放一個、再放一個」。","拼圖由單一配對、方向對應，逐步進到整幅圖像重建；教具擺放位置固定並以圖示標示。"],"扮演區":["兩歲專班另有扮演區整體規劃與區中區案例，可對照下方原書頁面。"]}},"refs":{"books":[{"title":"邁入學習區的第一步（一）：環境規劃與準備（語文區、數學區、組合建構區）","pages":66,"chars":14182},{"title":"邁入學習區的第一步（二）：環境規劃與準備（美勞區）","pages":57,"chars":16883},{"title":"邁入學習區的第一步（三）：環境規劃與準備（積木區、扮演區）","pages":116,"chars":23014},{"title":"桃園市幼兒園兩歲專班指引（圖片版：語文、數學、生活自理、積木、扮演、美勞、組合建構）","pages":187,"ch":{"語文區":43,"數學區":57,"生活自理區":77,"積木區":89,"扮演區":97,"美勞區":103,"組合建構":115},"end":{"語文區":56,"數學區":76,"生活自理區":88,"積木區":96,"扮演區":102,"美勞區":114,"組合建構":124}},{"title":"2歲專班學習區1（圖片版：扮演、語文、數學）","pages":124,"ch":{"扮演區":8,"語文區":58,"數學區":104},"end":{"扮演區":57,"語文區":103,"數學區":124}}],"pages":[{"b":0,"p":4,"t":"局長序 提供充足的探索環境 開展幼兒無限學習力 「幼兒自主，遊戲為本，全人發展」是所有投入學前教育人員所應具備的共同理念，但 幼兒園老師每天要面對保育、教育、親師溝通等工作，分身乏術，如何讓幼兒在教室中發掘 興趣、建立遊戲秩序進而讓幼兒自主學習，成為親師生三贏的關鍵。 我們常說環境是孩子的第三個老師，有系統的規劃環境讓幼兒循序漸進自主學習是當今 幼教老師必須具備的基礎能力，相當在教室中無形增加許多協助，使教學工作事半功倍，當 幼兒在環境中以自己的方式創造遊戲機制，能自主選擇、探索到進入探究階段，以幼兒為主 體、以遊戲精神貫穿教學的全人發展於此而生。 是故，桃園希望未來三年內全面在幼兒園建置能萌發幼兒自主探究的「學習區」，基本 區域包括語文區、數學區、組合建構區、積木區、扮演區、美勞區等，各園可再因應課程發 展需求增設木工區、室內沙土區、烹飪區、科學區、鬆散素材區或其他特別區域，教育局特 別委託桃園市幼教輔導團為本市幼教老師編製「邁入學習區的第一步」，透過幼兒園實作環 境讓現場教學者能清楚每一個學習區的規劃原則與教玩具陳設建議，初期可依循使用，當運 用層次提升、心得更豐富之後，老師、幼兒透過生活經驗與學習區合為一體，不再只是操作 教玩具，而能運用手邊觸及或生活中蒐集的素材進行研究與解決問題，除了提供支持幼兒的 物質環境並賦予幼兒控制環境的權利，開展其學習歷程，讓環境營造學習、讓學習共創環境。 本手冊分為上、下冊，以營造美感、愛與溫馨的氛圍為設計基調，讓桃園市的孩子們都 能在豐富與充滿溫度的環境中學習，自幼涵養於饒富美感的藝想世界，不只提升創造、建構 與鑑賞能力，也能在遭遇挫折、與人協調、合作解決問題的過程中學習調節情緒。期待透過 手冊的運用與推廣，讓桃園市的幼兒園共創均質、再造優質！ 感謝陳娟娟博士指導本市幼教輔導團編輯本手冊，集結優質幼兒園現況，指引現場教保 服務人員對準備幼兒學習環境能激發更多的創意與做法，讓桃園市幼兒教育的熱忱持續感動 生命、營造出共好的教育未來。 桃園市政府教育局局長 林明裕 謹識 3"},{"b":0,"p":5,"t":"序 幼教輔導團學習社群於學習區之實踐 到桃園輔導我想要挑戰一天輔導完一個公托改制的幼兒園 ( 包含 1 個本園和 4 個分班 )， 這相當不容易，因為轉型（transformative）是根本的改變，是一種對抗根深蒂固的信念與社 會結構的改革方式，這種改革可說是典範的轉移（paradigm shift）（陳淑琴，2007），對抗 的是信念與社會結構。很幸運的楊梅幼兒園經過一年努力，透過輔導課程改革的歷程，逐漸 轉變為學習區萌發的課程模式。之後舉辦學習區分享會，邀請幼教輔導團入班指導，輔導團 成員對於該園的轉變驚嘆和激賞之餘，也希冀能著力於學習區的建置經營，因此提出學習區 實作與應用工作坊，以六個基本學習區為主，並配搭進不同幼兒園觀摩討論，早上進班觀察， 下午討論觀摩問題，並分享其他成員當月於學習區努力的進展，同時也依團員興趣分工將一 學年所收集備課資源和實踐的學習區區中區之實作彙整，提供桃園幼兒園參考使用。 「幼兒自主，遊戲為本，全人發展」是「幼兒園課程與教學品質評估表 2020 版」基本 的理念，對幼兒來說，「遊戲」就是學習，遊戲最能促進幼兒全人發展。從哲學角度看，遊 戲是幼兒學習的主要方式，幼兒在遊戲中建構知識，透過自主選擇，進行符合其發展水準的 遊戲活動，並幫助他們在遊戲中達到發展目標，教保人員必須有目的地創置環境，為幼兒提 供材料、工具以及能促進他們發展的挑戰，為了讓幼兒在遊戲中獲得最大的收穫，應提供「鷹 架」，擁有足夠的知識去創設豐富的環境，因為環境對幼兒大腦的發展至關重要。高品質的 環境，是建立高品質的基於遊戲的課程的基礎。 透過輔導和學習社群，學習區改變後，豐富的學習就在遊戲中，因為知識不是老師說， 孩子記，知識是需要真實的體驗、探索，知識是在老師與孩子共同建構課程的歷程中，這樣 的課程經驗帶給老師很多思考，對老師而言是珍貴的課程經驗。當老師的想法變了，過去以 來固定的教學行為就有了改變的可能，當具專業性的教育信念與行動聯結，也就是所謂的「教 學實踐」。透過遊戲，誠如澳洲課程編制指南所言，保障每一個「生活在當下」的幼兒過「有 意義的生活」，讓他們未來的人生充實而精彩才有可能。 陳娟娟 博士 2020.06.16 4"},{"b":0,"p":6,"t":"CONTENTS 目次 3 序 提供充足的探索環境 開展幼兒無限學習力 3 局長 林明裕 幼教輔導團學習社群於學習區之實踐 4 陳娟娟 博士 6 語文區 語文區環境規劃 - 雙龍國小附幼 6 語文區環境規劃 - 市立楊梅幼兒園 ( 大東分班 ) 13 語文區環境規劃 - 其他案例 17 22 28 數學區 數學區環境規劃 - 新明國小附幼 22 組合建構區 全區整體規劃 - 市立龍潭幼兒園 ( 中正分班 ) 28 - 市立中壢幼兒園 ( 本園 ) 30 - 市立楊梅幼兒園 ( 楊梅分班 ) 32 收納 36 適切的教具 38 展示與紀錄 43 5"},{"b":0,"p":7,"t":"語文區 壹、語文區環境規劃 - 雙龍國小附幼 開學前語文區學期備課方向和活動規劃 教室平面圖與教室全景 教師在 期初規劃合 宜的學習區環境與活 動，提供幼兒多元的 語文探究經驗。 教室全貌 長形教室大小約 59 坪，容納兩個混齡班級共同使用，設有：積木區、美勞區、語文區、組合建構區、 數學區、扮演區、烹飪區等七個學習區，語文區位於教室內側的中段。 6"},{"b":0,"p":8,"t":"教室 平面圖 美勞區 寫 讀 寫 讀 聽 讀 說 數 學 區 演 烹飪區 組合建構區 數學區 積木區 門 組合 建構區 門 扮演區 門 門 語文區 全貌圖 以櫃 / 地墊 / 走道 / 桌椅與其他學習區做區隔，為獨立工作空間，大小可容納 7-8 人 ( 約 7.5 坪左右 )。 規劃合宜的區中區 ( 聽、說、讀、寫、演 ) 五區，教具等規劃和語文區目標相符。 有充足的光線，閱讀區照度 500Lux，桌面照度 350Lux，且靠近電源。 空間色彩以原木色及白色為主色。 運用多元素材如：空心磚搭配木棧板，軟木材質地墊，木頭電纜桌、綠色植物等布 置學習區空間。 學習內容規劃以作家主軸「長谷川義史」串連多元的語文區學習活動。 ※ 調整建議：作品懸掛展示的高度應再降低到仰角 45 度以內為佳。 7"},{"b":0,"p":9,"t":"教室之語文區 語文區 聽區 桌椅高度剛好可以讓幼兒席地而坐，擺放故事、韻文等書籍與 CD、耳罩式耳機 ( 勿使用侵入 式耳機 )、CD 播放器，設置在安靜而獨立的一角使幼兒能盡情享受閱聽的樂趣。 考量幼兒的年齡層，提供國字與圖示說明。 ※ 調整建議：提供酒精棉片讓幼兒使用耳機前後能消毒。 語文區 說區 半隱密的安靜空間，提供錄音設備讓幼兒可於此錄製音檔。 提供錄音機的操作示範圖說，鼓勵幼兒自行操作機器錄音與放音。 鼓勵幼兒錄製故事，記錄編創文本的過程 ( 與讀區串聯 )。 鼓勵幼兒錄製歌曲、心情語錄、祝福的話語送給想祝福的對象 ( 與寫區串聯 )。 8"},{"b":0,"p":10,"t":"語文區 讀區 作家主軸系列書架 於安靜獨立的區域規劃三座書櫃 / 架，16 本以上書本開架展示，圖書完整無缺頁、印刷品質 良好。 作家主軸系列書架前擺放軟木材質的地墊與長靠椅，另兩座書架則是設置柔軟舒適的地毯和富 童趣設計的靠墊，讓幼兒能盡情享受閱讀的樂趣。 書本有對應歸位的標示。 教室之語文區文本形式 韻文散文 臺灣 ( 華人 )、在地、多元文化 故事 知識概念 遊戲書 故事文本以作家「長谷川義史」為主軸，知識概念的書籍則是其他學習區 幼兒有興趣的主題。 遊戲類、韻文、散文類書籍各 3 本。 文化類書籍則有臺灣 ( 華人 )、在地、多元文化各 3 本。 9"},{"b":0,"p":11,"t":"運用木頭電纜桌、植物染布與綠色 植物營造創作小書展示桌，定期 展示幼兒創作的圖文作品、個人小 書、卡片 ......，一旁的沙發讓幼兒 可舒適的坐著欣賞同儕作品，鼓勵 幼兒欣賞與回應彼此作品。 語文區 展示區 創作書 透過對作家主軸書系的深入討論與記錄，了解幼兒閱讀理解的情形。 透過教學記錄與省思，整理出幫助幼兒進行閱讀理解的策略。 幼兒也可以圖文方式回顧在學習區裡的學習活動，教師協助以文字註記內容。 學習歷程 教具操作桌 書寫桌 規劃方便取用的教具櫃兩座， 文具及材料皆分別以淺色工作 籃收納，再依標號對應擺放。 鄰近美勞區水源，方便水墨寫 畫時取換水及清洗用具。 設置光源充足的畫寫桌及操作 桌，內側兩張為教具的操作桌 和書寫桌，外側的桌子則提供 水墨畫字使用。 擺放綠色盆栽美化環境。 水墨畫寫桌 10"},{"b":0,"p":12,"t":"右側 工作櫃 左側 工作櫃 工作籃教具內容如下：文字拼圖 ( 讀 )、 注音夾夾樂 ( 讀 )、注音釣魚 ( 讀 )、注音 拼湊 ( 讀 )、情緒寶盒 ( 說 )、誰是誰 ( 聽 與說 )、順序圖卡 ( 聽與說 )、我會說 ( 說 ) 等共八籃，並視使用狀況替換教具 ( 如： 我會說系列教具 )。 鼓勵幼兒依據年齡層選擇合宜難度的教 具進行操作，如：小班可選擇有趣的「注 音釣魚」，和同儕一起從遊戲中認識注 音符號。中大班則可以挑戰「我會說」 及「誰是誰」等訓練口語表達及邏輯思 考的教具操作。 提供安全且狀況良好、符合幼兒年齡層 ( 3~5 歲 ) 操作的自製與現成之教具。 教具櫃右側及中間之工作籃內容依難到易 標號如下：童詩卡、學生週刊、水墨組、 故事小書、結合韻、注音筆順卡、數字筆 順卡、運筆遊戲、印台與印章。 教具櫃左側提供其他文具及材料：鉛筆 ( 含 削筆器 )、橡皮擦、簽字筆、姓名板、便 條紙與蓋印紙。 教具櫃上方提供祝福卡片範例、毛筆展示 架、小墨筆、水寫布、長紙捲。 ※ 調整建議：可增加一般鉛筆及三角握筆器， 提供大班幼兒做寫前練習。 教室之語文區寫區規劃 幼兒可運用三點抓握鬆散素材去排列 文字與符號，提升執筆能力。 幼兒參考六書文本，認識 文字的演變，體驗用毛筆 畫字，感受不同於硬筆畫 寫的樂趣。 11"},{"b":0,"p":13,"t":"教室之語文區寫區規劃 提供參考卡片範例，幼兒運用自 來水筆結合節慶 ( 母親節 )，練習 畫寫相關的文字。 結合主題，鼓勵幼兒運用簽字筆記 錄心情事件。 語文區 演區 設置作家系列故事桌， 搭 配 故 事 推 車， 提 供 多 個 作 家 系 列 故 事， 供孩子自由合作說演。 幼兒運用鬆散素材（石 頭ヽ不織布ヽ玻璃紙 ヽ藤編盒）製作故事 主角與場景。 12"},{"b":0,"p":14,"t":"貳、語文區環境規劃 - 市立楊梅幼兒園 ( 大東分班 ) 教室平面圖與教室全景 教室全貌 語文區 全貌圖 門 水彩區 數學區 黏土區 拼豆區 展 示 區 OK 積木區 LAQ 櫃 樂 高 積 木 區 教室 平面圖 展示區 未完成區 桌遊 六形 六色區 展示區 數學教具櫃 教具 寫 說 繪 本 書 架 閱讀 區 聽 繪本書架 13"},{"b":0,"p":15,"t":"語文區 全貌圖 全區可容納 5~6 名幼兒。 光線充足，以櫃 / 架 / 地墊 / 走道與其他學習區做區隔。 規劃 2 座書櫃。 分成說演、聽、讀、寫 ( 語文教具 )4 個區中區。 每個區中區的教具符合近便性，方便幼兒拿取。 整體色彩和諧、整齊有序。 名家系列串聯說演和讀區。 語文區 聽區 利用桌面約 1/3 擺放書籍、CD、工具方便幼兒拿取，約 2/3 的桌面可供幼兒放置要聽的書籍以及書寫學習單。 幼兒利用書籍和 CD 一樣的圖示相互對應。( 若書籍和圖樣 無法互相對應時教師可提供有顏色的點貼或者數字對應 ) ※ 調整建議： 可再提供酒精棉片，讓幼兒在使用耳機前、後能消毒。 14"},{"b":0,"p":16,"t":"語文區 說演區 利用鬆散材料和恐龍教具讓幼兒能說演繪本。 提供手機 ( 可請家長提供家中已經不用的舊手機 )，錄影幼兒的說演故事。 提醒老師注意：孩子說故事時是指將故事以口述的方法，複述或轉述。演故 事則是指將故事以表演的呈現，在口說時可將故事改編成演出劇本的方式， 讓幼兒拿棒偶、手偶或動作肢體演出。 右圖為教師設計演出的每一幕 ( 背景 ) 讓幼兒能依故事不同的幕 ( 背景 ) 拿棒 偶、手偶演出。 語文區 讀區 設置 2 個書櫃櫃體高度不超過 60 公分。 開架書籍 12~16 本，書籍量 40 本以上。 書籍依讀物、作家或主題分層架 擺放。 有展示空間，且符合幼兒的視線 角度 ( 平視至仰角 45 度 )。 繪本符合年齡層 ( 教師可依幼兒 年齡層之閱讀發展特徵來選擇， 小班可選擇五味太郎、艾瑞卡爾 等；中班可選擇民間故事、林小 杯等；大班可選擇李歐里奧尼、 陳致元等名家 )。 15"},{"b":0,"p":17,"t":"故事 提供遊戲書、韻文、故事、 散文、知識概念類書籍。 5 類書籍每類書籍 3 本。 ※ 調整建議： 教師提供有關龍的故事和 繪本，屬於華人文化，需 再提供臺灣以及在地縣市 文化圖書各 3 本以上。 華人文化 遊戲書 韻文散文 知識概念 語文區 寫區 語文區 教具 操作區 利用桌面約 1/3 擺放不同的書寫工 具、學習單方便幼兒拿取，約 2/3 的桌面可供幼兒書寫學習單。 提供點讀筆、語文區圖卡等，教師需定期 更換語文教具的內容。 展示與記錄 16 圖表記錄幼兒聽、讀書籍名稱、 日期。 幼兒圖示記錄兒歌、故事、創 作內容並按時間序展示。 教師協助幼兒以文字註記故事 名稱或內容。"},{"b":0,"p":18,"t":"參、語文區環境規劃 - 其他案例 其他教室之語文區全貌 有充足的光線，空間色彩以原木色及白色 有充足的光線，空間色彩簡單和諧。 為主色，簡單和諧。 以櫃 / 簾與其他學習區做區隔，語文區規 劃聽、說、讀、寫、演五個區中區 ( 各區 中區至少規劃兩位幼兒的工作空間 )。 因教室空間不足將開架式書籍陳列於牆。 靠窗的獨立小角落利用多層次的層架來擺放故事、歌謠類等文本與 CD、耳罩 式耳機、CD 播放器。 17"},{"b":0,"p":19,"t":"語文區 聽區 利用壁面懸掛 CD，讓幼兒有更寬的桌面可擺放要聽的繪本。 語文區 說區 語文區 說區 運用故事骰子、教師配合繪本設計教具或 利用現有的語文教材教具來讓孩子有不同 說、創作故事的機會。 幼兒在說區自編故事後，練習說。 幼兒可以選取手機內錄製的兒歌或故事，跟 著吟唱或一邊聽一邊說。 18"},{"b":0,"p":20,"t":"兩座書架，一座展示作家主軸系列文本， 一座則擺放其他繪本，提供多元的繪本讓 幼兒閱讀。 教師擺放突顯繪本作家風格的作品 / 飾物。 語文區 讀區 兩座書架，一座上方展示作家主軸系列文本，一座上方提供遊戲書和散文，下方 則擺放故事、知識百科、韻文類。 幼兒能在不同區域 ( 沙發、地毯 ) 閱讀。 語文區 讀區 繪本結構分析的學習單設計。 幼兒在閱讀作家主軸系列故事後畫下自己的看法或想法。 19"},{"b":0,"p":21,"t":"語文區 聽區 幼兒改編已經多次閱讀後的故事。 教師聚焦主題，讓幼兒閱讀後能畫出或寫出。 語文區 寫區 和主題桌合併之寫區規劃有繪本結構分析練 習、姓名與日期印章、姓名展示牌、運筆練 習、免墨水寫紙 / 毛筆、漢字繪本、幼兒姓 名練習、注音符號蓋印等教具與工作籃。 寫區有注音卡、名字筆順、運筆練習、印 章等設計。 語文區 寫區 寫區有筆順、仿寫沙盤、蓋印遊戲、小書 創作等寫前設計。 寫區有仿寫米盤、迷宮、運筆、姓名筆順、 注音配對、毛筆仿寫等設計。 20"},{"b":0,"p":22,"t":"小書設計的寫區。 迷宮、禪繞畫的寫區設計。 語文區 寫區 語文區 演區 皮影戲的演區。 語文區 演區 教師設計搭 建 幼 兒 可 進 行 故 事 的 說 演的舞台。 設置作家主軸系列故事桌，運用紙盒 與鬆散素材製作故事盒，幼兒可進行 故事的說演。 語文區 演區 提供手偶或棒偶等教具讓幼兒說演。 教師利用布手套自製偶的教具，讓年 齡較低的孩子能穿戴演出。 21"},{"b":0,"p":23,"t":"數學區 ◢ 數學區環境規劃 - 新明國小附幼 語文區 美勞區 儲 物 櫃 / 白 板 扮演區 積木區 數學區 廁所 組合建構區 教室 平面圖 門 作品展示平台 / 書包櫃 門 棉被櫃 教室全貌 教室空間寬敞明亮，共設置語文區、美勞區、數學區、扮演區、積木區 和組合建構區六個基本區。 數學區位於教室的外側，與語文區、美勞區活動屬性相近，多元的區中 區規劃滿足不同幼兒的學習需求。 數學區依學習內容規劃數數區、桌遊區、下棋區、六形六色區、拼圖區 和其他區等六個不同的操作區域（含桌面、壁面、地板）。 22"},{"b":0,"p":24,"t":"桌遊區 下棋區 數數區 六形六色區 拼圖區 其他區 數學區 平面圖 設置獨立工作空間，大小可容納 7-8 人。 收納展示的工作櫃、教具 / 玩具籃、工作盤 / 盒等設備有質感且材質自然、色彩簡單和諧。 以櫃 / 走道與其他學習區做區隔，運用盆栽、吊飾、花束等自然元素綠化與美化空間。 操作的桌面或地面照度至少 350Lux。 有工作盤 / 盒的規劃，工作盤 / 盒的內容材料擺設與數學區的目標相符並有對應歸位的標示， 讓幼兒易於理解及操作。 設有展示空間，且符合幼兒的視線高度 ( 平視至仰角 45°，且欣賞作品最遠位子為該區邊界。) 數學區 數數區 1 依規劃人數提供足量、安全、良好且符合幼兒年齡層的數學教 / 玩具。 考慮幼兒探索教具的近便性，規劃拿取方便的工作櫃和操作桌。 運用綠色植栽盆景、桌巾桌墊美化環境並區隔操作空間，讓擺設的教具增添 美感，散發邀請的學習氛圍。 教具內容： 1. 點數： 數彈珠、巴比倫空間方塊（骰子）。 2. 計數：10 個一數、日曆、七巧拼板。 3. 數的合成：釣魚遊戲、錢幣數一數、撲克牌。 4. 認識數字：數字疊杯、撲克牌、日曆。 數與運算 23"},{"b":0,"p":25,"t":"數學區 數數區 2 數與運算 各項教具 / 玩具、工作盤 / 盒規劃的內容、材料與數學區目標相符，依類別分層擺放，並有對 應歸位的標示（範例：文字 -- 教具名稱）。 各項教具有難易程度的區分（例如☆容易 / ☆☆適中 / ☆☆☆困難），工作櫃上方設有未完成 作品保留區，幼兒可自行拿取。 提供遊戲玩法的說明書、幼兒能理解的工具書或教師自製的進階範例 / 作品完成圖 / 照片，方 便幼兒參考研究（例如：撲克牌數字接龍 )。 ※ 調整建議： 1. 增加挑戰計畫表，將計畫畫在小紙上，帶去看和創作，再討論困難或成功經驗分享。 2. 增加適宜的配件用具等建構性素材（幼兒手製配件）。 3. 作品標示姓名、日期、作品名稱，展示的作品或照片每月調整或更換。 4. 增加幼兒操作和歷程照片，記錄孩子的思考歷程，將經驗製作成經驗圖表或海報，讓幼兒 的創作更有方向性、更有意義。 5. 低指導性，可以安排和善用能力好的小朋友當關主。 規劃六形六色區，擺放足量的六形六色教 具和桌面，進行平面圖形、立體形狀、平 面空間、立體空間的鋪排與堆疊設計。 提供六形六色相關範例卡、幼兒能理解的 工具書或教師自製的進階範例作品完成圖 / 照片，方便幼兒參考研究（例如：六形六 色挑戰卡、圖片、繪本 )。 作品標示姓名、日期、作品名稱，展示的 作品或照片每月調整或更換。 圖形空間 ※ 調整建議： 1. 可增加幼兒興趣相關的圖片、繪 本作為創作時的參考和研究之 用。 2. 可補充適宜的鬆散素材、文具、 學習紀錄表等配件，做為幼兒 創作素材。 3. 將幼兒操作過程照片製作成經驗 圖表的海報，供展示及介紹。 數學區 六形 六色區 24"},{"b":0,"p":26,"t":"數學區 拼圖區 提供各式拼圖，包含有柄拼圖、有底 拼圖、無底拼圖、地板拼圖、立體拼 圖，拼圖片數依難易程度置放（12 片 至 100 片 )。 拼圖背面有圖示（數字），方便收納 整理、避免幼兒混淆。 設置作品保留區，並依幼兒挑戰情形 每月調整或更換。 關係邏輯 提供挑戰紀錄表和記錄工具（貼紙或 印章），鼓勵幼兒挑戰並記錄。 ※ 調整建議： 1. 可增加文化相關、世界風俗立體拼 圖，透過拼圖提升對多元文化的發 現和探索。 2. 適時調整拼圖的難易程度，以符合 各年齡層幼兒的學習需求。 提供測量教具、自製迷宮和空間對應教具，鼓勵幼兒進行 操作、觀察和記錄 ( 重量、長度、溫度 ) 以及空間方位的 辨識。 教具內容： 桌面操作：量體溫。 地面操作：自製迷宮遊戲、比輕重、比一比誰高。 壁面操作：座標遊戲、量身高。 ※ 調整建議： 1. 可提供體重機、溫度計、沙漏、各種量測工具供幼兒 觀察和研究。 數學區 其他區 1 2. 可增加各種形式的迷宮遊戲，提供相對方位（前後、 上下、左右）、絕對方位（東西南北）探索的經驗。 圖形空間與測量 25"},{"b":0,"p":27,"t":"數學區 下棋區 1 資料分析與統計 規劃對弈棋桌、個人 / 研究桌各一張及不同棋類共九項。 設有未完成作品保留區（桌面），幼兒可自行拿取。 空間、工作櫃、教具 / 玩具 / 材料籃、工作盤 / 盒，色彩 簡單和諧。 提供不同難易程度棋類： 1. 教具櫃：西瓜棋、孔明棋、象棋、立體四子棋、顏色 記憶棋。 2. 桌面：井字棋、葡萄棋、割豆腐棋、五子棋。 數學區 下棋區 2 資料分析與統計 葡萄棋挑戰賽 棋桌放置各類棋種的遊戲規則說明圖、紙上棋盤，和對弈紀錄工具。 依據目前進行的棋類挑戰畫出對奕競賽表。 鼓勵幼兒利用寫畫的方式找出成功的策略，一起提升棋藝。 ※ 調整建議： 1. 提供不同棋類的棋譜供幼兒挑戰。 2. 可鼓勵幼兒將下棋遭遇的困難畫在棋譜上，供其他人思考、挑戰 和解決。 3. 定期舉辦不同棋類擂台賽，提升下棋的興趣和成就感。 26"},{"b":0,"p":28,"t":"數學區 桌遊區 1 邏輯關係 ( 代數 ) 桌遊區布置整齊明亮，運用小花瓶區隔遊戲空間，美化操作區域和規則遊戲的學習氛圍。 各項教具 / 玩具、工作盤 / 盒規劃的內容、材料與數學區目標相符。 設有未完成作品保留區，幼兒可自行拿取。 保持桌遊的外盒的完整性，教具的外觀、內容物、數量等，方便幼兒操作完後可依圖示整理歸 位。 ※ 調整建議： 1. 觀察並記錄幼兒操作教具的發展情形，做為更換教具的依據。 2. 張貼桌遊挑戰者姓名、挑戰項目和日期。 數學區 桌遊區 2 邏輯關係 ( 代數 ) 各項教具 / 玩具、工作盤 / 盒規劃的 內容、材料與數學區目標相符，依 類別分層擺放，並有對應歸位的標 示（範例：文字）。 各項教具有難易程度的區分（例如： ☆容易 / ☆☆適中 / ☆☆☆困難）鼓 勵幼兒從易到難、逐步挑戰。 桌遊內容： 形狀遊戲、歡樂公車！ GO、私家偵 探、德國心臟病、快手疊杯、企鵝 敲冰塊、拔毛運動會、逃出叢林、 小偵探找圖、哆寶、諾亞方舟。 ※ 調整建議： 1. 培養小老師：透過大帶小、彼此教 與學的過程，熟悉遊戲規則，體驗 互動遊戲的樂趣。 2. 引導幼兒找出桌遊相似的遊戲規則， 鼓勵幼兒利用素材仿作（如哆寶） 或 設 計 具 有 個 人 / 小 組 / 班 級 / 在 地文化特色的桌遊（如平衡遊戲 -- 諾亞方舟、企鵝疊冰塊或小偵探找 圖 )。 27"},{"b":0,"p":29,"t":"組合建構區 一、全區整體規劃 ( 一 ) 設計重點 1. 留意是否為獨立完整的學習區域以及 可容納的人數 ( 全區至少 3~4 人區中 區至少 2 人以上 )。 2. 有不同的操作區域，如：地面、桌面、 牆面等。 3. 幼兒拿取以及操作教具時的近便性。 4. 提供幼兒擺放未完成作品的區域。 5. 學習區整體色彩和諧、整齊有序。 ( 二 ) 照片說明 教室和組合建構區全貌 市立龍潭幼兒園 ( 中正分班 ) 美勞區 數學區 語文區 積木區 組合建構區 教室 平面圖 28 教室全貌"},{"b":0,"p":30,"t":"組合 建構區 平面圖 展示桌 LAQ 操作區 桌 子 桌 子 工 作 櫃 OK 積木 工作櫃 L A Q 作 品 展 示 區 LASY 積木 工 作 櫃 工 作 櫃 組合建構區 組合 建構區 全貌圖 全區可容納 7~8 名幼兒。 以 櫃 與 其 它 學 習 區 做 區 隔 分 成 lasy、 laq、ok 積木三個區中區，內容和材料的 規劃與組合建構區的目標相符。 各區中區設有未完成區，幼兒可自行拿 取。 各區中區設有展示空間，且符合幼兒的視 線高度。 每個區中區至少能容納 2 名幼兒。 整體色彩和諧、整齊有序。 開放式易拿取的工作櫃兩座，且玩具依 區中區分櫃放置，分層架擺放。 ※ 調整建議： 櫃體高度建議 60cm 左右。 每個區中區的教具符合近便性，方便幼 兒拿取。 29"},{"b":0,"p":31,"t":"教室和組合建構區全貌 市立中壢幼兒園 ( 本園 ) Kapla 積木區 數學區 組合建構區 Gigo 區 線圈桌 G i g o 櫃 線 圈 櫃 G i g o 地 面 操 作 Gigo 櫃 Gigo 展示櫃 語文區 美勞區 教室 平面圖 組合 建構區 平面圖 組合建構區 L A Q 桌 教室全貌 30"},{"b":0,"p":32,"t":"全區可容納 5~6 名幼兒。 分成 gigo、laq、線圈三個區中區。 每個區中區至少能容納 2 名幼兒。 每個區中區的教具符合近便性，方便幼兒拿取。 各區中區設有未完成區，幼兒可自行拿取。 各區中區設有展示空間。 組合 建構區 全貌圖 31"},{"b":0,"p":33,"t":"教室和組合建構區全貌 市立楊梅幼兒園 ( 楊梅分班 ) 教室全貌 語文區 數學區 美勞區 門 組合建構區 積木區 教室 平面圖 展示區 組合建構區 laq 櫃 桌子 百力智慧片 展示區 門 展 示 區 laq 展 示 區 展 示 區 展 示 區 展 示 區 G i g o 積 木 櫃 32 展示區 展示區 Ok 積木櫃 積木區 組合 建構區 平面圖"},{"b":0,"p":34,"t":  編輯工作小組：余黛佳、吳雅芬、楊陳傑、楊雅真、張漪萍、 黃一秀、余佩玲、葉玉嬌、彭儀華、鐘靜芬、 汪素榕、宋敏慧、馮羿萍、趙佩瑛、劉雅慧、 李瑋蓁、黃文昭、沈素香、楊瑞雪、楊璧娟。 出 版 機 關：桃園市政府教育局 電 話：(03)332-2101 網 址：http://www.tyc.edu.tw 美 編 印 刷：優格廣告攝影有限公司 電 話：(06)268-0320 出 版 日 期：中華民國 109 年 12 月"},{"b":1,"p":4,"t":"局長序 優質好環境，開展探索力 讓孩子成為自主學習的主人 環 境 是 幼 兒 的 第 三 位 老 師， 優 質 學 習 環 境 有 助 幼 兒 持 續 探 索 及 開 展 屬 於 自 己的學習力，而優質的關鍵在於「有系統的規劃」讓幼兒循序漸進自主學習。 「幼兒自主，遊戲為本，全人發展」是所有投入幼兒教育人員應具備的共同理念，而 環境規劃更是所有教保服務人員必須具備的基礎能力。在適齡適性、豐富且具有挑戰性的 遊戲情境中，幼兒產生興趣，進而推動探索行動，自主學習與同儕合作從中開展，全人發 展也由此而生。 是 故， 桃 園 市 希 望 能 全 面 在 幼 兒 園 中 建 置 鼓 勵 幼 兒 自 主 探 究 的「 學 習 區」。學習區基本區為幼兒發展與基本能力的培養，區域包含語文區、數學區、組合建構區、 美勞區、積木區、扮演區，共六區。為使教保服務人員能更清楚每個基本區的規劃原則與 陳設建議，本局賡續委託桃園市幼教輔導團為本市教保服務人員編製「邁入學習區的第一 步」指引手冊。本手冊共有三冊，以營造美感、愛與溫馨的氛圍為設計基調。初期可依循 使用，當教學者運用層次提升，經驗更豐富時，鼓勵師生發揮巧思，從生活中提取學習素 材，讓幼兒園的學習更貼近生活。亦可因應幼兒需求與教學發展特色增設特別區與戶外區， 如：木工區、烹飪區、科學區、種植區等學習區。 感謝陳娟娟博士指導本市幼教輔導團編輯本手冊，集結市內優質幼兒園現況，提供現 場教保服務人員指引。期待透過手冊的運用與推廣，陪伴教保服務人員學習與成長，激發 更多的熱忱、創意與做法，讓幼兒園學習環境優質、教學品質升級，讓大眾看見幼兒教育 的豐富新面貌。 桃園市政府教育局局長 劉仲成 謹識 3"},{"b":1,"p":5,"t":"序 教學翻轉由美勞區開始 幼兒園下定決心要改變教學，常從美勞區開始。首先第一階要教學正常化，以遊戲為本， 提供豐富的學習環境，讓幼兒主動學習。這階段主要的目標是，透過遊戲讓幼兒成為主動學 習者，教師要關注並思考各種材料放置位置，以及與幼兒交談的方式是否能支援且挑戰幼兒 所做的活動，在此過程中，教師和幼兒是學習夥伴（沙莉、姚堯、夏婧譯，2017）。依照「幼 兒園課程與教學評估表」規劃各學習區適宜的範圍，檢視學習區教具擺放的位置及材料多元、 學習區間的互動性與干擾性、資源之適切性，落實幼兒自主學習。 為落實幼兒自主學習，教師們採取策略是將主題活動融入學習區，運用圖片、步驟、工 具書和實物，帶領幼兒自主學習，這就是 Singer & Singer 所言，有經驗的教師在培養幼兒對 遊戲環境的信任感和安全感方面，要使用種種策略「加大投入」，促進幼兒的發展（Singer & Singer, 1980）。在開放的學習區中，每個人包括幼兒和老師，都可以用自己的速度和方法， 決定自己成長的方式，真心喜歡是最重要的。這時教師並非一昧地模仿或照單全收，他們會 思考教具操作步驟和範例的適用性和合宜性。學習區改成 2-5 人的規劃後，幼兒間互動變頻 繁，常看到幼兒表現出愉快的情感以及自主的選擇（Ebbeck & Waniganayake, 2016）。教師 的學習跟幼兒一樣，幼兒從做中得到信心，教師也是如此，幼兒透過操作直接將訊息回饋給 教師，「唯有把對方需求放在眼裡，才有辦法貼近對方思維，做出符合對方需求的思考。」 開學前採學習區共備課方式，教師結合幼兒發展與素材概念分析，提供學習區規劃的 相關資訊，例如：幼兒園專業輔導粉絲頁、幼師寶典和幼師口袋網站，以及以圖片分享為主 軸的社群平臺「pinterest」，透過分享平臺作為個人創意與專案所需的視覺探索工具，運用 pinterest 網站備課，依照自己學習區的分區，將畫面儲存後依據作品類別和操作難易程度， 組織成幼兒能看得懂的步驟印出，做成操作步驟和範例。運用 pinterest 備課和檢討，讓大家 有一個商討的平臺，十分具體且容易明白。在共備課會議中針對某一個材料或玩具做詳細的 討論，包括玩具的組件種類、如何組裝、作品類別與年齡的關係、範例怎麼做、範例如何放、 操作時可能會碰到的問題等充分討論，讓幼兒都可以在學習區，找到自己喜歡的各種挑戰。 當幼兒能做出自己想要的作品後，再導引幼兒研究此作品的相關知識，透過百科、繪本或至 現場體驗研究，歸納出研究標的特質，將作品與研究標的比較，再根據不一樣之處做修改， 而將研究標的漸漸到位的建構出來。幼兒所萌發的小方案是經由探索、試驗、檢討與分享的 歷程，再透過教師協助或是提供鷹架，形成一個問題帶動解決方法的循環。 走過教學翻轉歷程，所謂的專業發展輔導是面對真實的現場，包括園長及教師或是輔導 教授緩慢交心的過程，更是一門難以言喻的人際互動藝術。而當所有成員對輔導有感覺或感 動時，真正的教學翻轉改變才開始。 陳娟娟 博士 ONTENTS 目次 美勞區 3 序 優質好環境，開展探索力 讓孩子成為自主學習的主人 3 劉仲成 局長 教學翻轉由美勞區開始 4 陳娟娟 博士 6 整體規劃設置 教室與美勞區的全貌案例 - 桃園市立中壢幼兒園 8 教室與美勞區的全貌案例 - 桃園市立龍潭幼兒園 10 教室與美勞區的全貌案例 - 桃園市立楊梅幼兒園 12 14 區中區設置 區中區實例分享 1. 繪畫類 16 3. 捏塑類 35 5. 多元材料創作類 59 6. 回收材料創作類 65 2. 紙工類 23 4. 編織類 43 75 方案課程 串珠課程為例 - 桃園市立楊梅幼兒園 4 5"},{"b":1,"p":6,"t":"整體規劃設置 ( 一 ) 規劃前先思考： 1. 這 學期美 勞區 的學 習目 標為 何？ 2. 教 室現有 的環 境條 件為 何？ 3. 美 勞區依 學習 目標 要放 置哪 些教 具、玩具？ 4. 收 納櫃、 桌椅 、教 具、 玩具 該怎 麼擺放？動線順不順暢？ 5. 設 計的學 習內 容能 不能 引起 幼兒 的興趣？安不安全？ ( 二 ) 設計重點： 1. 規 劃平面 畫作 、立 體造 型、 工藝 等不同的藝術經驗。 2. 獨 立 完 整 的 學 習 區 域（ 以 櫃 / 架 / 地 墊 / 走 道 區 隔， 櫃 體 的 長 度 建 議 90 公 分 左 右， 高 度建 議 為 60 公分 左右）、全美勞區規劃至少可容納 3~4 人 / 每個區中區至少 2 人以上。 3. 設 置 地 點 有 足 夠 的 光 線 （ 靠 窗 ）， 主 要 目 的 為 充 足 光 線 下， 以 便 幼 兒 觀 察 色 彩 與 光 影 在 自然光線 下的 變化 。 4. 如 有 設 置 水 彩 區 等， 中 小 班 建 議 設 置 的 區 域 能 靠 近 水 源 或 方 便 取 水； 大 班 則 確 認 取 水 動 線順暢 即可 。 5. 提 供 不 同 的 操 作 區 域， 如： 地 面 、 桌 面、 牆 面 等。 如 果 利 用 桌 面 操 作 時 需 注 意： 約 1/3 擺放 幼兒材料、步驟圖卡、繪本等；約 2/ 3 的桌面可供幼兒操作。 6. 設 計有一 座開 放式 、多 功能 、易 拿取的工作櫃與兩個以上的區中區。 7. 各 區 中 區 近 期（ 約 三 週 左 右 ） 的 幼 兒 作 品 設 有 展 示 空 間， 且 符 合 幼 兒 的 視 線 高 度（ 平 視 至 仰 角 45 o， 且 欣 賞 作 品 最 遠 位 置 為 該 區 邊 界 ）； 先 前 的 作 品 則 建 議 採 專 題 或 同 類 別 於較高 處或 教室 外展 示。 8. 設 計 時 注 意 幼 兒 拿 取 以 及 操 作 教 具 時 的 近 便 性， 同 時 設 有 幼 兒 可 自 行 拿 取 的 未 完 成 作 品 保留區。 9. 學習 區 美感空間設計：首先是整齊、明亮，再檢視整個區域的色彩和諧。如有經費時， 採 買 加 入 有 質 感 自 然 材 質 的 收 納 盒、 傢 俱， 增 添 自 然 元 素 的 美 化 / 綠 化 造 景、 燈 光 設 計等 。 設計整體 藝術氛圍 層級 五 自然材質 綠化 燈光設計 層級 四 色彩 和諧 層級 三 依「 幼 兒 園 課 程 與 教 學 評 估 表 」 學 習 區 整 體 規 劃 指 標 1.1.6 合宜的美感空間規劃，分成上述五個層級 。 整齊 明亮 層級二 雜亂 層級一 6 10 . 燈光的使用： (1) 配合班級區域的位置放置不同的燈飾，讓幼兒有家 一般 的溫 暖。 (2) 聚焦 : 利用單一光源凸顯幼兒作品精彩之處。 (3) 點綴 : 利用聖誕燈等光源，讓幼兒作品更有氛圍。 7"},{"b":1,"p":7,"t":"( 三 ) 照片說明 1. 市立中壢幼兒園教室與美勞區的全貌 教室平面圖與教室全景 市立中壢幼兒園 教室 平面圖 語文區 數學區 美勞區 組合建構區 積木區 美勞區 平面圖 水 彩 展 示 區 水彩區 組合建構區 紙編展示區 多元材料櫃 資源 創作區 紙編區 黏土區 摺 紙 區 柱 摺紙材料櫃 黏 土 展 示 區 摺 紙 展 示 區 資源創 個與華人 / 台灣 / 在地文化議題相關的區中區。 6. 參 考 資 料（ 考 量 年 齡 層 及 難 易 度 ）： 步 驟 分 解 範 例 圖 （ 初 階 、 進 階 ）、 照 片、 幼 兒 能夠理解的工具書、繪本、圖鑑、擬真圖形、微縮 模型 等。 7. 範例圖卡按難易度分類，可讓幼兒按照自己的能力 去挑 戰。 8. 需 提 供 說 明 工 具 等 使 用 上 安 全 注 意 事 項（ 針 對 有 立 即 危 險 的 器 材 或 工 具， 教 師 務 必 事先說明，或製作安全提示，確認幼兒經過練 習，遵守安全規 則後才 能開 放使用 ）。 9. 提供方便使用的清潔工具及工作服。 ( 四 ) 區中區之展示與記錄 1. 展示與記錄符合近便性。 2. 展 示 空 間 與 佈 置 要 明 亮， 且 符 合 幼 兒 的 視 線 高 度 （ 平 視 至 仰 角 4 5 °， 且 欣 賞 作 品 2. 區中區的工具、材料、收納盤 / 盒可依創作類別分層架擺放。 的最遠位置為該區邊界）。 3. 收納盤 / 盒收拾 歸位的對應標示。 4. 收 納盤 / 盒呈現 出色彩簡單和諧，有質感。 5. 收 納籃通 透， 讓幼 兒能 清楚 看到裡面的教具。 6. 工 具、材 料依 形狀 、大 小、 顏色分別（籃）擺放，且有對應標示。 7. 提 供幼兒 擺放 未完 成作 品的 區域，幼兒可自行拿取。 ( 三 ) 區中 區 之適切的教具 1. 有工 作 盤 / 盒的 規劃，材料與美勞區的目標相符合，內容設計幼兒易理解及操作。 2. 安 全、足 量且 狀況 良好 之不 同創作類別工具、材料三類以上。 3. 工 具、 材 料、 工 作 盤 / 盒 依 據 創 作 類 別 分 層 架 擺 放， 且 有 難 易 程 度 的 區 別（ 提 供 幼 兒能理解難易程度區別，供幼兒選擇）。 3. 幼兒作品可利用不同形式的櫃 / 架分類展示。 4. 作品展示區利用高低設計，讓每位幼兒的作品被看 見。 5. 各 區 中 區 皆 就 地 規 劃 展 示 空 間， 且 依 作 品 的 形 式 規 劃 不 同 的 展 示 位 置， 如： 壁 面、 展示櫃、垂掛。 6. 情境式的展示：燈光搭配、自然元素的美化、小物 品裝 飾以 添加 氛圍。 7. 幼兒作品標示：姓名、日期、作品名稱、特色、命 名與 介紹 。 8. 展示過程按時間序（展示內容可挑選關鍵經驗、問 題解 決呈 現） ，其記 錄 方法： (1) 拍照或文字記錄幼兒作品歷程。 (2) 以個別或專題方式介紹作品。 (3) 幼兒以圖示記錄歷程或發現問題和解決方式。 4. 依幼兒年齡層不同，提供適切的教具教材和不同的材料，如捏塑類的美勞區。 ◎小提醒： (1) 小班可以提供： a . 輕質 土 b. 麵包 土 (2) 中班可以提供： a . 小麥 土 b. 油黏 土 1. 學 習 區 規 劃 後， 老 師 可 試 坐 各 區 中 區 的 幼 兒 位 子 上， 以 幼 兒 的 視 角 確 認 材 料 拿 取 的 近便性、操作位置的合宜性、工具使用的方便性、 幼兒 行走 動線 等。 2. 不 論 是 玩 具、 教 具、 材 料 或 是 工 具 項 目， 內 容 避 免 單 一 或 長 期 不 變 ， 其 中「 多 元 文 化 」 也 必 須 考 量 在 學 習 區 設 置 中， 多 元 文 化 的 部 分， 以 一 學 期 為 單 位 ， 最 好 是 可 以 涵蓋三種文化以上，其中一種是異國文化。 14 小提 醒 ：中小班的小麥 土或油黏 土可切成大小合宜方塊狀，方便取用及立體創作。 15"},{"b":1,"p":11,"t":"( 五 ) 區中 區 實例分享 區域設計 繪畫類（水彩區） 水彩區的操作 操作區為畫架，未完成之作品可以直接置 於畫架上。 左方設置靜物並提供放大鏡方便幼兒作畫 觀察。 左方放置多位名家畫風的書籍，供幼兒觀 察、賞析及仿作。 材料與工具符合近便性原則（畫架下方盒 內為圖畫紙）。 水彩區的收納 收納方面，工具、材料擺放 具近便性，並有對應標示。 水彩用瓶裝設計放置於桌面， 讓幼兒能方便按壓使用。 17 水彩區材料與美勞區的目標相符合，內容設計（彩繪靜物）幼兒易理解及操作。 設置地點有足夠光線（靠窗）及鄰近出入口方便取水。 配合創作需求與作品，設計光源。 16"},{"b":1,"p":12,"t":"水彩區的適切教具 依幼兒學習目標，提供幼兒能自主且方便 拿和使用的水彩餅或擠壓式的水彩。 提供水彩筆、洗水彩筆的罐子或杯子， 以及可以將水彩筆多餘的水分吸乾的 海綿（或布）。 依學習目標，提供多樣的書籍，例如提供 多種水彩畫風的參考書籍，供幼兒閱讀、 仿畫、討論、賞析。 圖片來源處 : 1. 給孩子的 37 堂課。教育之友。 2. 石門 峡 斯卡也答。桃園縣龍潭鄉公所。 3. 美濃菸樓。藝術家出版社。 4. 水彩畫教室 零基礎。野人出版社。 提供可自由移動的小桌，讓幼兒可以在外 寫生。 提供調色、畫筆等圖示供幼兒選擇畫筆和調 色時參考。 建議老師依據幼兒能力、發現的問題，及老 師想給予幼兒的學習目標，提供參考圖示。 圖片來源處 : 水彩調色圖卡 https://www.pinterest.com/ https://www.pinterest.com/pin/18084835994539984/ pin/30962316180191436/ 水彩筆 https://www.pinterest.com/ pin/406238828900498586/ 依據教師設定的課程規劃或幼兒興趣給予 不同的素材，如： 提供靜物（3 種盆栽以 上供幼兒選擇）、放大鏡等供幼兒觀察。 提供幼兒能自行清潔工具，如：抹布。 老師可以將工作服事 先綁好，讓幼兒自行 穿脫，也可以採用黏 貼式的工作服，鼓勵 幼兒互相幫忙。 提供幼兒能自行穿脫 的工作服。 （注意工作服懸掛的 高度為幼兒能自行取 下和掛上的高度）。 18 19"},{"b":1,"p":13,"t":"水彩區的展示與記錄 幼兒作品展示具近便性，並利用高 低變化，讓每個幼兒的作品被看見。 幼兒作品展示有基本資料：姓名、 日期、作品名稱、特色、命名與介 紹。 融合情境佈置展示幼兒作品（燈光 搭配、自然元素的美化）。 老師利用作品展示，引發幼兒對植 物的觀察和水彩技法討論。 幼兒寫生作品可使用層架，展示在畫作內容鄰近之處。 幼兒畫作加入邊框展示。 展示時可將幼兒作品與描繪的靜物擺放一 起展示。 可將實物與幼兒畫作並放入老師利用團討時間和幼兒 的討論與分享，再將討論結果整理，如 : 運用植物的 照片和不同幼兒的畫作，進行畫作討論和分享。 以學習單展示幼兒畫水彩的歷 程、感受和遇到的問題等。 20 21"},{"b":1,"p":14,"t":"其他繪畫類區域的設計 繪畫類（水彩區）、( 水墨畫區 ) 區域的設計 紙工類（剪紙區 ) 美勞區 水彩區 水彩區可結合藝術名家來設計，例如：康 丁斯基。 提供的圖示、操作範例及整體環境與情境 設計有主題性。 範例包含平面、立體的作品。 其他繪畫類區域的設計 禪繞畫區 美勞區 水墨區 提供畫竹子的圖示和範例、名家水墨畫， 供幼兒參考與賞析。 可利用回收的硬紙板做框展示。 剪紙區的收納 剪紙區材料與美勞區的 目標相符合，內容設計 幼兒易理解及操作。 運用桌面的 1/3 擺放幼 兒材料、步驟圖卡等， 約 2/3 的桌面可讓幼兒 操作與創作。 桌面提供使用剪刀時的 安全注意事項。 提供的圖示、範例及整體環境設計皆符合禪繞畫的元素，並規劃不同的操作區域（畫架、桌面）。 依幼兒創作作品選擇繪本引導，繪本利用書架擺放。 色紙、剪刀、黏膠、參考圖例等收納整齊，並擺放小籃子收集幼兒剪過的紙張（可後續再 利用）。 22 23"},{"b":1,"p":15,"t":"提供使用工具的安全以及操作注意事項的照片或 書籍內頁。 圖片來源處 : 上 :https://health.ltn.com.tw/article/paper/1223872 下 : 手工樂園 2 歲多湖輝的 NEW 頭腦開發。風車 圖書系列。 技法可整理後再讓幼兒參考，如：提供各種剪紙的作品範例圖讓幼兒參考（同一 技法，如對稱剪出不同的造型，可用九宮格的方式整理）。 教具圖卡提供使用工具的方法， 如：使用工具（剪刀）的技法或 方法的圖片。 選擇說明圖示時，盡量是清楚的 圖片或者照片。 圖片來源處：明愛樂進學校製作。 https://rdsys.edcity.hk/storage/ resource/833398314/14.4.jpg 提供各種剪紙的方式 、分解圖。 對於不擅長剪紙的幼兒可提供簡單的剪紙（工作盤）讓幼兒練習。 24 提供各種剪紙的作品範例圖讓幼兒參考（同一技法應用在不同的創作設計，如：都是直線剪 完，黏在圓圈後成不同作品，供幼兒參考）。 圖片來源處： 人的頭髮 https://www.pinterest.com/pin/614319205398614282/ 樹 https://www.pinterest.com/pin/270497521360229441/ 25"},{"b":1,"p":16,"t":"提供不同技巧的剪紙的作品範例圖，依主題分類給幼兒參考。 圖片來源處： 馬 https://www.pinterest.com/pin/777152479464520517/ 毛毛蟲 https://www.pinterest.com/pin/107875353567383398/ 剪紙的範例圖，利用顏色圓點貼區分難易度，讓幼兒參考。黃 ( 易 ) →藍 ( 中 ) →綠 ( 難 )。 刺蝟 https://www.pinterest.com/pin/648307308842492805/ 花 https://www.pinterest.com/pin/492649950139175/ 蝴蝶 https://www.pinterest.com/pin/318559373654850282/ 剪紙區的展示與記錄 作品展示時，可將相似的作品擺放一起展示。 將幼兒剪紙作品分類，變成參考圖卡或範例卡。 作品展示時，將相同技法 ( 直線剪 ) 的作品擺放一起展示。 26 27"},{"b":1,"p":17,"t":"區域的設計 紙工類（捲紙區 ) 捲紙區的收納 紙工類 捲紙區 捲紙區材料與美勞區的目標相符合，內容設計幼兒易理解及操作。 區中區的工具、材料依據創作類別分層架擺放。 工具、材料依顏色分別擺放。 收納盒有收拾歸位的對應標示。 提供相關的書籍作為捲紙的工具使 用與步驟圖參考。 圖片來源處： 有趣多變的捲紙手作。藝風堂。 左方的櫃體為未完成區，如上圖所示。 由於捲紙的作品比較小，可利用透明的籃子一格一格收納幼兒未完成的作品。 28 29"},{"b":1,"p":18,"t":"捲紙區的適切教具 提供的材料與捲紙區的目標相符合（如：捲紙 區提供長條紙，更方便幼兒直接進行創作）。 因應捲紙區的操作需求提供適切工具 (如：捲紙工具、黏著工具、剪刀)。 因應幼兒能力與年齡提供適切的工具 (如：捲紙棒、牙籤等不同的捲紙工 具、擠與 沾 取 的 白 膠 ) 。 提供進階的工具書籍， 供幼兒參考。 圖片來源處 : 立體捲紙花朵綻放在卡 片．禮盒．盆栽上。 瑞昇。 簡單有趣的捲紙小物。 藝風堂。 提供繪本書籍引發幼兒 創作捲髮公主的作品。 圖片來源處 : 超級理髮師。小魯文化。 提供基本形狀的捲紙供幼兒參考。 30 31"},{"b":1,"p":19,"t":"捲紙區的展示與記錄 提供幼兒基本捲紙的工具使用與步驟圖參考。 圖片來源處 : 完創達人愛手作。影片。 立體捲紙初體驗。旗林文化出版社。 幼兒作品展示高度符 合幼兒的視線高度。 提供幼兒基本捲紙可設計的作品圖參考。 圖片來源處 : 貓頭鷹 https://www.pinterest.com/pin/496381190190284931/ 愛心 https://www.pinterest.com/pin/152981718585206019/ 兔子、豬、小鳥等小動物 https://www.pinterest.com/pin/173740498115281536/ 32 幼兒作品創作結合節慶文化展示。 幼兒共同創作的作品展示。 建議再加上作品名稱與完成日期。 幼兒個人的作品紀錄（記錄內容：創作者、 日期、作品名稱）。 33"},{"b":1,"p":20,"t":"區域設計 捏塑類（黏土區） 幼兒創作歷程的討論紀錄（利用照片呈現關鍵經驗)。建議 : 老師提問宜採正向語型。 美勞區 黏土區 幼兒個人的作 品紀錄（記錄 內容：創作者 、日期、幼兒 的話語)。 利用畫與捲紙 複合式的課程 設計，創作半 立體的藝術作 品。 將幼兒作品分類展示搭配單一 背景色，與燈光營造情境。 上方 A4 紙張展示幼兒創作歷程。 下方以藝術作品搭配作者圖像展示。 34 黏土區材料與美勞區的目標相符合，內容設計幼兒易理解及操作，此區可容納 4 人。 配合創作需求與作品設計光源。 35"},{"b":1,"p":21,"t":"黏土區的收納 工具、材料依類別分層架擺放，並標示於外側，方便幼兒辨識取用。 提供符合幼兒年齡且足夠量的工具 / 材料，讓幼兒使用。 提供多樣類別的圖例分類成 ，讓幼兒能依興趣選擇。 册 層架的下方設有 未完成作品區。 黏土區的適切教具 提供各種捏塑黏土的工具書。 圖片來源處 : 歡樂親子黏土。風車圖書。 黏土小百科。幼福文化。 提供圖鑑、照片、模型，讓幼兒參考、 觀察與發想。 圖片來源處 : 昆蟲百科圖鑑。晨星出版。 依據幼兒年齡與能力，設計提供不同技法的參考圖檔與黏土塊（可有較精細動作的搓圓、長 條的圖例，以及立體方塊塑型的圖樣）。 運用工作盤，依難易程度、創作類別擺放。 圖片參考來源 : 黏土基本技法 - 集思特手作 https://www.rdsoap.com/sweet/baby.html 朱銘官方網站 https://www.juming.org.tw/mainssl/modules/MySpace/index.php?xmlid=46300 提供繪本讓幼兒參考發想。 提供展示架與清潔工具讓幼兒自主取用。 36 37"},{"b":1,"p":22,"t":"運用木架展示黏土作品。 運用透明 :"縫工區的收納 利用活動式隔板，將未完成的作品做區分， 並可依作品的大小變動空間，以及用人形立 牌標示幼兒放置區域。 利用三層活動架將材料分類及標示名稱，可 增加教室內的活動空間，並提供 4 類材料且 每位幼兒有足夠的使用量。 縫工區適切的教具 利用層板增加桌面的空間位置，方便幼兒拿取素材創作。 工具、材料分別放置整齊。 依不同的材質、形狀，放入適合的容器內，並有對應實物。 50 提供不同材質的布料(有 符合當地文化之客家花 布、再利用的資源，如： 舊衣回收、襪子等)。 51"},{"b":1,"p":29,"t":"不同材質的縫線，並利用籃子、盤架放置毛線和線軸。 依幼兒的年齡與發展，提供不同的使用工具。 提供進階範例完成的實物作品。 工作盤內有完整的分解步驟圖及成品展示。 盒內有一人份的材料及工具，使用有顏色的圓點貼標示難易程度（藍點代表簡易，紅點代表 較難）。 圖片來源處 :https://www.facebook.com/media/set/?set=a.851162765016847&type=3&com ment_id=851251931674597&comment_tracking=%7B%22tn%22%3A%22R%22%7D 提供使用穿針器及打結的步驟圖，供幼兒參考。 圖片來源處 : 老師自製。 52 53"},{"b":1,"p":30,"t":"提供各種縫工的基本 技法，供幼兒參考。 縫工區的展示與記錄 提供合宜的參考資料，如步驟圖卡、工具書、繪本。 圖片來源處 : 親子美勞 - 玩不織布。美工科技有限公司。 喬瑟夫有件舊外套。維京。 https://hp20070116.pixnet.net/blog/post/337986896 利用牆面空間與紙板，呈現不同高低層次的展示區域。 作品依類別及時間的脈絡，進行展示。 運用自然元素及燈光效果的搭配。 作品展示時可使用透明卡典西德標示，不 僅可重複黏貼，也不會影響美觀。 縫工創作歷程紀錄依時間整理成海報。 歷程圖與學習單搭配在地文 化創作成品紀錄。 54 55"},{"b":1,"p":31,"t":"其他編織類區域的設計 串珠區 編織類 其他設計 串珠區 串珠區材料與美勞區的目標相符合，內容設計幼兒易理解及操作（飾品、項鍊、手鍊等）。 利用各種小飾品與燈光展示幼兒串珠作品。 其他編織類區域的設計 編織區 幼兒的作品展示與創作過程用照片紀錄。 幼兒的作品展示與設計圖之紀錄。 56 編織區材料與美勞區的目標相符合，內容設計幼兒易理解及操作（飾品、毛球類等）。 桌面為操作區，有設置展示空間（樹枝及右前方牆面）及未完成區域（桌面木盤處）。 57 編織類 其他設計 編織區"},{"b":1,"p":32,"t":"縫工區的展示與記錄 區域設計 多元材料創作類（插花區） 利用各類層架展示幼兒作品。 利用黑色塑膠瓦楞板加上圖釘，懸掛幼兒作品。 編織區的收納 ( 留意圖釘的安全 ) 插花區材料與美勞區的目標相符合，內容設計幼兒易理解及操作。 58 59 可利用塑膠罐、玻璃罐或者醬瓜罐，加 上布或蓋子，收納毛線，並穿洞孔讓幼 兒易拉取毛線。 利用旁邊的櫃體以及線軸下方收納插花所需的材料。"},{"b":1,"p":33,"t":"插花區適切的教具 提供幼兒簡單可以入手的插花器材 （劍山、剪刀等）。 提供不同材質花器（小碗、小碟、葉子等）。 提供使用花卉名稱的說明，以及插花的步驟圖（老師以照片呈現步驟，搭配幼兒完成後的作品）。 插花區的紀錄 不同材質花器（馬克杯、醬瓜瓶、汽水瓶、玻 璃瓶等瓶罐）。 不同材質花器（不同尺寸、 形狀，如盤、碟、盆、皿等）。 提供插花的步驟 圖（幼兒手繪）。 插花區的展示 幼兒作品紀錄 以照片搭配作 品介紹。 以幼兒插花作品搭配幼兒手 寫卡片記錄。 60 61 提供不同種類的花材（乾燥花、各式鮮花與搭配用 的花材等)。 幼兒的設計圖與幼兒作品一起展示。 利用燈光、小物品裝飾等搭配情境展示。"},{"b":1,"p":34,"t":"區域設計 多元材料創作類（鋁線區） 多元材料 創作類 鋁線區 鋁線區材料與美勞區的目標相符合，內容設計幼兒易理解及操作（飾品、項鍊、手鍊等）。 利用桌面與前面的網架，收 納鋁線區所需的工具、材料 、圖卡。 提供所纏繞鋁線的技法和繪本給幼兒參考。 圖片來源處 : 彎一彎Ⅹ折一折創意手作鋁線好簡單。和平國際出版。 圖片來源處 : 柯爾達的鐵線世界。 小典藏出版社。 提供剪斷鋁線的圖卡。 62 提供幼兒簡單可自行使用的 鉗子，並將不同鉗子能扭轉 出的樣式圖一併陳列。 提供多元文化的說 明與賞析。 63"},{"b":1,"p":35,"t":"鋁線區的展示與記錄 毛根 鋁線區 區域設計 回收材料創作類（自由創作區） 回收 材料創作類 自由創作區 提供高低的層架、使用不同的色系等來彰顯幼兒的作品。 自由創作區材料與美勞區的目標相符合，內容設計幼兒易理解及操作。 操作位置為桌面，材料放置在桌子旁的櫃體內，符合近便性。 幼兒作品展示在櫃體上，作品紀錄張貼在前面的牆上展示，符合幼兒的視線高度。 自由創作區的收納 工具、材料、工作 盤 / 盒依據創作類 別分層架擺放。 材料依形狀、大小、 顏色分別（籃）擺 放，工作盤 / 盒收 納有對應的照片。 收納籃採自然材 質，有質感，讓幼 兒能清楚看到裡面 的素材。 鋁線、毛根可提供混齡班級的幼兒創作（較小年齡層的玩毛根、較大年齡層的玩鋁線）。 64 65"},{"b":1,"p":36,"t":"利用放置材料櫃體的上方做為未完成作品區。 自由創作區適切的教具 提供各種形狀、材質的鋪排板，讓幼兒進行鋪排。 自由創作區的展示與記錄 提供各種形狀的素材（如：瓶蓋 - 圓形、馬克磚 - 方形）、天然素材（如：葉子、樹枝、小石子）。 安全且狀況良好之不同創作類別材料三類以上。 66 提供相關的繪本《大象艾 瑪。和英》讓幼兒進行鋪 排時參考。 作品展示在操作桌面旁的 櫃體，符合近便性。 展示時可利用不同的鋪面 進行作品展示（人工草皮 擺放在櫃體上，進行平放 展示）。 67"},{"b":1,"p":37,"t":"展示利用不同的鋪面進行作品展示（具有黏性的卡典西德，可以懸掛壁面）。 展示利用不同的鋪面進行作品展示（圓形 - 隔熱墊、紙盤鋪排）。 利用地面讓幼兒進行 鋪排，並將作品直接 展示於地面。 將果殼、種子或 石頭等的立體創 作上漆，保留作 品進行展示。 68 69"},{"b":1,"p":38,"t":"提供硬紙板讓幼兒黏貼鬆散素材創作，完成後可以懸掛。 展示利用黑紙的鋪面進行作品展示，凸顯作品的美。 木製托盤讓幼兒可以拿到想操作的區域創作，創作完也能直接展示 。 善用隔層與小空間進行作品展示。 利用小樹枝懸掛幼兒的立體 作品。 立體創作旁放置透明立牌說明幼兒作品。 70 71"},{"b":1,"p":39,"t":"區域設計 多元材料櫃 展示過程按時間排序（展示內容可挑選關鍵經驗呈現)。 運用學習單進行幼兒作品記錄。 鬆散材料區 鬆散材料結合光箱的設計。 將幼兒的作品拍照後，張貼在回 收的鐵盒蓋上展示。 72 美勞區多元材料櫃的設置，主要是以再生資源、自然及幼兒常用的素材為主，材料夠用即可， 避免造成材料堆疊放置。 可提供基本工作盤的設置（如：讓幼兒熟悉練習剪刀工具、練習小肌肉及手眼協調的剪工工 作盤）、較難程度的工作盤（如：摩艾石像黏土捏塑)，或者為了支持幼兒能力的發展或對此 素材的興趣（如：編織類）。 工作盤設置清楚，含材料收納、挑戰圖示、工具。 每一個工作盤供 1 位幼兒使用。 圖片來源處 : 美感遊學園 : 名畫與雕塑。小皇冠文化。 73"},{"b":1,"p":40,"t":"三、方案課程 以串珠課程為例－桃園市立楊梅幼兒園。 因應不同區中區的需求，根據色票提供相對應顏色之色鉛筆與畫筆。 教室空間較小時，可運用推車來設置。 74 75"},{"b":1,"p":55,"t":"邁入學習區的第一步 環境規劃與準備 發 行 人：劉仲成 副 發 行 人：林威志、高玉姿、賴銀奎 總 編 輯：余黛佳 顧 問：陳娟娟 編輯工作小組： 楊雅真、葉俊泰、彭儀華 余佩玲、葉玉嬌、劉雅慧 林璧琴、陳秀玲、林亞萱 李佩珍、徐錦玉、趙佩瑛 陳綺塤、張 攸、林采憑 出 版 機 關：桃園市政府教育局 電 話：(03)332-2101#7584、7588 網 址：http://www.tyc.edu.tw 美 編 印 刷：優格廣告攝影有限公司 電 話：(06)268-0320 出 版 日 期：中華民國 112 年 04 月 104"},{"b":2,"p":5,"t":"局長序 優質好環境，開展探索力 讓孩子成為自主學習的主人 環境是幼兒的第三位老師，優質學習環境有助幼兒持續探索及開展屬於自己的學習力， 而優質的關鍵在於「有系統的規劃」讓幼兒循序漸進自主學習。 「幼兒自主，遊戲為本，全人發展」是所有投入幼兒教育人員應具備的共同理念，而 環境規劃更是所有教保服務人員必須具備的基礎能力。在適齡適性、豐富且具有挑戰性的 遊戲情境中，幼兒產生興趣，進而推動探索行動，自主學習與同儕合作從中開展，全人發 展也由此而生。 是故，桃園市希望能全面在幼兒園中建置鼓勵幼兒自主探究的「學習區」。學習區基 本區為幼兒發展與基本能力的培養，區域包含語文區、數學區、組合建構區、美勞區、積 木區、扮演區，共六區。為使教保服務人員能更清楚每個基本區的規劃原則與陳設建議， 本局賡續委託桃園市幼教輔導團為本市教保服務人員編製「邁入學習區的第一步」指引手 冊。本手冊共有三冊，以營造美感、愛與溫馨的氛圍為設計基調。初期可依循使用，當教 學者運用層次提升，經驗更豐富時，鼓勵師生發揮巧思，從生活中提取學習素材，讓幼兒 園的學習更貼近生活。亦可因應幼兒需求與教學發展特色增設特別區與戶外區，如：木工 區、烹飪區、科學區、種植區等學習區。 感謝陳娟娟博士指導本市幼教輔導團編輯本手冊，集結市內優質幼兒園現況，提供現 場教保服務人員指引。期待透過手冊的運用與推廣，陪伴教保服務人員學習與成長，激發 更多的熱忱、創意與做法，讓幼兒園學習環境優質、教學品質升級，讓大眾看見幼兒教育 的豐富新面貌。 桃園市政府教育局局長 劉仲成 謹識 3"},{"b":2,"p":6,"t":"序 跟隨幼兒的興趣萌發研究議題 學習區萌發重視的，正是幼兒在操作過程如何與同伴、老師互動，如何發現問題、解決問 題，發展跨領域的能力。幼兒在扮演區社會戲劇性遊戲出現的比例比在傳統娃娃角要高，而且 表現出遊戲品質層次較高的機率較大，如果說社會戲劇性遊戲是最高等級的假裝扮演遊戲，有 助於提升幼兒抽象思考能力，那麼鼓勵老師可以配合季節、節慶議題規劃扮演區，以擴增幼兒 的生活與認知經驗，在扮演區擺放幼兒原本熟悉的傳統娃娃角的道具器材，讓幼兒在部分熟悉 部分新奇的環境規劃中，以既有的經驗為基礎進行想像與創造，使遊戲的內容更為豐富，也讓 幼兒在遊戲中有更多學習。 幼兒在積木區搭建簡略的範例，經歷幾次的拆掉與重建，克服困難、面對挑戰、耐心、毅 力、溝通協調與互助合作等良好特質，都從中獲得鍛鍊。空間概念與空間位置判斷、平面圖查 看、不同形狀積木組合運用與積木搭建技巧。幼兒進行積木搭蓋活動時，可能會主動提出可運 用平面圖的想法，並能針對搭建物組成方案的空間位置，進行較為適當的判斷。幼兒還能適當 選用不同形狀的積木，並能彈性調整積木的組合搭蓋方法，從而以節省積木的方式完成搭建。 更重要的是幼兒願意主動嘗試與挑戰，不會害怕失敗與挫折而主動拆掉重蓋，能展現耐心與毅 力，並透過與同儕的溝通協調及互助合作而完成任務。老師以幼兒的興趣、經驗、能力與表現 為基礎，設想可以促進幼兒能力發展的探究方向，然後運用具提示性、邀請性的訊息引發幼兒 的動機與想法，但最終決定具體搭建目標、空間設施項目與問題解決方法的仍是幼兒。 以幼兒為中心並利用真實的問題來引發幼兒討論，Delisle(1997) 提出問題解決教學模式， 其教與學的流程如下：先觀察，讓問題與幼兒經驗連結，而後建立解決問題結構、訪查問題、 再訪問題、產生出成果或表現，最後對表現及問題進行評估。Klah 發現幼兒是個主動的解決問 題者，幼兒若能認知解題的目的，了解當前的解題障礙，便能嘗試使用策略克服此障礙，完成 解題已達成目標。而他也提及在解決問題的歷程中，幼兒會參考環境中與問題相關的訊息，一 步一步地計畫如何可以有效的達成目標 (Siegler , Deloache , & Eisenberg , 2003)。 因此，方案課程是隨著每一次老師對自己與幼兒的互動、幼兒彼此之間的互動或幼兒與 材料的互動的觀察而反思建構產生，同時又回歸於與社會的互動中將學習付諸實驗與實現。但 在確定幼兒已達到能獨立運作的認知功能時 ( 能自行藉由討論以發現問題及合作解決問題後， 老師逐漸撤出控制、協助的量與參與的程度 )，讓幼兒能真正獨立探究以增進幼兒的自我調整 (self-regulation) 能力，這正符應了社會建構「以學習導出發展」的觀點。不管是歡樂的扮演區， 還是各式建築和軌道的積木區，都是以問題帶動解決方法循環的場域，也落實了 STEAM 教育 「創造性的問題解決能力」(creative problem solving)、「批判性思維」(critical thinking) 和「合 作」(collaboration) 等之「軟技能」(soft skills)。 陳娟娟 博士 4"},{"b":2,"p":7,"t":"ONTENTS 目次 3 序 優質好環境，開展探索力 讓孩子成為自主學習的主人 3 劉仲成 局長 跟隨幼兒的興趣萌發研究議題 4 陳娟娟 博士 6 積木區 整體規劃設置 教室與積木區的全景案例 - 桃園市立中壢幼兒園 8 教室與積木區的全景案例 - 桃園市立南崁幼兒園 10 教室與積木區的全景案例 - 桃園市立蘆竹幼兒園 12 教室與積木區的全景案例 - 蘆竹國小附設幼兒園 14 教室與積木區的全景案例 - 桃園市立龍潭幼兒園 16 區中區設置 區中區實例分享 18 課程分享 桃園樂天棒球場 - 桃園市立中壢幼兒園 46 54 扮演區 整體規劃設置 教室與扮演區的全景案例 - 桃園國小附設幼兒園 55 區中區設置 區中區設置分享 60 5"},{"b":2,"p":8,"t":"積木區 整體規劃設置 ( 一 ) 規劃前先思考 1. 這學期積木區的學習目標為何？ 2. 教室現有的環境條件為何？ 3. 依據教室空間大小及幼兒的年齡層要放置哪類的積木及相關配件？ 4. 不同類別積木的收納方式、配件要如何擺放？動線順不順暢？ 5. 積木區的操作與展示方式是否恰當？ ( 二 ) 設計重點 1. 設置地點避開主要動線，例如：棉被櫃、工作櫃等。以櫃 / 架與其他學習區做區隔。 2. 留意是否為獨立操作學習區域，以及可容納的人數 ( 全區至少 3~4 人 )，且不含拿取的動線。 ( 容留空間計算：以人為單位，一人約為 0.49 坪 ) 3. 地面平坦，易於幼兒做立體搭建，地板若欲鋪設拼接地墊，建議以不易塌陷及移動的地墊 為佳。 4. 宜標示搭建區域，操作空間與教具櫃之間預留易拿取積木的動線，避免幼兒搭建在教具櫃 前，造成其他幼兒不易拿取。 5. 設置區域保留較大面積的牆面，可作為圖示及歷程記錄。 6. 考量幼兒拿取積木搭建時的近便性，可在櫃 / 架旁增加底面積小高瘦型的容器盛裝積木片 或較小的單位積木。 7. 規劃就地保留展示區域。 8. 規劃兩座以上開放式易拿取的工作櫃，隨幼兒操作成熟度再適度增加數量。 9. 一櫃的單位換算： 類別 數量 積木片 中小型積木 大型積木 600 片 約 200 塊 約 80 塊 10. 提供安全、狀況良好且符合幼兒年齡層發展的積木類別 1~3 種 ( 如數量足夠，1 種即可 )。 6"},{"b":2,"p":9,"t":"11. 設置類別 (1) 積木片類 ( 例如：Kapla 積木、骨牌、疊疊樂 ) (2) 小型積木類 ( 例如：小單位積木、ㄇ字型積木 ) (3) 中型積木類 ( 例如：單位積木、火車軌道積木 ) (4) 大型積木類 ( 例如：城市積木、空心積木、泡棉積木、柔麗磚 ) (5) 自製大積木 ( 例如：自行裁切各式木板木塊木樁、紙盒或紙箱 ) Kapla 積木 小單位積木 大單位積木 空心積木 12. 選擇單位積木做為積木區發展，建議中小班 / 初期可先提供半套，約一半左右形狀，從簡 單到複雜的搭建，再視幼兒的經驗提供整套積木。 13. 檢視整個區域的色彩和諧，如有經費時採買加入有質感自然材質、透明或白色的收納盒、 傢俱，增添自然元素的綠化 / 美化、燈光設計等。 7"},{"b":2,"p":10,"t":"( 三 ) 照片說明 1. 市立中壢幼兒園教室與積木區 教室平面圖與教室全景 教室 平面圖 扮演區 數學區 美勞區 語文區 教室全景 拍攝角度 組合建構區 積木區 拍攝角度 數學區數學區 扮演區扮演區 美勞區美勞區 語文區語文區 積木區積木區 積木 區積木 區 組合建構區區 組合建構 活動室呈長形，面積大小約 21 坪，大中混齡使用，共有 28 名幼兒。 教室內明亮，設置積木區、組合建構區、扮演區、數學區、語文區、美勞區，共 6 個基本區。 各學習區以櫃 / 走道與其他學習區做區隔。 8"},{"b":2,"p":11,"t":"積木區 平面圖 鬆散、科學實 驗材料與配件 積木片收納櫃 操作及展示區 積木區 全景圖 積木區全區可容納 3-4 名幼兒，提供 5000-8000 片積木片 ( 一櫃為 600 片，提供三櫃 3 級分， 四櫃 4 級分 )。 小木片積木與配件，置於同色系容器中，使整體色彩和諧、整齊有序。 以低彩度色膠帶為地線，與其他區域做區隔。使用牆邊嵌入式櫃體為工作櫃，工作櫃與遊戲 空間之間預留易拿取積木之動線。 提供配件 ( 如：PVC 管、壓克力版、公仔、小球……等 )，依據不同目的與類別，以同色系 紙箱或透明盒分層擺放。 運用工作櫃上方平台及展示架，提供相關參考資料 ( 如：基本與進階範例圖、幼兒能理解的 工具書、繪本……等 )。 9"},{"b":2,"p":12,"t":"2. 市立南崁幼兒園教室與積木區 教室平面圖與教室全景 教室 平面圖 數 學 區 組 合 建 構 區 語 文 區 拍攝角度 積木區 烹飪區 扮演區 美 勞 區 教室全景 扮演區扮演區 數 學區數 學區 組合 建構區 組合 建構區 語文區語文區 美勞區美勞區 積木積木區區 烹飪烹飪區區 活動室呈長形，面積大小約 41.5 坪，大中小混齡使用，1.5 個班級共有 41 名幼兒。因單一活動室空 間小不適合規劃多個學習區，因此將兩間活動室與走廊空間共規劃為七個學習區，設有：積木區、烹 飪區、數學區、組合建構區、語文區、美勞區及扮演區。 積木區設置地點為活動室外走廊，避開主要動線空間整潔明亮，室內外皆有綠植栽，與烹飪區相鄰， 教玩具及材料擺放整齊有序。 活動室整體空間皆規劃成學習區，並依各區不同目標有區中區設置。 10"},{"b":2,"p":13,"t":"積木區 平面圖 Kapla 練功區 單位積木櫃 Kapla 在 搭 建 經 驗 前 期 供 幼 兒 操 作 基 本 步 驟， 可 理 解 組 合 及 解 構 的 過 程。 隨 著 幼兒的 經驗發展，可縮 小練功區。 在長板上貼上範例圖式 ( 圖式為積木片原 在練功區牆面上張貼基本功步驟。 尺寸 )，幼兒可直接搭建在上面。 單位積木的練功區，可設置在積木區旁。 (2) 挑戰區 ：可分為平面鋪 排及立體搭建。 參考實景圖做平面鋪排 參考範例圖鋪排。 18"},{"b":2,"p":21,"t":"參考範例圖做屋頂的立體鋪排。 參考範例圖做立體搭建。 牆面張貼挑戰技巧圖示，亦可選擇單一範例圖。 19"},{"b":2,"p":22,"t":"2. 在幼兒搭建發展的中後期規劃 (1) 挑戰 區 ( 施作 範例請參考第 18 頁 ) (2) 固定 ( 興趣 ) 發展 區 以橋樑為搭建的興趣發展。 在地板上運用藍色卡典西德紙貼出河流意象，再搭建積木。 20"},{"b":2,"p":23,"t":"以建築為議題，發展比薩斜塔、巴黎鐵塔、半圓屋頂建築搭建。 以學校附近建築為搭建的興趣發展。 21"},{"b":2,"p":24,"t":"幼兒搭建後期有合作意圖時，區中區會逐漸消失，整合成為方案，例如照片中幼兒以軌道設 計為議題，發展軌道方案。 路徑 1 路徑 3 路徑 2路徑 2 以結合機器人造型與軌道設計，分別從機器人頭部、手部出發，設計出不同路徑的滾珠軌道。 22"},{"b":2,"p":25,"t":"( 二 ) 收納 方 式 1. 以省空 間規劃為原則， 中大班採完整形狀或倍數關係的收納方式。 2. 中小班 用等比例大小的 積木圖片搭配文字作為標示，以利幼兒對應收拾歸位。 3. 可在積 木區牆面上張貼 所有積木的形狀、名稱、數量等完整圖示。 4. 積木擺 放時依重量較輕 的擺放在上層，較重的擺放在下層。 5. 依 形 狀、 長 短、 大 小 分 層 架 擺 放， 單 位 積 木 因 體 積 大， 部 分 櫃 子 放 不 進 去， 可 採 靠牆面 放置的方式，增 加圖示以便歸位。 6. 依積木 類別、配件、分 櫃 / 架擺放。 7. 依積木 的數量、環境及 空間，規劃不同櫃子組合，使空間運用更具變化與美感 。 單位積木收納 由左至右、由上至下，採單位積木的倍數關係及完整形狀整齊擺放。 用等比例大小的積木圖片或形狀張貼在櫃子邊緣，以利幼兒對應歸位。 重量較輕的擺放在上層，較重的擺放在下層。 以省空間為原則，採完整形狀收納。 四倍塊需要較大的空間，如櫃體無法收 納，亦可擺放在牆邊。 23"},{"b":2,"p":26,"t":"小班則以外形為歸位的依據，可讓積木立起來，幼兒容易看見辨識及對應。 在櫃上張貼底部的形狀，方便歸位。 在牆面張貼整套完整積 木的形狀、名稱、數量 等圖式。 中小班幼兒在發展初期 提供半套，如紅色框中 的形狀，再視幼兒的經 驗提供整套積木。 24"},{"b":2,"p":27,"t":"積木片收納 使用有提繩的高瘦型紙箱盛裝 積木片，方便幼兒提拿及收拾。 使用 4 公升洗碗精瓶自製高瘦 型可提容器裝積木片，方便幼 兒單手提拿。 25"},{"b":2,"p":28,"t":"( 三 ) 適宜 的 配件用具 1. 提 供 符 合 幼 兒 發 展 的 作 品 範 例 圖 ( 含 基 本 範 例 圖 及 進 階 範 例 圖 )， 讓 幼 兒 依 自 己 的 能力選 擇探究。 2. 可在牆 面網板運用魔鬼 氈或木夾展示實景圖片，方便幼兒拿取。 3. 提供不 同類型的模型 ( 例如：交通工具與號誌、動物、植物等 )。 4. 提供 鬆散素材 ( 例如 ：紙捲筒、紙盒、紙箱、木板、P VC 管、木片、壓克力板等 ) 範例圖 運用桌曆製作各類建築或軌 道範例圖。 依各年齡需求，循序提供初階與 進階的搭建範例圖，如：平面→ 立體、積木參考圖→實際建築 / 軌道參考圖，並以顏色圓點貼或 星級做難易度提示。 26"},{"b":2,"p":29,"t":"軌道範例圖 提供不同難易度的範例圖，幫助幼兒認識搭 建技巧，如：實心與中空，橫排直立、平放 順接……等。 27"},{"b":2,"p":30,"t":"積木範例圖 1 3 2 4 提供自製平視、俯視角度之搭建步驟範例圖，引導幼兒以多角度觀察建築形態。 圖片來源：市立中壢幼兒園團隊自製。 2 4 1 3 28"},{"b":2,"p":33,"t":"實景圖片 模型 以橋樑為搭建的主題，提供各式各 樣橋梁的實景圖片，幼兒可以自由 取用參考。 張貼學校附近的建築實景圖。 提供交通工具及號誌。 31"},{"b":2,"p":34,"t":"模型放置在積木區的櫃體上。 動物模型與 LAQ 作品運用在積木區。 擬真的模型。 擬真的模型運用。 32"},{"b":2,"p":35,"t":"鬆散素材 提供木條、水管、紙捲供幼兒運用。 PVC 管。 繩子或毛線。 木片。 放置透明壓克力板供幼兒運用。 33"},{"b":2,"p":36,"t":"科學實驗的材料或配件 提供彈珠、各式大小重量不一 樣的球。 各種顏色骨牌。 配件分籃擺放，貼上圖片易於歸位。 34"},{"b":2,"p":37,"t":"( 四 ) 建議 的 參考書籍及繪本 1. 提 供幼兒 能理 解的 工具 書， 放置在幼兒易拿取的地方。 2. 提 供相關 的繪 本讓 幼兒 參考 發想。 3. 與 同積木 類別 ( 例如 ：積木片或單位積木 ) 搭建的範例書。 4. 提 供積木 區相 關書 籍及 繪本 參考： 《從前從前，火車來到小島》。玉山社。 《台灣鐵道》。蔚藍文化。 《奇幻鐵道博物館》。玉山社。 《小鐵的一天》。玉山社。 《跟著火車一起唱》。玉山社。 《哇！驚奇工程知識繪本 2：摩天大樓》。小光點。 《小翻頁大發現 2：我 的機械原理大發現》。水滴文化。 《 鏗鏗鏘鏘 北廠 實驗 室》。玉山社。 《 細看建築 》。 大石 國際文化。 《 有關建築 的 100 個故事 》。驛站。 《圖解台灣民居》。楓書坊。 《歡迎來我家！世界上最奇妙的 10 種住家》。上誼文化公司。 從無到有工程大剖析： 從無到有工程大剖析： 從無到有工程大剖析： 道路。小熊出版。 橋梁。小熊出版。 隧道。小熊出版。 從無到有工程大剖析： 臺灣彈起 POP UP 大樓。小熊出版。 TAIWAN。時報出版。 台灣古早厝。遠流。 35"},{"b":2,"p":38,"t":"老房子。親親文化。 STEAM 創造家：建築師 萊特：改變世界的形狀。 親子天下。 如果我是房子設計師。 采實文化。 哇！這是怎麼蓋出來 的？。小麥田。 翻開吧！城市大揭秘。 新雅。 小小建築師：童話裡的 建築大師。采實文化。 小翻頁大發現 1：我的 雄偉建築大發現。水滴 文化。 工程設計，原來如 此！。小天下。 世界建築小百科。世一 文化。 世界建築全知道。世一 文化。 36 揭秘建築。小皇冠文化。 我的建築形狀書。維京。"},{"b":2,"p":39,"t":"放置參考書籍的建議 運用木片及木塊組合自製放置參考書籍的書架。 運用現成 L 型書架 黏上智高積木，防 止書籍滑落。 購買現成書架。 37"},{"b":2,"p":40,"t":"各式展示書架。 將書籍展開放置在書架上。 將書籍展開平放在櫃上。 38"},{"b":2,"p":41,"t":"( 五 ) 展示 與 記錄 1. 規 劃原地 保留 幼兒 作品 展示 的空間。 2. 作 品介紹 標示 幼兒 姓名 、日 期、名稱、特色命名與介紹說明。 3. 提 供情境 的展 示， 例如 ：燈 光搭配、與其他區作品結合。 4. 拍 照、記 錄作 品歷 程、 海報 展示、幼兒以圖示記錄問題或作品的歷程。 展示與記錄 使用自製「保留區」立牌，鼓勵幼兒觀察、發現與深化作品。. 幼兒作品標示姓名、搭建起訖日期、作品名稱，使作品妥善保留和展示。 39"},{"b":2,"p":42,"t":"放置挑戰暨學習計畫，供幼兒自行記錄。 挑戰暨學習計畫，運用不同顏色圓點貼紙標示難易度。 運用夾板或透明書架，於作品旁展示幼兒挑戰暨學 運用衣架夾方便將歷程海報掛 習計畫紀錄及學習歷程。 在窗框上。 利用照片佐以文字記錄幼兒作 品歷程及問題。 40"},{"b":2,"p":43,"t":"除圖文紀錄方式，亦可使用照片方式留存作品。 以海報方式，將幼兒搭建橋梁的作品照片進行歸類。 圖片來源：新北市工務局 https://www.facebook.com/profile/100064438131825/search/?q=%E6%A9%8B%E5%AE% B6%E5%A4%A7%E9%9B%86%E5%90%88&locale=zh_TW 海報張貼於鄰近作品之牆面上，張貼高度以幼兒仰角 45 度為主。 幼兒口說，老師輔以文字記錄幼兒作品歷程及問題，幫助幼兒理解建構時所運用的策略。 41"},{"b":2,"p":44,"t":"討論「圓形的建築可以怎麼蓋？」幼兒運用照片與經驗討論，發現共通點， 進而歸納搭建成功的可能原因。 將幼兒搭建歷程運用磁鐵夾吸附在磁性白板上。 幼兒利用照片、圖畫與文字記錄問題解決歷程。 42"},{"b":2,"p":46,"t":"觀察在地建築，以實際圖片解構，探索過程中得以了解地方建築背景。 44"},{"b":2,"p":47,"t":"透過幼兒學習歷程分享，記錄幼兒合作搭建「小小比薩斜塔」方案歷程。 45"},{"b":2,"p":48,"t":"課程分享 桃園樂天棒球場課程分享～市立中壢幼兒園 課程分享者：余佩玲、尹台珍、蔡佩蓉 孩子在積木區的搭建，從自由玩索開始，以簡單的堆疊到複雜的建築物結構設計，當孩子 的搭建經驗越來越多，在地的特色建築也會成為孩子搭建的興趣，因此老師組合孩子有趣的生 活經驗，為引導探究的議題。過程中老師時而觀察、時而提供資源，適時調整老師參與的角色， 並與幼兒共同記錄方案歷程。本方案嘗試以貼近幼兒的觀察與解讀的方式，進行問題解決歷程 的分析，了解幼兒合作搭建的情形、構想及計劃，以做為提供與學習區萌發課程參考。 課程發展時間軸 萌發探索期 解構探索期 建構期 幼 兒 生 活 經 驗 分 享 串聯生活經驗 提出討論與統整想法 合作協商與分享歷程 • 觀察樂天棒球場實景圖 • 共同討論搭建方式 • 尋求老師協助共同討論 • 搭建主題 - 樂天棒球場 • 分工合作、互相協調 • 運用基本功進行搭建 作 品 討 論 及 分 享 • 實景圖和作品進行對照 • 檢視空間位置 • 探討相對位置關係 • 重新修正並調整架構方式 • 覺察建築結構 • 探究搭建技法 • 分享歷程 作 品 討 論 及 分 享 一、萌發探索期 萌發意 圖 ： 與 同儕分 享到 棒球 場看 球隊比賽， 想 要運用 KA PLA 積木蓋 一座「樂天棒球場」。 探索 階 段： 1. 共 同討論 怎麼蓋 ? 樂天棒球場實景圖。 一起討論如何搭建。 46"},{"b":2,"p":49,"t":"2. 動 手做做看 鋪陳馬路。 尋求老師協助，共同討論如何搭建主體 ~ 棒球場。 3. 動 手做做看 分工合作、互相協調。 運用基本功進行搭建。 4. 提出 問 題：主體棒球場 屋頂技巧 如 何搭建 ? 這裡要留位置，銜 接木片才能進行。 屋頂是三角形。 試試用這種搭建 方式。 二側要預留位置 。 47"},{"b":2,"p":50,"t":"5. 調整 修 正搭建方式 因基底木片高低 不平，搭建中常 倒塌。 調整簡單搭建方 式。 完成 ~ 樂天棒球 場。 棒球場內場 ~ 看 台、球場。 我在蓋 XPARK。 這邊是高鐵站。 棒球場附近的大 樓。 超商買東西。 華泰 名品城 XPARK 高鐵 捷運站 樂天 棒球場 住家 大樓 7-11 超商 住家 大樓 捷運站 捷運 道路 48"},{"b":2,"p":51,"t":"二、解構探究期 1 . 解構 建 物： 實景圖 和 實作照片對照，發現了 什 麼 ？ 2. 位 置圖和完成 作品 對照 ，發 現了 什 麼？ 3. 重 新再挑戰 幼兒 A：屋頂是直立不是平放。 幼兒 B：跟原來棒球場搭建方 式不太一樣。 幼兒 C：為什麼每層樓都一樣 ? 幼兒 D：怎麼沒入口 ? 幼兒 E：馬路位置很亂。 幼兒 F：公園是在棒球場附近。 幼兒 G：高鐵站搭建的位置要 調整。 幼兒 H：搭建時要注意每個建 築物的位置在哪 ? 49"},{"b":2,"p":52,"t":"三、建構期 1. 探究 建 構：分享、討論 調整木片的距離。 改用ㄇ字型搭建方式。 無法銜接每一個地方。 容易倒下，討論如何 參考圖示。 搭建 ? 觀察三種不同佇立方 式，看哪一個穩定度 高 ? 2. 分析 比 較：發現關鍵、修正策略 上層木片拆掉，換另一種方式搭建。 這組搭建法比較像棒球場 ! 50"},{"b":2,"p":53,"t":"好像比較平穩、窗戶的地方也很像 ! 我們來分工合作。 思考棒球場樓梯的搭建法。 觀眾看台的呈現。 球場內的擺放。 球員位置區。 位置的距離太寬了， 從下移動試試看。 完成主體 ~ 棒球場搭建。 怎麼辦 ? 51"},{"b":2,"p":54,"t":"新 舊 發現直立木片歪斜。 原來有新和舊的木片，所以大小高度 有點不一樣。 分工搭建棒球場附近的停車場、大樓、公園以及馬路。 桃園樂天棒球場 ~ 第一次建構。 桃園樂天棒球場 ~ 第二次建構。 桃園樂天棒球場 ~ 第三次建構。 3. 體認 創 新：分享成果 分享成功的經驗。 提出問題。 52"},{"b":2,"p":55,"t":"說明棒球場基本建構與設施。 分享搭建歷程。 合作創新的成果。 幼兒挑戰暨學習計畫 調整修正再出發 這 一 段 樂 天 棒 球 場 學 習 歷 程 是 因 為 孩 子 的 生 活 經 驗 而 引 發， 對 於 孩 子 在 學 習 區 自 主 學 習 而 言 是 珍 貴 的。 孩 子 已 經 跳 脫 單 純 的 積 木 堆 疊， 原 來 棒 球 場 可 以 透 過 多 樣 的 組 合 形 式 完 成 搭 建， 更 珍 貴 的 是 孩 子 已 經 從 使 用 者 的 角 度 去 呈 現， 搭 建 棒 球 場 要 有 提 供 觀 眾 的 入 口、 座 椅， 要 有 球 員 打 球 的 地 方 …… 等， 真 正 去 思 考 人、 活 動、 建 築之間的關係，孩子已然成為建築設計師。 當 然 積 木 建 構 課 程 還 包 含 了 空 間、 幾 何 圖 形、 結 構、 美 學 等 概 念， 無 法 在 有 限 的 篇 幅 做 出 完 整 的 課 程 分 享， 但 是 希 望 此 篇 能 提供整理幼兒學習歷程的另一種可能。 53"},{"b":2,"p":56,"t":"扮演區 整體規劃設置 ( 一 ) 規劃前先思考 1. 這學期扮演區的學習目標為何？ 2. 教室現有的環境條件為何？ 3. 扮演區依學習目標要設計何種扮演情境？ 4. 扮演情境是否符合幼兒年齡及生活經驗？ 5. 收納櫃、桌椅、教具、玩具該怎麼擺放？動線順不順暢？ 6. 設計的扮演情境能不能引起幼兒的興趣，能使幼兒自然展開扮演和對話？ 7. 扮演使用的道具、配件是否安全？ ( 二 ) 設計原則 1. 扮演符合幼兒真實的生活經驗 / 情境，引發幼兒興趣，使扮演行為能「假戲真做」，例如： 家庭扮演類、社區機構類 -- 職業 / 機構、想像角色類。 2. 獨立完整的學習區域 ( 以櫃 / 架 / 地墊 / 走道區隔 )，全區規劃至少可容納 3-4 人。 3. 設計時思考幼兒拿取及操作玩具 / 材料的近便性，依操作類別，設置區中區，且注意操作 動線流暢、完整及合理性。例如 : 家裡真實生活情境中有洗菜、切菜…等。 4. 整體規劃與氛圍營造貼近幼兒閱讀與生活經驗，彈性運用適宜的道具和布置，以營造符合 扮演氛圍的情境，例如：情境規劃有餐桌、布幕、場景、舞台…；角色營造有配件、道具、 工具、布類、服裝…等。 5. 因應不同場景提供多樣的材料，依據幼兒年齡提供不同結構性的服裝、配件，原則為：年 齡越小，材料結構性越高、越具象；年齡越大，材料結構性低、創造性越高，提供幼兒想 像空間。 6. 提供尊重及考量幼兒不同性別、氣質的玩具 / 材料。 7. 物品分類擺放，有清楚的歸位標示，使學習區整齊有序，色彩簡單和諧、氣氛溫馨。 8. 評估並檢查道具、配件、電器操作上潛在的危險及疑慮，例如：是否有微小的鈕扣、物件 幼兒容易誤食？使用扮演之電器是否會漏電？…等。 ( 三 ) 設置類別 1. 家庭扮演類（例如：廚房、親子、手足、家務、野餐、露營） 2. 社區機構類：職業（例如：醫生、護理師、服裝設計師、郵差）、機構（例如：醫院、美 容院、服飾店、商店） 3. 想像角色類（例如：恐龍、太空、海盜、科幻、童話故事、卡通、自創故事） 54"},{"b":2,"p":57,"t":"( 四 ) 照片說明 1. 桃園國小附設幼兒園教室與扮演區：班級 A 教室平面圖與教室全景 教室 平面圖 美勞區 組合建構區 積木區 扮演區 拍攝角度 自然 觀察區 美勞區美勞區 數學區 語文區 組合組合 建構建構區區 積木區積木區 數學區數學區 教室全景 扮演區扮演區 教室空間為方形，大小約 21 坪，空間寬敞明亮。 設置 6 個基本區，為數學區、語文區、積木區、美勞區、組合建構 區及扮演區；並增設 1 個特別區為自然觀察區。 各學習區以櫃體 / 走道與其他學習區做區隔。 操作的桌面和地面照度至少 500Lux，設施設備色彩單純和諧。 55"},{"b":2,"p":58,"t":"炒米干區 擔仔麵區 梳妝台 好吃 麵店區 涼 麵 區 出餐收銀區 自助 滷味區 髮 飾 區 家庭 裝扮區 帽子 包包 複合式美甲桌 用餐桌 拍攝角度 扮演區 全景圖 鬆散 布料 衣櫃 配件區 成套 服裝 衣櫃 扮演區 平面圖 56"},{"b":2,"p":59,"t":"設置獨立遊戲空間，因應教室空間充足且僅有少量固定式櫃體，扮演區全區大小可容納至 5-6 名幼兒。 分成 2 個區中區空間，分別為好吃麵店區 ( 融入複合式美甲空間 ) 及家庭裝扮區，依據操作 性質再細分區域如平面圖。 各區中區的教具分櫃、分層架擺放於表面，幼兒易於拿取，符合近便性與開放性。 以櫃體區隔區中區，利用紗簾 / 珠簾增加軟性氛圍，兩區增設不同燈光美化空間。 ※ 調整建議： 幼兒依據觀察和經驗，可因情境需求擴增區中區，形成複合式機構服務，使扮演延伸，例如： 客人等餐時提供拍照道具、桌遊…等服務。 57"},{"b":2,"p":60,"t":"2. 桃園國小附設幼兒園教室與扮演區：班級 B 教室平面圖與教室全景 扮演區 積木區 教室 平面圖 美勞區 數學區 圍柵 語文區 拍攝角度 教室全景 扮演區扮演區 積木區積木區 美勞區美勞區 數學區數學區 教室空間為方形，大小約 21 坪，空間寬敞明亮。 設置 5 個基本區，為數學區、語文區、美勞區、積木區及扮演區，教室內部角落設有一半開 放的圍柵空間，將語文區設置於此空間。 各學習區以櫃體 / 走道與其他學習區做區隔。 操作的桌面和地面照度至少 500Lux。 58"},{"b":2,"p":61,"t":"扮演區 平面圖 全 身 鏡 屏 風 佈 置 牆 扮演區 全景圖 古早味零食裝盤區 冰箱 pizza 區 餐桌區 廚房區 夾 心 餅 乾 區 餐桌 拍攝角度 義 大 利 麵 區 衣 帽 架 設置獨立遊戲空間，教室僅設置 5 個基本區域，故扮演區空間充足，全區大小可容納至 5-6 名幼兒。 分成開放廚房區及餐桌區 2 個區中區。 各區中區的教具分櫃 / 籃擺放於桌面，幼兒易於拿取，符合近便性與開放性。 以屏風 / 櫃體 / 層架區隔區中區，區中區上方利用布簾增加軟性氛圍。 空間足夠同時扮演不同情境但相關聯的區中區 ( 家中的廚房與用餐環境 )。 佈置、光線明亮，各類家具、家飾有質感、材質自然。 59"},{"b":2,"p":62,"t":"扮演區 區中區設置 ( 一 ) 區中 區 的收納 1. 教具 、 玩具收納清楚易 見，使幼兒扮演時取用順手。 2. 教具 、 玩具、收納盤 / 盒可 參考真實生活情境擺放。 3. 收納 盤 / 盒收拾 歸位的對應標示。 4. 收 納盤 / 盒呈現 出色彩簡單和諧，有質感。 5. 教 具、玩 具依 形狀 、大 小、 材質分別擺放，且有對應標示。 6. 規 劃掛衣 架 / 掛繩 / 掛勾便 於幼兒選取想扮演的角色服飾。 ( 二 ) 區中 區 的適切教具 1. 內 容 物 的 規 劃 應 與 扮 演 區 情 境 主 題 相 符， 內 容 設 計 幼 兒 易 於 理 解， 方 便 幼 兒 進 行 扮 演。 2. 提供 足 量的玩具 / 材料 / 服飾，且安全、狀況良好。 3. 以生活中真實的物品及鬆散之材料作為道具 / 家具。 4. 扮演材料或角色服飾應為相同套組，或提供大小比例可配搭之玩具 / 材料 / 服飾。 5. 應注意幼兒性別平等、年齡層相符的玩具 / 材料。 6. 設置一至兩個與華人 / 台灣 / 在地文化專題相關的扮演服飾、道具或扮演情境。 7. 裝扮區域設置安全穩固的穿衣鏡。 8. 提供與扮演區目標相符的圖文資料供幼兒參考應用。 9. 提供與扮演主題相關之相關繪本，供幼兒閱讀、討論、參考，進行改編扮演遊戲。 10. 自製玩具 / 素材可 依節令和遊戲主題，隨時調整更換。 ( 三 ) 區中 區 之故事與記錄 1. 鼓 勵 幼 兒 改 編 繪 本 進 行 扮 演， 並 針 對 幼 兒 的 方 案 構 想， 引 發 幼 兒 依 據 生 活 經 驗 編 創 故事進行扮演。 2. 拍 攝 幼 兒 扮 演 過 程 ， 製 作 成 經 驗 圖 表 的 海 報 展 示， 照 片 展 示 標 示 日 期 及 姓 名， 系 統 地分類並按時間序展示。 3. 幼兒扮演過程可以照片 / 圖示或各類圖 / 表記錄，可鼓勵幼兒共同參與記錄。 4. 教 師 分 析 幼 兒 扮 演 遇 到 問 題 及 解 決 問 題 方 案， 針 對 關 鍵 事 件 製 作 經 驗 圖 表 的 海 報 展 示。 5. 展示與記錄符合近便性，且符合幼兒的視線高度（平視至仰角 45 度）。 6. 說明安全注意事項及扮演步驟。 60"},{"b":2,"p":63,"t":"( 四 ) 照片 說 明：班級 A 區域設計 - 好吃麵店區 獨立且完整的扮演情境，以 60 公分高之半開放性矮櫃與其他區中區做區隔。 規劃 3 座開放式易拿取的工作櫃，以ㄇ字型排列，分隔為獨立的餐點準備空間，老闆工作空 間包含：炒米干區、擔仔麵區、涼麵區、自助滷味區、收銀出餐區，每個工作區可容納 1 人， 動線完整且幼兒易於理解。 以滷味區、收銀出餐區設置為櫃檯，提供老闆及客人角色互動情境。 另增設複合式美甲桌，提供等待客人進行美甲服務，可容納美甲師及客人各 1 人。 使用小盆栽美化空間。 涼麵區的操作 為一字型設計，櫃體區隔好吃麵店區及家庭裝扮區 2 個區中區。 扮演食材擺放於工作檯面，陳列整齊。 櫃體下方設置餐具收納及冰箱。 61"},{"b":2,"p":64,"t":"炒米干∕擔仔麵區的操作 設置模擬真實餐廚情境，以不同高度的櫃體區分工作檯面。 利用壁掛木箱、網架模擬真實情境之廚房吊櫃，陳設易於幼兒取用物品。 瓦斯爐、鍋具…陳設於工作檯面上，操作方式易於幼兒理解。 自助滷味區的操作 設置於櫃檯轉角處，以透明掀蓋收納箱陳設為滷味食材櫥窗。 設計為自助式取餐，用具食材擺放順手，易於幼兒理解。 62"},{"b":2,"p":65,"t":"收銀出餐區的操作 複合式美甲桌的操作 設於自助滷味區旁，設置為一字 型半開放空間，客人動線為自助 夾取滷味－取餐－結帳，動線流 暢，提供老闆及客人的互動空 間。 利用網架懸掛麵店招牌及菜單價 目表。 使用櫃檯下方空間展示幼兒歷程 及團體討論記錄海報，幼兒易於 觀看。 以一座長型矮桌搭配顏色和諧、 有質感之坐墊設立獨立美甲桌。 空間及材料色彩簡單和諧。 63"},{"b":2,"p":66,"t":"區中區的收納 - 好吃麵店區 扮演鍋具、餐具、烹調用品整齊收納於櫃體中， 依據類別擺放，且有對應標示。 提供幼兒日常生活真實餐具。 食器依類別分層擺放，各層有對應歸位的標示。 扮演食材模擬真實情境，依據食材類別以保鮮盒分別收 納，並有清楚的文字、圖示對應歸位位置。 利用層架、網架增加多層次的收納空間，材料陳列於操 作檯面上，幼兒取用近便。 扮演食材依據形狀、大小、材質分別擺放，且有對應照 片標示。 64"},{"b":2,"p":67,"t":"模擬真實情境之收納方式，麵店結束營業後，老闆須將食材蓋上保鮮盒蓋，冷藏於冰箱中。 各個食材保鮮盒上有清楚的文字對應標示。 運用櫃體加上塑膠片及紙材、節能標章製作冰箱，使扮演情境更真實。 模擬幼兒日常生活 中情境設置鍋爐， 可直接將鍋具擺放 於鍋爐上方。 將廚房用具逐個加上掛環，架設網架搭配門背掛鉤收納，幼兒 取用順手。 設置時需注意幼兒高度 ( 該班級為中班幼兒 )，易於幼兒取用。 使用顏色、文字及圖示對應標示歸位。 65"},{"b":2,"p":68,"t":"物品擺放於操作桌面，符合近便性， 使幼兒取用方便，並有器材對應歸位 的標示圖。 考量幼兒生活情境，依據食材類別分 罐收納。 模擬日常真實情境，以木箱裝置成廚 房吊櫃，將調味料收納於吊櫃上方。 高度設置易於幼兒伸手取用。 以掛畫、自然元素美化，增添情境氛 圍。 66"},{"b":2,"p":69,"t":"區中區的適切教具 - 好吃麵店區 利用鋁箔紙及毛線製作擬真水龍頭， 搭配水盆，營造擬真扮演情境。 提供安全的真實鍋具，並設置擬真瓦斯爐 台，幼兒易於理解扮演主題。 以台灣文化常見小 吃—擔仔麵為扮演 主題。 提供餐點烹煮步 驟，並搭配圖示說 明，幼兒能理解操 作方式。 提供真實湯麵烹煮鍋具、篩網，操作方式易於幼兒理解。 提供華人 / 台灣文化常見菜餚 ( 滷肉、滷蛋、蔥花 ) 作為扮 演素材，擺放於操作檯面上，幼兒取用方便順手。 ※ 調整建議： 自製玩具 / 素材可依節令和遊戲主題，隨時調整更換，同時 鼓勵幼兒結合其他學習區自由創作運用。 提供擔仔麵所需調味 料品，放置於鍋爐旁， 幼兒取用順手。 扮演之調味料瓶罐須 封口，避免幼兒誤食。 67"},{"b":2,"p":70,"t":"以桃園在地文化 小吃—炒米干為 扮演主題。 提供餐點烹煮步 驟，並搭配圖示說 明，幼兒能理解操 作方式。 提供炒米干所需調味品及油，以壁架擺放 於鍋爐旁，幼兒取用順手。 提供台灣文化之調味品供幼兒扮演，調味 料瓶罐須封口，避免幼兒誤食。 運用各種素材自製符合大小比例的扮演食材玩具，例如：輕質土青菜、荷包蛋、丸子；軟塑 膠片米干…等。 炒米干所需食材玩具放置於鍋爐旁，幼兒扮演取用時能近便順手。 ※ 調整建議： 自製玩具 / 素材可依節令和遊戲主題，隨時調整更換，同時鼓勵幼兒結合其他學習區自由創 作運用。 68"},{"b":2,"p":71,"t":"以台灣文化常見小吃— 涼麵為扮演主題。 提供餐點烹煮步驟，並 搭配圖示說明，幼兒能 理解操作方式。 拌涼麵所需食材玩具擺 放於檯面上，方便幼兒 扮演取用。 有清楚的文字及圖示標 示位置，擺放整齊有 序。 提供大小比例可配搭的 盛裝木質餐盤。 運用各種素材自製相關食材玩具，例如：中國繩黃麵條、不織布黃瓜絲、 吸管蔥花、紙材紅蘿蔔絲∕蛋絲、輕質土配料…等。 ※ 調整建議： 自製玩具 / 素材可依節令和遊戲主題，隨時調整更換，同時鼓勵幼兒結合 其他學習區自由創作運用。 69"},{"b":2,"p":72,"t":"自助滷味區、餐具參考真實生活情境擺放，模擬幼兒日常生活滷味攤 販，設置透明冰櫃擺放食材。 提供華人 / 台灣文化常見食物 ( 滷味 )，增加調味料及盛盤器具供幼兒進行扮演。 扮演食材、調味品擺放具近便性，並有對應標示。 扮演之調味料瓶罐須封口，避免幼兒誤食。 70"},{"b":2,"p":73,"t":"運用不織布、輕質土自製相關食材玩具， 大小比例可配搭的盛裝餐盤。 素材安全、足量且狀況良好。 提供華人 / 台灣文化常見料理菜單及 價目，供幼兒扮演時參考。 71"},{"b":2,"p":74,"t":"收銀出餐區動線流暢，扮演器具擺放於檯面上，易於幼兒理解使用。 依據扮演性質設置收銀台及點餐電話，加入發票單據、會員卡、錢幣供幼兒扮演使用。 提供與裝扮角色相符的成套 扮演服。 服裝符合性別平等。 72"},{"b":2,"p":75,"t":"提供各色桌布、花束等材料，幼兒能運用進行布置，增添情境氛圍。 視扮演情境增加工具書供幼兒扮演參考。 圖片來源處： 什麼都不會就會煮麵。維綺文化。 73"},{"b":2,"p":76,"t":"提供與扮演類別相關繪本，鼓勵 幼兒發揮想像改編和延伸扮演。 圖片來源處： 廚房用具大作戰。小熊出版社。 提供各色安全無毒的 幼兒指甲油、美甲器 材、酒精、指緣油及 護手霜。 用具擺設符合近便 性，設置易於理解， 方便幼兒扮演取用。 利用感應式燈具製作 美甲光療機，使幼兒 扮演情境更真實。 設置指甲彩繪等相關 材料做為扮演道具之 用。 提供圖文資料 ( 塗指 甲油步驟圖 ) 供幼兒 參考運用。 依據扮演情境增加美甲服務項 目說明。 74"},{"b":2,"p":77,"t":"區中區之故事與記錄 - 好吃麵店區 以學習區紀錄形式，將在校問題 解決之結論讓幼兒帶回家中與家 人分享，再次回顧學習歷程。 師生共同建立扮演流程，製作成經驗圖表展示， 幼兒可再次回顧。 幼兒記錄好吃麵店的菜餚烹煮計畫，以及後續回顧 紀錄展示於扮演區域中。 需注意展示高度，以平視至仰角 45 度。 幼兒以口語描述扮 演所遇問題、解決 方案及幼兒感受。 透過親師合作之學 習區紀錄單，幼兒 回顧扮演歷程，使 家長更了解幼兒學 習狀況。 75"},{"b":2,"p":78,"t":"區域設計 - 家庭裝扮區 獨立且完整的扮演情境，以 60 公分高之矮櫃及搭配線簾與其他學習區做區隔。 以木箱及 3 座開放式易拿取的工作櫃設置家庭裝扮區。 設置安全穩固的穿衣鏡及化妝鏡。 以兩座開放式櫃體 搭配ㄇ型立架設置 布料區、配件區、 衣服區，模擬真實 生活情境更衣空間 陳設。 76"},{"b":2,"p":79,"t":"以一座開放式圓弧形櫃體設置梳妝台，選用顏色溫暖具有質感的布椅搭配。 增設網架收納小型髮飾配件，易於幼兒操作取用。 以兩座開放式櫃體搭配ㄇ型立架設 置布料區、配件區、衣服區，模擬 真實生活情境更衣空間陳設。 77"},{"b":2,"p":80,"t":"區中區的收納 - 家庭裝扮區 提供各式配件供幼兒選擇，例如： 裝飾眼鏡、太陽眼鏡、手錶…等。 用透明壓克力層架擺放各式顏色之 的配飾，避免裝飾區域色彩凌亂。 眼鏡、手錶置於平台上，易於幼兒 選用。 服裝以衣架懸掛，便於 幼兒選取想扮演的角色 服飾。 將窗簾吊桿裝設於層櫃 中，可創造衣櫃空間。 提供不同材質、顏色的鬆散布材讓幼兒搭配，分籃收納。 提供各種角色對應的配件，例如：各式武器、匕首、魔法棒、探險家眼鏡…等，配件陳列於 架上，各項目清楚易見，方便幼兒選用，並有對應歸位的標示。 78"},{"b":2,"p":81,"t":"依據首飾類型選擇不同收納 容器，使用小型收納盒∕耳 環展示架放置耳環等小型配 飾；項鍊、手鍊、戒指擺放 於首飾盒中，注意幼兒取用 時的便利及順手。 利用圖片進行對應歸位標示。 模擬日常生活梳妝台陳設， 化妝品擺放於操作檯面上， 以透明壓克力容器陳列。 保養品、香水放置於開放性 櫃體中，以不同款式容器依 類別分類收納，陳列方式整 齊、色彩和諧具有美感。 搭配網架籃收納， 幼兒取用順手。 各項裝扮零件分 層、分盒擺放，並 有對應歸位的標 示圖。 79"},{"b":2,"p":82,"t":"區中區的適切教具 - 家庭裝扮區 服飾區域設有安全 的穿衣鏡及化妝 鏡，注意鏡子穩定 度，可以底面積較 大的櫃體、架子固 定。 以真實用品供幼兒扮演使用，增添情境真實感。 注意物品安全性，裝有液態內容物之道具，須以膠封口，避免幼兒誤食 / 用。 80"},{"b":2,"p":83,"t":"提供大小適宜、形式多元之成套角色扮演服裝，需注意提供不同性別的服飾。 年齡越小 / 扮演經驗較缺乏之幼兒，可提供較具象之成套服飾。 注意服裝上之扣子、拉鏈、綁繩…等零件是否穩固，避免幼兒誤食 / 受傷。 提供不同材質、色彩 之鬆散布料於裝扮 區，幼兒可發揮創意 進行服裝搭配。 年齡越大 / 具有扮演 經驗之幼兒，可提供 創造性高、結構性低 之布料，幼兒可發揮 創造力搭配服裝。 鼓勵幼兒互相協助、 檢視裝扮。 81"},{"b":2,"p":84,"t":"提供安全、易於操作的夾子，供幼兒固定布料 / 衣物。 擺放需使幼兒取用方便，避免一邊固定衣物，一邊翻 找夾子的不便。 提供夾面寬或夾面設有防滑橡 膠設計的夾子，易於幼兒固定 布料 / 衣物，不易滑落。 融合華人 / 台灣文化的扮演服飾。 帽子擺放於櫃體上方；搭配層架 / 掛 鉤收納配飾，陳設清楚易見，方便幼 兒選用。 各項配飾以圖片對應標示歸位位置。 82"},{"b":2,"p":85,"t":"提供符合幼兒尺寸的包包 / 首飾供幼兒扮演選用。 注意包包 / 首飾的零件是否穩固，避免幼兒誤食 / 受傷。 提供不同造型搭配範例供幼兒扮演參考，並融入異國文化及角色的服裝搭配。 83"},{"b":2,"p":86,"t":"區中區之故事與記錄 - 家庭扮演區 以學習單記錄幼兒個人扮演計畫以及回顧紀錄，回顧紀錄包含：幼兒扮演歷程、感受和遇到 的問題…等。 幼兒學習單展示於家庭裝扮區空間中，標註幼兒姓名及扮演週次，依近期時間排序，隨時間 抽換更替。 84"},{"b":2,"p":87,"t":"提供扮演情境與多元服飾、配飾及鬆散布材，材料的運用方式幼兒易於理解，幼兒依據喜好 規劃裝扮造型，並以圖像記錄。 85"},{"b":2,"p":88,"t":"老師分析幼兒扮演所遇 問題，透過師生共同討 論，發展解決問題的方 式，並以照片搭配文字 說明，展示幼兒成功經 驗。 扮演所遇問題，以幼兒扮演歷程照片及文字說明製作成經驗圖表展示於扮演區 域中。 需注意展示高度，以平視至仰角 45 度。 86"},{"b":2,"p":89,"t":"( 五 ) 照片 說 明：班級 B 區域設計 教 室 扮 演 情 境 由 2 個 區 中 區 組 成， 分 別 為「 開 放 廚 房 區 」 及「 餐 桌 區 」。2 個 區 中 區 為 家庭 情 境中相關聯的區 中區。 開放廚房區的操作 獨立且完整的扮演情境，以 40 公分高之工作櫃並架設穿透性網架，與其他學習區做區隔。 規劃 3 座開放式易拿取的工作櫃及 1 組廚具扮演組及 1 個冰箱櫃，以ㄇ字型排列，分隔為獨 立的餐點準備空間，包含：義大利麵區、pizza 區、夾心餅乾區，動線完整且幼兒易於理解。。 考量幼兒年齡層為小班，設置單純的進出動線。 烹調用具 / 食材玩具擺放於檯面上，易於幼兒操作扮演。 義大利麵區的操作 扮演所遇問題，以幼兒 扮演歷程照片及文字說 明製作成經驗圖表展示 於扮演區域中。 需注意展示高度，以平 視至仰角 45 度。 87"},{"b":2,"p":90,"t":"冰箱∕ Pizza 區的操作 夾心餅乾區 (可食用) 的操作 獨立完整的工作檯 面，可容納 1 人。 扮演食材、用具陳 設於工作檯面上， 操作方式易於幼兒 理解。 隨幼兒扮演經驗增加，增設夾心餅乾區，提供簡易可食用的夾心餅乾製作，融入幼兒扮演情 境中。 以開放性層架設置獨立完整的工作檯面，可容納 1 人。 食材、用具陳設於工作檯面上，操作方式易於幼兒理解。 需注意幼兒手部清潔及食材保存之衛生安全。 88 隨幼兒扮演經驗增加，增設夾心餅乾區，提供簡易可食用的夾心餅乾製作，融入幼兒扮演情 境中。 以開放性層架設置獨立完整的工作檯面，可容納 1 人。 食材、用具陳設於工作檯面上，操作方式易於幼兒理解。 需注意幼兒手部清潔及食材保存之衛生安全。"},{"b":2,"p":91,"t":"獨立且完整的扮演情境，內設有古早 味甜點裝盤區。 使用線軸為家庭餐桌，放置坐墊，以 各式物品增添情境氛圍。 各類傢俱∕家飾具有質感，材質自然 且顏色和諧。 利用自然元素綠化空間，搭配棉布、 花瓶、盆栽、幼兒作品…等裝飾美化 空間。 以竹籐屏風設為客廳壁面，加入情境 裝飾，幼兒可依據生活經驗∕遊戲主 題佈置。 客廳區的操作 古早味甜點裝盤區的操作 提供台灣文化 點心為扮演素 材，各類素材 分層∕櫃整齊 擺放。 運用木箱設置 為開放性收納 櫃體。 89"},{"b":2,"p":92,"t":"區中區的收納 提供真實烹調用具，輔以紙盒、瓶蓋製成 瓦斯爐，利用瓶蓋製成瓦斯開關，搭配紙 盒、瓦斯爐，打造烹調環境。 依據幼兒日常生活情境設置鍋爐及流理 臺，並考量取用近便性，可直接將鍋具擺 放於鍋爐上方。 考量情境中烹煮材料取用的近便性，扮演食材玩具、器具及參考書目擺設於操作檯面上。 90"},{"b":2,"p":93,"t":"考量幼兒生活情境，依據食材類別分盒 / 罐收納，並以圖片做為對應歸位的標示。 運用回收調味品罐、醬料罐加入素材，製作成烹飪扮演調味品。 扮演相關教玩具、參 考書目依類別分籃∕ 櫃擺放，以圖片對應 歸位標示。 烹煮義大利麵所需食 材、食器直接擺放於 操作檯面上，使幼兒 方便取用。 91 考量情境中烹煮材料取 用的近便性，利用小層 架設於操作檯面上。 各項食材分盒 / 罐收納， 圖片進行對應歸位標 示。 將盒子底部固定於層架 上，使幼兒收納時能維 持整齊有序。"},{"b":2,"p":94,"t":"區中區的適切教具 運用各種素材自製相關食材玩具，例如：棉布義大利麵條、不織布菠菜 / 紅蘿蔔麵條、輕質 土配料。 大小比例可配搭的盛裝餐盤。 ※ 調整建議：自製玩具 / 素材可依節令和遊戲主題，隨時調整更換，同時鼓勵幼兒結合其他學 習區自由創作運用。 幼兒票選最常吃的義大利麵口味，設計為義大利麵食譜，加入材料數量，供幼兒扮演參考。 92"},{"b":2,"p":95,"t":"提供餐點烹煮步驟及注意事項，並搭配圖示說明，幼兒能理 function rtClean(h){
  const root=document.createElement("div");root.innerHTML=String(h||"");
  const colorOk=v=>/^(#[0-9a-f]{3,8}|rgba?\([\d\s,.]+\))$/i.test(String(v||"").trim());
  const cl=n=>{
    if(n.nodeType===3)return esc(n.nodeValue);
    if(n.nodeType!==1)return "";
    const t=n.tagName;
    if(t==="SCRIPT"||t==="STYLE")return "";
    const inner=Array.from(n.childNodes).map(cl).join("");
    if(t==="BR")return "<br>";
    if(t==="B"||t==="STRONG")return "<b>"+inner+"</b>";
    if(t==="I"||t==="EM")return "<i>"+inner+"</i>";
    if(t==="U")return "<u>"+inner+"</u>";
    if(t==="DIV"||t==="P")return "<div>"+inner+"</div>";
    if(t==="SPAN"||t==="FONT"){
      const st=n.style||{},o=[];
      const fw=st.fontWeight;if(fw==="bold"||+fw>=600)o.push("font-weight:bold");
      if(st.fontStyle==="italic")o.push("font-style:italic");
      if((st.textDecoration||st.textDecorationLine||"").indexOf("underline")>=0)o.push("text-decoration:underline");
      const col=st.color||(t==="FONT"?n.getAttribute("color"):"");if(colorOk(col))o.push("color:"+col);
      const bg=st.backgroundColor;if(colorOk(bg))o.push("background-color:"+bg);

      if(m){let pt=m[2]==="px"?+m[1]*0.75:+m[1];pt=Math.max(8,Math.min(48,Math.round(pt)));o.push("font-size:"+pt+"pt")}
      const ff=(st.fontFamily||(t==="FONT"?n.getAttribute("face"):"")||"");
      const hit=RT_FONTS.find(f=>ff.indexOf(f)>=0);if(hit)o.push('font-family:\''+hit+'\'');
      return o.length?'<span style="'+o.join(";")+'">'+inner+"</span>":inner;
    }
    return inner;
  };
  return Array.from(root.childNodes).map(cl).join("");
}

        const pu=x=>x.u,ap=r.photos[i].filter(x=>!q.photos[i].some(y=>pu(y)===pu(x))),rp=q.photos[i].filter(x=>!r.photos[i].some(y=>pu(y)===pu(x)));if(ap.length)L.push(P+"新增照片連結："+ap.map(x=>x.t||x.u).join("、"));if(rp.length)L.push(P+"移除照片連結："+rp.map(x=>x.t||x.u).join("、"))}
      {const ra=(r.rphotos||[]).filter(x=>!(q.rphotos||[]).some(y=>y.u===x.u)),rr=(q.rphotos||[]).filter(x=>!(r.rphotos||[]).some(y=>y.u===x.u));if(ra.length)L.push(w+"新增活動照片連結："+ra.map(x=>x.t||x.u).join("、"));if(rr.length)L.push(w+"移除活動照片連結："+rr.map(x=>x.t||x.u).join("、"))}

<script>
window.PdfUtil=(function(){
const H2C="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",JSP="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
const loadScript=u=>new Promise((ok,bad)=>{const s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=()=>bad(new Error("無法載入 PDF 工具（"+u.split("/").pop()+"），請檢查網路後再試"));document.head.appendChild(s)});
async function libs(){if(!window.html2canvas)await loadScript(H2C);if(!(window.jspdf&&window.jspdf.jsPDF))await loadScript(JSP)}
const MM=96/25.4;
async function htmlToPdf(html,o){
 await libs();
 const pw=o.landscape?297:210,ph=o.landscape?210:297,m=o.margin||10,cw=pw-2*m,chmm=ph-2*m,wpx=Math.round(cw*MM);
 const fr=document.createElement("iframe");fr.style.cssText="position:fixed;left:-20000px;top:0;width:"+Math.round(wpx/0.4)+"px;height:2000px;border:0;background:#fff";document.body.appendChild(fr);
 try{
  await new Promise(ok=>{fr.onload=ok;fr.srcdoc=html});
  const doc=fr.contentDocument,st=doc.createElement("style");
  st.textContent="html,body{margin:0!important;padding:0!important;background:#fff!important}.bar{display:none!important}";doc.head.appendChild(st);
  await Promise.all(Array.from(doc.images).map(im=>im.complete?1:new Promise(r=>{im.onload=im.onerror=r;setTimeout(r,15000)})));
  await new Promise(r=>setTimeout(r,250));
  const units=Array.from(doc.querySelectorAll(o.units));
  if(!units.length)throw new Error("沒有可轉成 PDF 的內容");
  const jsPDF=window.jspdf.jsPDF,pdf=new jsPDF({orientation:o.landscape?"l":"p",unit:"mm",format:"a4"});
  let first=true;
  for(const u of units){
   u.style.boxSizing="border-box";
   const fitU=!!(o.fit&&u.matches(o.fit));let z=1;
   if(fitU){const pg=chmm*MM,vis=zz=>{u.style.width=Math.round(wpx/zz)+"px";return u.offsetHeight*zz};if(vis(1)>pg){let lo=.4,hi=1;for(let k=0;k<9;k++){const mid=(lo+hi)/2;if(vis(mid)<=pg)lo=mid;else hi=mid}z=lo;vis(z)}}else{u.style.width=wpx+"px"}
   const cv=await window.html2canvas(u,{scale:2,useCORS:true,backgroundColor:"#ffffff",logging:false,windowWidth:Math.round(wpx/z)});
   const W=u.offsetWidth,H=u.offsetHeight,sc=cv.width/W,pageHpx=chmm*MM,top=u.getBoundingClientRect().top;
   if(fitU){if(!first)pdf.addPage();first=false;pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",m,m,cw,H/W*cw);continue}
   const cuts=Array.from(u.querySelectorAll("tr,figure,.tool")).map(e=>e.getBoundingClientRect().bottom-top).sort((a,b)=>a-b);
   let y=0;
   while(y<H-1){
    let end=Math.min(H,y+pageHpx);
    if(end<H){const c=cuts.filter(v=>v>y+40&&v<=end);if(c.length)end=c[c.length-1]}
    const sl=document.createElement("canvas");sl.width=cv.width;sl.height=Math.max(1,Math.round((end-y)*sc));
    const cx=sl.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,sl.width,sl.height);cx.drawImage(cv,0,Math.round(y*sc),cv.width,sl.height,0,0,cv.width,sl.height);
    if(!first)pdf.addPage();first=false;
    pdf.addImage(sl.toDataURL("image/jpeg",0.9),"JPEG",m,m,cw,(end-y)/W*cw);
    y=end}
  }
  return pdf.output("blob");
 }finally{fr.remove()}}
async function upload(blob,o){
 const url=window.__driveUrl;if(!url)throw new Error("管理員尚未設定雲端硬碟上傳網址");
 const user=firebase.auth().currentUser;if(!user)throw new Error("尚未登入");
 const token=await user.getIdToken();
 const data=await new Promise((ok,bad)=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(",")[1]);fr.onerror=bad;fr.readAsDataURL(blob)});
 const r=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({token:token,filename:o.filename,subfolder:o.subfolder||"",folderId:o.folderId||"",data:data})});
 let j;try{j=await r.json()}catch(e){throw new Error("上傳網址沒有正確回應，請確認 Apps Script 已部署為「任何人」可存取的網頁應用程式")}
 if(!j.ok)throw new Error(j.error||"上傳失敗");return j}
function folderId(u){const m=String(u||"").match(/folders\/([\w-]+)/)||String(u||"").match(/[?&]id=([\w-]+)/);return m?m[1]:""}
return{htmlToPdf:htmlToPdf,upload:upload,folderId:folderId}})();

      }, this.snapErr('讀取歸還申請發生問題')));

      this.unsubs.push(this.db.collection('roster').doc('teachers').onSnapshot(d => { this.teacherRoster = d.exists ? (d.data().list||[]) : []; }, () => {}));
      this.unsubs.push(this.db.collection('settings').doc('drive').onSnapshot(d => {

        window.__driveUrl = this.driveUrl; window.__driveFolders = this.driveFolders; window.__drivePlanFolder = this.drivePlanFolder;

      }, () => {}));
      this.unsubs.push(this.db.collection('laminateStock').doc('main').onSnapshot(d => {

        if (!d.exists && !d.metadata.fromCache && this.isAdmin && !this.laminateInit) {
          this.laminateInit = true;
          this.db.collection('laminateStock').doc('main').set({ remaining: 162, createdAt: Date.now() }).catch(() => {});

      }, this.snapErr('讀取護貝膜庫存發生問題')));
      let lamFirst = true;
      this.unsubs.push(this.db.collection('laminateRequests').onSnapshot(s => {
        if (this.isAdmin && !lamFirst) s.docChanges().forEach(c => { if (c.type === 'added' && !c.doc.metadata.hasPendingWrites) { const d = c.doc.data(); this.notifyAdmin('新的護貝膜申請', `${d.borrower||''}（${d.className||''}）申請 ${d.qty||''} 張，用途：${d.purpose||''}`); } });
        this.laminateRequests = s.docs.map(d => ({ id:d.id, ...d.data() }));
        lamFirst = false;
      }, this.snapErr('讀取護貝膜申請發生問題')));
      if (this.isAdmin) {
        let memFirst = true;
        let wkFirst = true;
        this.unsubs.push(this.db.collection('weeklyLogs').where('status', '==', 'submitted').onSnapshot(s => {
          if (!wkFirst) s.docChanges().forEach(c => { if (c.type === 'added' && !c.doc.metadata.hasPendingWrites) { const x = c.doc.data(); this.notifyAdmin('週誌已送出', `${x.cls || ''}（${x.teachers || x.ownerName || ''}）送出了一份週誌`); } });
          this.submittedWeekly = s.docs.map(d => d.id); wkFirst = false;
        }, this.snapErr('讀取週誌狀態發生問題')));
        this.unsubs.push(this.db.collection('members').onSnapshot(s => {
          if (!memFirst) s.docChanges().forEach(c => { if (c.type === 'added' && !c.doc.metadata.hasPendingWrites && c.doc.data().status === 'pending') this.notifyAdmin('新的帳號申請', `${c.doc.data().name || ''}（${c.doc.id}）申請使用系統，等待核准`); });
          this.members = s.docs.map(d => ({ id: d.id, ...d.data() })); memFirst = false;
        }, this.snapErr('讀取帳號名單發生問題')));
        this.unsubs.push(this.db.collection('deleteLogs').orderBy('createdAt','desc').limit(300).onSnapshot(s => { this.deleteLogs = s.docs.map(d => ({ id:d.id, ...d.data() })); }, this.snapErr('讀取刪除紀錄發生問題')));
        this.unsubs.push(this.db.collection('loginLogs').orderBy('createdAt','desc').limit(300).onSnapshot(s => { this.loginLogsError = ''; this.loginLogs = s.docs.map(d => ({ id:d.id, ...d.data() })); }, (err) => { console.error('讀取登入紀錄失敗', err); this.loginLogsError = (err && err.code) || (err && err.message) || 'unknown'; }));
