  return `<details ${open?"open":""} class="pu-card pu-env"><summary><b>環境規劃建議：${esc(key)}</b></summary>`+(e?e.sec.map(s=>`<p><b>${esc(s[0])}</b></p><ul>${s[1].map(l=>`<li>${esc(l)}</li>`).join("")}</ul>`).join("")+`<p class="pu-m">來源：${esc(e.src)}；書中數字為案例，請依自己教室調整。</p>`:"")+(plan.cls==="兩歲專班"&&two.length?`<p><b>兩歲專班補充</b></p><ul>${two.map(l=>`<li>${esc(l)}</li>`).join("")}</ul><p class="pu-m">此段為目視圖片版所整理，請對照原書。</p>`:"")+`</details>`}
function rEnv(){body(`<div class="pu-card"><b>班級類型</b> <select id="ec">${CLS.map(c=>`<option ${c===plan.cls?"selected":""}>${c}</option>`).join("")}</select></div>`+["語文區","數學區","積木區","組合建構區","美勞區","扮演區","生活自理區"].map(a=>envHtml(a,false)).join(""));$("#ec").onchange=e=>{plan.cls=e.target.value;rEnv()}}
/* tools / ind / list */
function rTools(){body(`<div class="pu-card"><p class="pu-m">資料來自借還系統（即時），剩餘數量會隨借還更新。</p><div class="pu-row"><input id="q" placeholder="搜尋教具" style="flex:1"><select id="g"><option value="">全部分類</option>${[...new Set(inv.map(r=>r[0]))].map(x=>`<option>${esc(x)}</option>`).join("")}</select><label><input type="checkbox" id="ar"> 只看有庫存</label></div><p class="pu-m" id="n"></p><div class="pu-tbl"><table id="t"></table></div></div>`);
  const f=()=>{const q=$("#q").value,g=$("#g").value,a=$("#ar").checked;const L=inv.filter(r=>(!g||r[0]===g)&&(!q||r[1].includes(q))&&(!a||r[3]>0));$("#n").textContent=L.length+" 項";$("#t").innerHTML="<tr><th>分類</th><th>名稱</th><th>總數</th><th>剩餘</th></tr>"+L.slice(0,400).map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${r[2]}</td><td ${r[3]===0?'class="pu-w"':""}>${r[3]}</td></tr>`).join("")};
  ["q","g","ar"].forEach(i=>$("#"+i).oninput=f);f()}
function rInd(){body(`<div class="pu-card"><div class="pu-row"><input id="q" placeholder="搜尋指標或代碼" style="flex:1"><select id="g"><option value="">全部領域</option>${Object.keys(DOM).map(x=>`<option>${x}</option>`).join("")}</select></div><div class="pu-tbl"><table id="t"></table></div><p class="pu-m">指標依「幼兒園教保活動課程大綱」，收錄本計畫引用之指標。</p></div>`);
  const f=()=>{const q=$("#q").value,g=$("#g").value;$("#t").innerHTML="<tr><th>代碼</th><th>指標</th></tr>"+Object.entries(D.ind).filter(([c,t])=>(!g||c[0]===g)&&(!q||(c+t).includes(q))).map(([c,t])=>`<tr><td>${c}</td><td>${esc(t)}</td></tr>`).join("")};$("#q").oninput=f;$("#g").onchange=f;f()}
function rList(){if(!admin()&&viewing){const p=plans.find(x=>x.id===viewing);if(p){body(roHtml(p));$("#bk").onclick=()=>{viewing=null;rList()};return}viewing=null}const err=root.dataset.err;body(`<div class="pu-card">${err?`<p class="pu-w">讀取計畫失敗（${esc(err)}）：請在 Firestore 規則加入 teachingPlans 集合的讀寫權限。</p>`:""}${plans.length?plans.slice().sort((a,b)=>(b.at||"").localeCompare(a.at||"")).map(p=>`<div class="pu-row"><b>${esc(p.name)}</b><span class="pu-m">${esc(p.cls)}｜${esc(p.sem)}｜${(p.areas||[]).length}區｜${esc((p.at||"").slice(0,10))}｜${esc(p.by||"")}</span>${admin()?`<button data-o="${p.id}">開啟編輯</button><button data-c="${p.id}">複製成新學期</button><button data-d="${p.id}">刪除</button>`:`<button data-v="${p.id}">查看</button>`}</div>`).join(""):'<p class="pu-m">尚無儲存的計畫</p>'}</div>`);
  const get=id=>JSON.parse(JSON.stringify(plans.find(p=>p.id===id)));
  $$("[data-v]").forEach(b=>b.onclick=()=>{viewing=b.dataset.v;rList()});$$("[data-o]").forEach(b=>b.onclick=()=>{plan=normPlan(get(b.dataset.o));tab="plan";render()});
  $$("[data-c]").forEach(b=>b.onclick=()=>{plan=normPlan(get(b.dataset.c));plan.id="p"+Date.now();plan.name+="（複製）";plan.sem="";tab="plan";render()});
  $$("[data-d]").forEach(b=>b.onclick=async()=>{if(confirm("確定刪除？"))try{await d.db.collection("teachingPlans").doc(b.dataset.d).delete()}catch(e){alert("刪除失敗："+(e.code||e.message))}})}
return{sync};})();

</script>
<script>
function kgApp() {
  return {
    view: 'teacher', formMode: 'borrow',
    recordFilter: 'all', recordSort: { key: null, dir: 1 }, recordsShowAll: false,
    shareLinkNotice: '', borrowLookupText: '', returnDateLookup: '', browseCategoryFilter: '',
    itemFormOpen: false, categoryFormOpen: false, publisherPanelOpen: false, selectedTeacherName: '',
    lamQ: '', lamFrom: '', lamTo: '', lamStatus: 'all', lamShowAll: false,
    notifPerm: (window.Notification ? Notification.permission : 'unsupported'), baseTitle: '', titleTimer: null, audioCtx: null,
    teacherPick: '', pickForceOpen: false, deleteLogs: [], delLogQ: '', delLogShowAll: false,
    laminateStock: null, laminateRequests: [], laminateInit: false, laminateStockInput: '', laminateError: '',     laminateForm: { borrower:'', className:'', qty:1, purpose:'', requestDate:'', fileNote:'', uploaded:false },
    openGroups: {}, itemSearchText: '', started: false, todayLabel: '', loginLogsError: '',
    toast: '', submitting: false, uploadingPhoto: false,
    currentUser: null, isAdmin: false, authError: '',
    auth: null, db: null, storage: null, unsubs: [],
    idleTimer: null, idleTimeoutMs: 10 * 60 * 1000,
    importing: false, importSummary: '',
    publisherBatchText: '', publisherBatchSummary: '',
    categories: [], items: [], records: [], publishers: [], classes: [], teacherRoster: [], returnRequests: [],
    loginLogs: [], loginSearchText: '', loginLogsShowAll: false,
    loginDbResults: [], loginSearchedKw: '', loginSearching: false, loginSearchError: '',
    newClassName: '', newTeacherRosterName: '',
    borrowForm: { borrower:'', className:'', categoryId:'', selected:{}, borrowDate:'', searchKeyword:'' },
    returnForm: { filterText:'', itemNameFilter:'', selected:{}, returnDate:'' },
    itemForm: { id:null, categoryId:'', name:'', total:1, photo:null, publisherId:'', photoMode:'upload' },
    photoUrlError: false,
    categoryForm: { id:null, name:'', emoji:'📦', bg:'#DDE6D3', text:'#4C7A3E', isBook:false },
    publisherForm: { id:null, name:'' },
    borrowError:'', returnError:'', categoryError:'', publisherError:'',
    emojiChoices: ['📖','🎨','🔤','🔢','🧩','🧱','🍳','🧦','🎵','⚽','🔬','🧵','🌱','🚗','🖍️','🧸','🎲','🎈','🪁','🎭','🧶','🪀','🧮','📚','🐾','🍎','🎪','🎯','🖼️','👟'],
    presetSwatches: [
      { bg:'#DDE6D3', text:'#4C7A3E' },{ bg:'#F3CFC0', text:'#B0553B' },{ bg:'#F3D9A0', text:'#8A5F14' },{ bg:'#D6E2E6', text:'#3E6470' },
      { bg:'#E4D7ED', text:'#6E4E8C' },{ bg:'#EAD9C5', text:'#8B5E3C' },{ bg:'#F6DCC0', text:'#B36B2E' },{ bg:'#F0DCE0', text:'#A15A72' },
      { bg:'#FBE3E3', text:'#A6425C' },{ bg:'#E8E3F5', text:'#5B4B8A' },{ bg:'#FFF0C2', text:'#8A6D1D' },{ bg:'#D9EDE7', text:'#2E7D6B' },
      { bg:'#FDE2CE', text:'#B0632B' },{ bg:'#E0ECF8', text:'#375A85' },{ bg:'#F0E5D8', text:'#7A5B3D' },{ bg:'#E6F0D8', text:'#547A2E' },
      { bg:'#F5D9E6', text:'#9C3F72' },{ bg:'#DCEEF2', text:'#2D6E80' },{ bg:'#F2E1F5', text:'#7A3D8A' },{ bg:'#EFE0CF', text:'#8A5A2E' },
    ],

    async init() {
      if (this.started) return;
      this.started = true;
      const today = this.getTaipeiDateString();
      this.todayLabel = new Date().toLocaleDateString('zh-TW', { year:'numeric', month:'long', day:'numeric', weekday:'short' });
      this.borrowForm.borrowDate = today;
      this.returnForm.returnDate = today;
      this.laminateForm.requestDate = today;
      this.baseTitle = document.title;

      if (!window.firebase) { this.authError = 'Firebase 尚未正確載入，請確認網路連線'; return; }
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      this.auth = firebase.auth();
      // 登入狀態只保存在「這個分頁」：關閉分頁或視窗就立刻登出（重新整理不受影響）
      try { await this.auth.setPersistence(firebase.auth.Auth.Persistence.SESSION); }
      catch (e) { console.error('設定登入保存方式失敗', e); }
      this.db = firebase.firestore();
      this.storage = firebase.storage();
      try { this.storage.setMaxUploadRetryTime(20000); this.storage.setMaxOperationRetryTime(20000); } catch (e) {}

      this.auth.onAuthStateChanged(async (user) => {
        this.unsubs.forEach(fn => fn()); this.unsubs = [];
        this.currentUser = user; this.isAdmin = false;
        this.openGroups = {}; this.itemSearchText = ''; // 每次登入／登出都重置，讓各學習區預設為收合
        this.clearIdleTimer();
        if (user) {
          try {
            const adminDoc = await this.db.collection('config').doc('admins').get();
            const emails = adminDoc.exists ? (adminDoc.data().emails || []) : [];
            const mail = (user.email || '').trim().toLowerCase();
            this.isAdmin = !!mail && emails.some(m => String(m).trim().toLowerCase() === mail);
          } catch (e) {
            this.isAdmin = false;
            console.error('讀取管理員名單失敗', e);
            this.showToast(`無法確認管理員身分（${e.code || e.message}），請檢查 Firestore 規則`, 6000);
          }
          this.view = 'teacher';
          try {
            if (this.isAdmin && window.Notification && Notification.permission === 'default') {
              const r = Notification.requestPermission();
              if (r && r.catch) r.catch(() => {});
            }
          } catch (e) {}
          this.logLoginEvent(user);
          this.subscribeAll();
          this.resetIdleTimer();
        }
      });

      const idleEvents = ['mousemove','mousedown','keydown','touchstart','scroll','click'];
      idleEvents.forEach(evt => window.addEventListener(evt, () => this.resetIdleTimer(), { passive: true }));
      document.addEventListener('visibilitychange', () => { if (!document.hidden) { this.resetIdleTimer(); this.stopTitleFlash(); } });
      window.addEventListener('focus', () => this.stopTitleFlash());
    },

    resetIdleTimer() {
      if (!this.currentUser) return;
      clearTimeout(this.idleTimer);
      this.idleTimer = setTimeout(() => this.handleIdleLogout(), this.idleTimeoutMs);
    },
    clearIdleTimer() { clearTimeout(this.idleTimer); this.idleTimer = null; },
    async handleIdleLogout() {
      if (!this.currentUser) return;
      await this.signOutUser();
      this.authError = '因閒置超過 10 分鐘，已自動登出，請重新登入。';
    },

    async signIn() {
      this.authError = '';
      try { await this.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
      catch (e) {
        console.error('登入失敗', e);
        const map = {
          'auth/popup-closed-by-user': '登入視窗被關閉，請再試一次',
          'auth/cancelled-popup-request': '',
          'auth/popup-blocked': '瀏覽器擋住了登入視窗，請允許此網站的彈出視窗後再試一次',
          'auth/unauthorized-domain': '此網址尚未加入 Firebase 的「授權網域」，請到 Firebase Authentication → 設定 → 授權網域 新增',
          'auth/network-request-failed': '網路連線異常，請檢查網路後再試一次',
        };
        this.authError = (e.code in map) ? map[e.code] : `登入失敗（${e.code || e.message}），請再試一次`;
      }
    },
    async signOutUser() { this.clearIdleTimer(); await this.auth.signOut(); },

    async logLoginEvent(user) {
      if (!user) return;
      const flagKey = `loginLogged_${user.uid}`;
      if (sessionStorage.getItem(flagKey)) return;
      try {
        await this.db.collection('loginLogs').add({
          uid: user.uid,
          email: user.email || '',
          displayName: user.displayName || '',
          timestamp: this.getTaipeiTimestamp(),
          createdAt: Date.now(),
        });
        sessionStorage.setItem(flagKey, '1');
      } catch (e) {}
    },

    subscribeAll() {
      this.unsubs.push(this.db.collection('categories').orderBy('createdAt','asc').onSnapshot(s => { this.categories = s.docs.map(d => ({ id:d.id, ...d.data() })); }, this.snapErr('讀取類別發生問題')));
      this.unsubs.push(this.db.collection('items').orderBy('createdAt','asc').onSnapshot(s => { this.items = s.docs.map(d => ({ id:d.id, ...d.data() })); }, this.snapErr('讀取項目發生問題')));
      let recFirst = true;
      this.unsubs.push(this.db.collection('records').onSnapshot(s => {
        if (this.isAdmin && !recFirst) {
          const added = s.docChanges().filter(c => c.type === 'added' && !c.doc.metadata.hasPendingWrites).map(c => c.doc.data());
          if (added.length) {
            const f = added[0];
            this.notifyAdmin('新的借用登記', added.length === 1
              ? `${f.borrower||''}（${f.className||''}）借用 ${f.itemName||''} × ${f.qty||''}`
              : `${f.borrower||''}（${f.className||''}）一次借用 ${added.length} 項`);
          }
        }
        this.records = s.docs.map(d => ({ id:d.id, ...d.data() }));
        recFirst = false;
      }, this.snapErr('讀取借還紀錄發生問題')));
      let returnReqFirstLoad = true;
      this.unsubs.push(this.db.collection('returnRequests').onSnapshot(s => {
        if (this.isAdmin && !returnReqFirstLoad) {
          s.docChanges().forEach(change => {
            if (change.type === 'added' && !change.doc.metadata.hasPendingWrites) {
              this.notifyNewReturnRequest({ id: change.doc.id, ...change.doc.data() });
            }
          });
        }
        this.returnRequests = s.docs.map(d => ({ id:d.id, ...d.data() }));
        returnReqFirstLoad = false;
      }, this.snapErr('讀取歸還申請發生問題')));
      this.unsubs.push(this.db.collection('publishers').orderBy('createdAt','asc').onSnapshot(s => { this.publishers = s.docs.map(d => ({ id:d.id, ...d.data() })); }, this.snapErr('讀取出版社發生問題')));
      this.unsubs.push(this.db.collection('roster').doc('classes').onSnapshot(d => { this.classes = d.exists ? (d.data().list||[]) : []; }, () => {}));
      this.unsubs.push(this.db.collection('roster').doc('teachers').onSnapshot(d => { this.teacherRoster = d.exists ? (d.data().list||[]) : []; }, () => {}));
      this.unsubs.push(this.db.collection('laminateStock').doc('main').onSnapshot(d => {
        this.laminateStock = d.exists ? d.data() : null;
        if (!d.exists && !d.metadata.fromCache && this.isAdmin && !this.laminateInit) {
          this.laminateInit = true;
          this.db.collection('laminateStock').doc('main').set({ remaining: 162, createdAt: Date.now() }).catch(() => {});
        }
      }, this.snapErr('讀取護貝膜庫存發生問題')));
      let lamFirst = true;
      this.unsubs.push(this.db.collection('laminateRequests').onSnapshot(s => {
        if (this.isAdmin && !lamFirst) s.docChanges().forEach(c => { if (c.type === 'added' && !c.doc.metadata.hasPendingWrites) { const d = c.doc.data(); this.notifyAdmin('新的護貝膜申請', `${d.borrower||''}（${d.className||''}）申請 ${d.qty||''} 張，用途：${d.purpose||''}`); } });
        this.laminateRequests = s.docs.map(d => ({ id:d.id, ...d.data() }));
        lamFirst = false;
      }, this.snapErr('讀取護貝膜申請發生問題')));
      if (this.isAdmin) {
        this.unsubs.push(this.db.collection('deleteLogs').orderBy('createdAt','desc').limit(300).onSnapshot(s => { this.deleteLogs = s.docs.map(d => ({ id:d.id, ...d.data() })); }, this.snapErr('讀取刪除紀錄發生問題')));
        this.unsubs.push(this.db.collection('loginLogs').orderBy('createdAt','desc').limit(300).onSnapshot(s => { this.loginLogsError = ''; this.loginLogs = s.docs.map(d => ({ id:d.id, ...d.data() })); }, (err) => { console.error('讀取登入紀錄失敗', err); this.loginLogsError = (err && err.code) || (err && err.message) || 'unknown'; }));
      }
    },

    addDays(dateStr, n) { const d = new Date(dateStr); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); },
    getTaipeiDateString(date = new Date()) { return new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Taipei', year:'numeric', month:'2-digit', day:'2-digit' }).format(date); },
    getTaipeiTimeString(date = new Date()) { return new Intl.DateTimeFormat('zh-TW', { timeZone:'Asia/Taipei', hour:'2-digit', minute:'2-digit', hour12:false }).format(date); },
    getTaipeiTimestamp(date = new Date()) { return `${this.getTaipeiDateString(date)} ${this.getTaipeiTimeString(date)}（中原標準時間）`; },
    timeOnly(ts) { if (!ts) return ''; const m = String(ts).match(/\d{2}:\d{2}/); return m ? m[0] : ''; },

    getCategory(id) { return this.categories.find(c => c.id === id) || { id:null, name:'未分類', emoji:'📦', bg:'#E7E0D2', text:'#6B4527' }; },
    categoryStyle(id) { const c = this.getCategory(id); return `background:${c.bg};color:${c.text}`; },
    categoryEmojiOf(id) { return this.getCategory(id).emoji; },
    categoryNameOf(id) { return this.getCategory(id).name; },
    getCategoryByName(name) { return this.categories.find(c => c.name === name) || { name: name || '未分類', emoji:'📦', bg:'#E7E0D2', text:'#6B4527' }; },
    categoryStyleByName(name) { const c = this.getCategoryByName(name); return `background:${c.bg};color:${c.text}`; },
    categoryEmojiByName(name) { return this.getCategoryByName(name).emoji; },
    isBookCategory(id) { const c = this.categories.find(c => c.id === id); return !!(c && (c.isBook || c.name === '繪本書籍')); },
    showPublisherBtn(cat) { return cat.name === '繪本書籍' || (!this.categories.some(c => c.name === '繪本書籍') && !!cat.isBook); },
    publisherNameOf(id) { if (!id) return ''; const p = this.publishers.find(p => p.id === id); return p ? p.name : ''; },
    photoOf(it) { return it && it.photo ? it.photo : null; },
    getItemById(id) { return this.items.find(i => i.id === id); },
    getRecord(id) { return this.records.find(r => r.id === id); },

    async handlePhotoUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) { this.showToast('請上傳圖片檔案'); return; }
      this.uploadingPhoto = true;
      try {
        const path = 'item-photos/' + Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
        const ref = this.storage.ref(path);
        await ref.put(file);
        this.itemForm.photo = await ref.getDownloadURL();
      } catch (err) { this.showToast('照片上傳失敗，請確認 Firebase Storage 是否已啟用'); }
      this.uploadingPhoto = false;
    },

    get filteredBrowseItems() { return this.browseCategoryFilter ? this.items.filter(i => i.categoryId === this.browseCategoryFilter) : []; },
    get borrowCategoryItems() { return this.items.filter(i => i.categoryId === this.borrowForm.categoryId); },
    get searchResultItems() {
      const kw = this.borrowForm.searchKeyword.trim().toLowerCase();
      if (!kw) return [];
      const matchingPublisherIds = this.publishers.filter(p => p.name.toLowerCase().includes(kw)).map(p => p.id);
      return this.items.filter(i => i.name.toLowerCase().includes(kw) || (i.publisherId && matchingPublisherIds.includes(i.publisherId)));
    },
    isBorrowItemSelected(id) { return Object.prototype.hasOwnProperty.call(this.borrowForm.selected, id); },
    toggleBorrowItem(it) {
      if (it.remaining <= 0) { this.showToast('此項目目前無庫存'); return; }
      if (this.isBorrowItemSelected(it.id)) delete this.borrowForm.selected[it.id];
      else this.borrowForm.selected[it.id] = 1;
    },
    removeBorrowSelection(id) { delete this.borrowForm.selected[id]; },
    get selectedBorrowEntries() {
      return Object.keys(this.borrowForm.selected).map(id => this.items.find(i => i.id === id)).filter(Boolean)
        .map(it => ({ it, qty: this.borrowForm.selected[it.id] }));
    },
    currentBorrowersOf(itemId) {
      const names = this.openRecords.filter(r => r.itemId === itemId).map(r => `${r.borrower}（${r.className}）`);
      return [...new Set(names)].join('、') || '不明';
    },
    get teacherSuggestions() { return [...new Set([...this.teacherRoster, ...this.records.map(r => r.borrower)])]; },
    outstanding(r) { return r ? r.qty - r.returnedQty : 0; },
    statusOf(r) { return r.returnedQty >= r.qty ? 'returned' : 'borrowing'; },
    statusLabel(s) { return s === 'returned' ? '已歸還' : '借用中'; },
    get openRecords() { return this.records.filter(r => this.statusOf(r) !== 'returned'); },
    get filteredRecords() {
      let list = [...this.records];
      if (this.recordFilter !== 'all') list = list.filter(r => this.statusOf(r) === this.recordFilter);
      if (this.recordSort.key) {
        const dir = this.recordSort.dir, key = this.recordSort.key;
        list.sort((a,b) => {
          if (key === 'qty') return ((a.qty-a.returnedQty)-(b.qty-b.returnedQty))*dir;
          let av, bv;
          switch (key) {
            case 'borrower': av = `${a.borrower}${a.className}`; bv = `${b.borrower}${b.className}`; break;
            case 'itemName': av = a.itemName; bv = b.itemName; break;
            case 'borrowDate': av = a.borrowDate||''; bv = b.borrowDate||''; break;
            case 'returnDate': av = a.returnDate||''; bv = b.returnDate||''; break;
            case 'status': av = this.statusLabel(this.statusOf(a)); bv = this.statusLabel(this.statusOf(b)); break;
            default: av=''; bv='';
          }
          return this.compareStrokes(av, bv) * dir;
        });
      } else { list.sort((a,b) => b.borrowDate.localeCompare(a.borrowDate)); }
      return list;
    },
    get visibleRecords() { return this.recordsShowAll ? this.filteredRecords : this.filteredRecords.slice(0, 10); },
    get similarItemMatches() {
      const name = (this.itemForm.name || '').trim();
      if (name.length < 3) return [];
      return this.items.filter(it => it.id !== this.itemForm.id && this.shareSubstring(name, it.name, 3));
    },
    shareSubstring(a, b, len) {
      if (!a || !b || a.length < len || b.length < len) return false;
      for (let i = 0; i <= a.length - len; i++) {
        if (b.includes(a.slice(i, i + len))) return true;
      }
      return false;
    },
    get filteredLoginLogs() {
      const kw = this.loginSearchText.trim().toLowerCase();
      if (!kw) return this.loginLogs;
      const map = new Map();
      this.loginLogs.filter(l => (l.displayName||'').toLowerCase().includes(kw) || (l.email||'').toLowerCase().includes(kw))
        .forEach(l => map.set(l.id, l));
      if (this.loginSearchedKw.toLowerCase() === kw) this.loginDbResults.forEach(l => map.set(l.id, l));
      return [...map.values()].sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
    },
    async searchLoginLogs() {
      const kw = this.loginSearchText.trim();
      this.loginLogsShowAll = false;
      if (!kw) { this.loginDbResults = []; this.loginSearchedKw = ''; this.loginSearchError = ''; return; }
      if (!this.isAdmin || !this.db) return;
      this.loginSearching = true; this.loginSearchError = '';
      try {
        const col = this.db.collection('loginLogs');
        const prefix = (field, v) => col.where(field, '>=', v).where(field, '<=', v + '\uf8ff').limit(500).get();
        const variants = [...new Set([kw, kw.toLowerCase(), kw.charAt(0).toUpperCase() + kw.slice(1).toLowerCase()])];
        const snaps = await Promise.all(variants.flatMap(v => [prefix('email', v), prefix('displayName', v)]));
        const map = new Map();
        snaps.forEach(sn => sn.docs.forEach(d => map.set(d.id, { id: d.id, ...d.data() })));
        if (kw !== this.loginSearchText.trim()) { this.loginSearching = false; return; } // 輸入已變更，丟棄過時結果
        this.loginDbResults = [...map.values()].sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
        this.loginSearchedKw = kw;
      } catch (e) {
        console.error('查詢登入紀錄失敗', e);
        this.loginSearchError = e.code || e.message || 'unknown';
      }
      this.loginSearching = false;
    },
    get visibleLoginLogs() { return this.loginLogsShowAll ? this.filteredLoginLogs : this.filteredLoginLogs.slice(0, 3); },
    compareStrokes(a,b) { try { return String(a).localeCompare(String(b),'zh-Hant-u-co-stroke'); } catch(e) { return String(a).localeCompare(String(b),'zh-Hant'); } },
    sortRecords(key) { if (this.recordSort.key===key) this.recordSort.dir*=-1; else { this.recordSort.key=key; this.recordSort.dir=1; } },
    sortArrow(key) { if (this.recordSort.key!==key) return '↕'; return this.recordSort.dir===1 ? '▲':'▼'; },
    isWithinOneYear(dateStr) { if (!dateStr) return false; const today = this.getTaipeiDateString(); const oneYearAgo = this.addDays(today,-365); return dateStr>=oneYearAgo && dateStr<=today; },
    get selectedTeacherUnreturned() { if (!this.selectedTeacherName) return []; return this.records.filter(r=>r.borrower===this.selectedTeacherName && this.statusOf(r)!=='returned' && this.isWithinOneYear(r.borrowDate)).sort((a,b)=>b.borrowDate.localeCompare(a.borrowDate)); },
    get selectedTeacherReturned() { if (!this.selectedTeacherName) return []; return this.records.filter(r=>r.borrower===this.selectedTeacherName && this.statusOf(r)==='returned' && this.isWithinOneYear(r.returnDate)).sort((a,b)=>(b.returnDate||'').localeCompare(a.returnDate||'')); },
    pendingReturnQtyOf(recordId) { return this.returnRequests.filter(rq => rq.recordId === recordId && rq.status === 'pending').reduce((s,rq) => s + rq.qty, 0); },
    availableToReturn(r) { return r ? this.outstanding(r) - this.pendingReturnQtyOf(r.id) : 0; },
    get teacherUnreturnedRecords() { const text = this.returnForm.filterText.trim(); if (!text) return []; return this.openRecords.filter(r => (r.borrower===text || r.className===text) && this.availableToReturn(r) > 0); },
    get teacherItemNameOptions() { return [...new Set(this.teacherUnreturnedRecords.map(r => r.itemName))]; },
    get matchingOpenRecords() {
      const text = this.returnForm.filterText.trim(); if (!text) return [];
      const kw = this.returnForm.itemNameFilter.trim();
      return this.teacherUnreturnedRecords.filter(r => !kw || r.itemName.includes(kw));
    },
    get borrowLookupMatches() { const text = this.borrowLookupText.trim(); if (!text) return []; return this.openRecords.filter(r=>r.borrower.includes(text)||r.className.includes(text)); },
    get returnDateLookupMatches() { if (!this.returnDateLookup) return []; return this.records.filter(r=>r.returnDate===this.returnDateLookup).sort((a,b)=>(a.returnTimestamp||'').localeCompare(b.returnTimestamp||'')); },
    get pendingReturnRequests() { return this.returnRequests.filter(rq => rq.status==='pending').sort((a,b)=>(a.requestTimestamp||'').localeCompare(b.requestTimestamp||'')); },
    isReturnSelected(id) { return Object.prototype.hasOwnProperty.call(this.returnForm.selected, id); },
    toggleReturnRecord(r) { if (this.isReturnSelected(r.id)) delete this.returnForm.selected[r.id]; else this.returnForm.selected[r.id] = this.availableToReturn(r); },

    async submitBorrow() {
      this.borrowError = '';
      if (!this.borrowForm.borrower.trim()) { this.borrowError = '請輸入老師姓名'; return; }
      if (!this.borrowForm.className) { this.borrowError = '請選擇班級'; return; }
      const entries = Object.entries(this.borrowForm.selected);
      if (entries.length === 0) { this.borrowError = '請至少選擇一項要借用的品項'; return; }
      for (const [itemId, qty] of entries) {
        const it = this.items.find(i => i.id === itemId);
        const q = Number(qty);
        if (!it) { this.borrowError = '選擇的項目不存在'; return; }
        if (!q || q < 1) { this.borrowError = `「${it.name}」的借用數量需大於 0`; return; }
        if (q > it.remaining) { this.borrowError = `「${it.name}」目前僅剩 ${it.remaining} 件，無法借出 ${q} 件`; return; }
      }
      this.submitting = true;
      try {
        const summary = [];
        for (const [itemId, qty] of entries) {
          const it = this.items.find(i => i.id === itemId);
          const q = Number(qty);
          await this.db.collection('items').doc(it.id).update({ remaining: Math.max(0, it.remaining - q) });
          await this.db.collection('records').add({
            itemId: it.id, itemName: it.name, category: this.categoryNameOf(it.categoryId),
            borrower: this.borrowForm.borrower.trim(), className: this.borrowForm.className,
            qty: q, returnedQty: 0, borrowDate: this.borrowForm.borrowDate, returnDate: null,
            borrowTimestamp: this.getTaipeiTimestamp(), createdAt: Date.now(),
          });
          summary.push(`${it.name}×${q}`);
        }
        this.showToast(`已登記借出：${summary.join('、')}`);
        this.notifyLine(`📚 新的借用登記\n${this.borrowForm.borrower.trim()}（${this.borrowForm.className}）\n借用：${summary.join('、')}\n借用日：${this.borrowForm.borrowDate}`);
        this.borrowForm.borrower=''; this.teacherPick=''; this.borrowForm.className=''; this.borrowForm.categoryId='';
        this.borrowForm.selected={}; this.borrowForm.searchKeyword='';
      } catch (e) { this.borrowError = '借用登記失敗，請再試一次'; }
      this.submitting = false;
    },

    async submitReturn() {
      this.returnError = '';
      const entries = Object.entries(this.returnForm.selected);
      if (entries.length === 0) { this.returnError = '請至少選擇一項要歸還的項目'; return; }
      for (const [recordId, qty] of entries) {
        const r = this.getRecord(recordId); const q = Number(qty);
        if (!r) { this.returnError = '選擇的紀錄不存在'; return; }
        const remain = this.availableToReturn(r);
        if (!q || q < 1) { this.returnError = `「${r.itemName}」歸還數量需大於 0`; return; }
        if (q > remain) { this.returnError = `「${r.itemName}」僅剩 ${remain} 件可申請歸還（其餘可能已送出待確認）`; return; }
      }
      this.submitting = true;
      try {
        const summary = [];
        for (const [recordId, qty] of entries) {
          const r = this.getRecord(recordId); const q = Number(qty);
          await this.db.collection('returnRequests').add({
            recordId: r.id, itemId: r.itemId, itemName: r.itemName, category: r.category,
            borrower: r.borrower, className: r.className, qty: q,
            requestDate: this.returnForm.returnDate, requestTimestamp: this.getTaipeiTimestamp(),
            status: 'pending', createdAt: Date.now(),
          });
          summary.push(`${r.itemName}×${q}`);
        }
        this.showToast(`已送出歸還申請：${summary.join('、')}，請等待管理員清點確認`);
        { const r0 = this.getRecord(entries[0][0]) || {}; this.notifyLine(`📥 新的歸還申請（待確認）\n${r0.borrower||''}（${r0.className||''}）\n歸還：${summary.join('、')}\n請至管理者後台清點確認`); }
        this.returnForm.selected={}; this.returnForm.filterText=''; this.returnForm.itemNameFilter='';
      } catch (e) { this.returnError = '歸還申請送出失敗，請再試一次'; }
      this.submitting = false;
    },

    async confirmReturnRequest(req) {
      const r = this.getRecord(req.recordId);
      if (!r) { this.showToast('對應的借用紀錄已不存在'); return; }
      try {
        const newReturnedQty = r.returnedQty + req.qty;
        await this.db.collection('records').doc(r.id).update({
          returnedQty: newReturnedQty,
          returnDate: newReturnedQty >= r.qty ? req.requestDate : (r.returnDate || null),
          returnTimestamp: this.getTaipeiTimestamp(),
        });
        const it = this.items.find(i => i.id === req.itemId);
        if (it) await this.db.collection('items').doc(it.id).update({ remaining: it.remaining + req.qty });
        await this.db.collection('returnRequests').doc(req.id).update({ status: 'confirmed', confirmedTimestamp: this.getTaipeiTimestamp() });
        this.showToast(`已清點確認歸還：${req.itemName}×${req.qty}`);
      } catch (e) { this.showToast('確認歸還失敗，請再試一次'); }
    },
    async rejectReturnRequest(req) {
      if (!confirm(`確定要取消「${req.borrower}（${req.className}）－${req.itemName}×${req.qty}」這筆歸還申請嗎？取消後老師需要重新申請歸還。`)) return;
      try {
        await this.db.collection('returnRequests').doc(req.id).delete();
        this.showToast('已取消該筆歸還申請');
      } catch (e) { this.showToast('取消失敗，請再試一次'); }
    },

    whoAmI() { const u = this.currentUser || {}; return u.displayName ? `${u.displayName}（${u.email || ''}）` : (u.email || '未知管理員'); },
    async logDelete(type, summary, extra = {}) {
      try { await this.db.collection('deleteLogs').add({ type, summary, ...extra, deletedBy: this.whoAmI(), deletedAt: this.getTaipeiTimestamp(), createdAt: Date.now() }); }
      catch (e) { console.error('寫入刪除紀錄失敗', e); this.showToast('已刪除，但刪除紀錄未能寫入，請檢查 Firestore 規則', 5000); }
    },
    async deleteLaminateRecord(r) {
      const back = r.status === 'confirmed';
      if (!confirm(`確定要刪除「${r.borrower}」的護貝膜申請（${r.qty} 張）嗎？${back ? `\n此申請已確認，刪除後會把 ${r.qty} 張加回剩餘張數。` : ''}`)) return;
      const stockRef = this.db.collection('laminateStock').doc('main'), reqRef = this.db.collection('laminateRequests').doc(r.id);
      try {
        await this.db.runTransaction(async tx => {
          const rq = await tx.get(reqRef); if (!rq.exists) return;
          if (rq.data().status === 'confirmed') { const st = await tx.get(stockRef); tx.update(stockRef, { remaining: Number(st.data().remaining || 0) + Number(rq.data().qty || 0) }); }
          tx.delete(reqRef);
        });
        const snap = JSON.parse(JSON.stringify(r)); delete snap.id;
        await this.logDelete('護貝膜申請', `${r.borrower}（${r.className}）${r.qty} 張，用途：${r.purpose}，申請日 ${r.requestDate}${back ? `，已加回庫存 ${r.qty} 張` : ''}`,
          { kind: 'laminate', teacher: r.borrower, targetId: r.id, snapshot: snap, stockBack: back ? Number(r.qty || 0) : 0 });
        this.showToast('已刪除該筆申請，張數已重新計算');
      } catch (e) { console.error(e); this.showToast(`刪除失敗（${e.code || e.message}）`); }
    },
    async deleteRecord(r) {
      if (!confirm(`確定要刪除「${r.borrower}－${r.itemName}」這筆借還紀錄嗎？數量會重新計算，並可在最下方「刪除紀錄」還原。`)) return;
      try {
        const snap = JSON.parse(JSON.stringify(r)); delete snap.id;
        let stockBack = 0;
        if (this.statusOf(r) !== 'returned') {
          const it = this.items.find(i => i.id === r.itemId);
          if (it) { stockBack = this.outstanding(r); await this.db.collection('items').doc(it.id).update({ remaining: firebase.firestore.FieldValue.increment(stockBack) }); }
        }
        const rq = await this.db.collection('returnRequests').where('recordId', '==', r.id).get();
        const returnReqs = rq.docs.map(d => ({ id: d.id, data: d.data() }));
        for (const d of rq.docs) await d.ref.delete();
        await this.db.collection('records').doc(r.id).delete();
        await this.logDelete('借還紀錄', `${r.borrower}（${r.className}）－${r.itemName} ×${r.qty}，借用日 ${r.borrowDate}${stockBack ? `，已回補庫存 ${stockBack}` : ''}`,
          { kind: 'record', teacher: r.borrower, targetId: r.id, snapshot: snap, returnReqs, stockBack });
        this.showToast('已刪除該筆紀錄，數量已重新計算');
      } catch (e) { console.error(e); this.showToast(`刪除失敗（${e.code || e.message}）`); }
    },

    get filteredDeleteLogs() {
      const kw = this.delLogQ.trim().toLowerCase();
      if (!kw) return this.deleteLogs;
      return this.deleteLogs.filter(l => [l.teacher, l.summary, l.deletedBy].some(v => (v || '').toLowerCase().includes(kw)));
    },
    get visibleDeleteLogs() { return this.delLogShowAll ? this.filteredDeleteLogs : this.filteredDeleteLogs.slice(0, 3); },
    async restoreDeleted(l) {
      if (!l.snapshot || l.restored) return;
      if (!confirm(`確定要還原這筆${l.type}嗎？\n${l.summary}`)) return;
      try {
        if (l.kind === 'record') {
          const ref = this.db.collection('records').doc(l.targetId);
          if (!(await ref.get()).exists) {
            const item = this.items.find(i => i.id === l.snapshot.itemId), back = Number(l.stockBack || 0);
            if (back > 0 && item && item.remaining < back) { this.showToast('該項目目前剩餘數量不足，無法還原（可能已被借走）', 5000); return; }
            await ref.set(l.snapshot);
            if (back > 0 && item) await this.db.collection('items').doc(item.id).update({ remaining: firebase.firestore.FieldValue.increment(-back) });
            for (const q of (l.returnReqs || [])) await this.db.collection('returnRequests').doc(q.id).set(q.data);
          }
        } else if (l.kind === 'laminate') {
          const stockRef = this.db.collection('laminateStock').doc('main'), reqRef = this.db.collection('laminateRequests').doc(l.targetId);
          await this.db.runTransaction(async tx => {
            if ((await tx.get(reqRef)).exists) return;
            if (l.snapshot.status === 'confirmed') {
              const st = await tx.get(stockRef), remain = st.exists ? Number(st.data().remaining || 0) : 0, q = Number(l.snapshot.qty || 0);
              if (remain < q) throw new Error('stock');
              tx.update(stockRef, { remaining: remain - q });
            }
            tx.set(reqRef, l.snapshot);
          });
        }
        await this.db.collection('deleteLogs').doc(l.id).update({ restored: true, restoredBy: this.whoAmI(), restoredAt: this.getTaipeiTimestamp() });
        this.showToast('已還原，數量已重新計算');
      } catch (e) { console.error(e); this.showToast(e.message === 'stock' ? '護貝膜剩餘張數不足，無法還原此筆已確認的申請' : `還原失敗（${e.code || e.message}）`, 5000); }
    },

    exportInventoryCSV() {
      const rows = [['分類','名稱','出版社','總數量','目前剩餘','借出中數量']];
      const sorted = [...this.items].sort((a,b) => {
        const ca = this.categoryNameOf(a.categoryId), cb = this.categoryNameOf(b.categoryId);
        return ca === cb ? a.name.localeCompare(b.name,'zh-Hant') : ca.localeCompare(cb,'zh-Hant');
      });
      sorted.forEach(it => {
        const pub = this.isBookCategory(it.categoryId) ? (this.publisherNameOf(it.publisherId) || '') : '';
        rows.push([this.categoryNameOf(it.categoryId), it.name, pub, it.total, it.remaining, it.total - it.remaining]);
      });
      rows.push([]);
      rows.push(['總品項數', this.items.length]);
      rows.push(['總冊數／件數', this.items.reduce((s,it)=>s+it.total,0)]);
      rows.push(['目前借出中總數', this.items.reduce((s,it)=>s+(it.total-it.remaining),0)]);
      rows.push(['匯出時間', this.getTaipeiTimestamp()]);

      const csv = rows.map(r => r.map(v => {
        const s = String(v ?? '');
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
      }).join(',')).join('\r\n');

      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `教具財產清冊_${this.getTaipeiDateString()}.csv`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      this.showToast('已下載財產清冊 CSV');
    },

    shareSystemLink() {
      const url = window.location.href;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(() => { this.shareLinkNotice = '已複製連結，可直接貼上分享給借用者'; setTimeout(()=>{this.shareLinkNotice='';},2000); })
          .catch(() => { this.shareLinkNotice = `複製失敗，請手動複製：${url}`; setTimeout(()=>{this.shareLinkNotice='';},2000); });
      } else { this.shareLinkNotice = `請手動複製連結：${url}`; setTimeout(()=>{this.shareLinkNotice='';},2000); }
    },

    resetCategoryForm() { this.categoryError=''; this.categoryForm = { id:null, name:'', emoji:'📦', bg:'#DDE6D3', text:'#4C7A3E', isBook:false }; },
    editCategory(cat) { this.categoryFormOpen=true; this.categoryForm = { id:cat.id, name:cat.name, emoji:cat.emoji, bg:cat.bg, text:cat.text, isBook: !!cat.isBook }; },
    async saveCategory() {
      this.categoryError = '';
      const name = this.categoryForm.name.trim();
      if (!name) { this.categoryError = '請輸入類別名稱'; return; }
      if (this.categories.find(c => c.name===name && c.id!==this.categoryForm.id)) { this.categoryError = '此類別名稱已存在'; return; }
      this.submitting = true;
      try {
        const data = { name, emoji: this.categoryForm.emoji||'📦', bg: this.categoryForm.bg, text: this.categoryForm.text, isBook: !!this.categoryForm.isBook };
        if (this.categoryForm.id) { await this.db.collection('categories').doc(this.categoryForm.id).update(data); this.showToast(`已更新類別：${name}`); }
        else { await this.db.collection('categories').add({ ...data, createdAt: Date.now() }); this.showToast(`已新增類別：${name}`); }
        this.categoryFormOpen = false; this.resetCategoryForm();
      } catch (e) { this.categoryError = '儲存失敗，請再試一次'; }
      this.submitting = false;
    },
    async deleteCategory(cat) {
      const count = this.items.filter(i => i.categoryId === cat.id).length;
      const msg = count>0 ? `「${cat.name}」目前有 ${count} 個項目使用此類別，刪除後這些項目會顯示為未分類樣式。確定要刪除嗎？` : `確定要刪除類別「${cat.name}」嗎？`;
      if (!confirm(msg)) return;
      try { await this.db.collection('categories').doc(cat.id).delete(); this.showToast(`已刪除類別：${cat.name}`); }
      catch (e) { this.showToast('刪除失敗，請再試一次'); }
    },

    resetPublisherForm() { this.publisherError=''; this.publisherForm = { id:null, name:'' }; },
    editPublisher(p) { this.publisherForm = { id:p.id, name:p.name }; },
    async savePublisher() {
      this.publisherError = '';
      const name = this.publisherForm.name.trim();
      if (!name) { this.publisherError = '請輸入出版社名稱'; return; }
      if (this.publishers.find(p => p.name===name && p.id!==this.publisherForm.id)) { this.publisherError = '此出版社已存在'; return; }
      this.submitting = true;
      try {
        if (this.publisherForm.id) { await this.db.collection('publishers').doc(this.publisherForm.id).update({ name }); this.showToast(`已更新出版社：${name}`); }
        else { await this.db.collection('publishers').add({ name, createdAt: Date.now() }); this.showToast(`已新增出版社：${name}`); }
        this.resetPublisherForm();
      } catch (e) { this.publisherError = '儲存失敗，請再試一次'; }
      this.submitting = false;
    },
    async batchAddPublishers() {
      const names = [...new Set(
        this.publisherBatchText.split(/[\n,、]/).map(s => s.trim()).filter(Boolean)
      )];
      if (!names.length) { this.showToast('請先貼上至少一個出版社名稱'); return; }
      this.submitting = true;
      let added = 0, skipped = 0;
      try {
        for (const name of names) {
          if (this.publishers.find(p => p.name === name)) { skipped++; continue; }
          await this.db.collection('publishers').add({ name, createdAt: Date.now() });
          this.publishers.push({ id: 'temp-' + name, name }); // 本地暫時避免同批次重複送出，實際清單會由即時同步覆蓋
          added++;
        }
        this.publisherBatchSummary = `已新增 ${added} 家，略過 ${skipped} 家（已存在）`;
        this.publisherBatchText = '';
        this.showToast(`批次新增完成：新增 ${added} 家出版社`);
      } catch (e) { this.showToast('批次新增過程中發生錯誤，請檢查後再試一次'); }
      this.submitting = false;
    },
    async deletePublisher(p) {
      const count = this.items.filter(i => i.publisherId === p.id).length;
      const msg = count>0 ? `「${p.name}」目前有 ${count} 本書使用此出版社，刪除後將顯示為未指定出版社。確定要刪除嗎？` : `確定要刪除出版社「${p.name}」嗎？`;
      if (!confirm(msg)) return;
      try {
        await this.db.collection('publishers').doc(p.id).delete();
        const affected = this.items.filter(i => i.publisherId === p.id);
        for (const it of affected) { await this.db.collection('items').doc(it.id).update({ publisherId: null }); }
        this.showToast(`已刪除出版社：${p.name}`);
      } catch (e) { this.showToast('刪除失敗，請再試一次'); }
    },

    groupKey(group) { return group.id || 'uncategorized'; },
    isGroupOpen(group) { return !!this.itemSearchText.trim() || !!this.openGroups[this.groupKey(group)]; },
    get filteredItemGroups() {
      const kw = this.itemSearchText.trim().toLowerCase();
      if (!kw) return this.itemsByCategory;
      return this.itemsByCategory
        .map(g => ({ ...g, list: g.list.filter(it =>
          (it.name || '').toLowerCase().includes(kw) ||
          (this.publisherNameOf(it.publisherId) || '').toLowerCase().includes(kw)) }))
        .filter(g => g.list.length > 0);
    },
    toggleGroup(group) { const k = this.groupKey(group); this.openGroups[k] = !this.openGroups[k]; },
    setAllGroups(open) { const next = {}; this.itemsByCategory.forEach(g => { next[this.groupKey(g)] = open; }); this.openGroups = next; },

    get itemsByCategory() {
      const groups = this.categories.map(cat => ({ ...cat, list: this.items.filter(i => i.categoryId === cat.id) }));
      const orphan = this.items.filter(i => !this.categories.find(c => c.id === i.categoryId));
      if (orphan.length) groups.push({ id:null, name:'未分類', emoji:'📦', bg:'#E7E0D2', text:'#6B4527', list: orphan });
      return groups;
    },
    openAddItemForCategory(catId) { this.resetItemForm(); this.itemForm.categoryId = catId; this.itemFormOpen = true; },
    resetItemForm() { this.photoUrlError = false; this.itemForm = { id:null, categoryId:'', name:'', total:1, photo:null, publisherId:'', photoMode:'upload' }; },
    editItem(it) {
      this.itemFormOpen = true; this.photoUrlError = false;
      this.itemForm = { id:it.id, categoryId:it.categoryId, name:it.name, total:it.total, photo:it.photo||null, publisherId:it.publisherId||'', photoMode:'upload' };
      this.$nextTick(() => { const el = document.getElementById('itemEditForm'); if (el) el.scrollIntoView({ behavior:'smooth', block:'center' }); });
    },
    async deleteItem(it) {
      const outstanding = this.records.some(r => r.itemId===it.id && this.statusOf(r)!=='returned');
      if (outstanding) { this.showToast('此項目仍有借閱中的紀錄，無法刪除'); return; }
      if (!confirm(`確定要刪除「${it.name}」嗎？此動作無法復原。`)) return;
      try { await this.db.collection('items').doc(it.id).delete(); this.showToast(`已刪除項目：${it.name}`); }
      catch (e) { this.showToast('刪除失敗，請再試一次'); }
    },
    async saveItem() {
      if (!this.itemForm.id && this.similarItemMatches.length) {
        const names = this.similarItemMatches.map(it => it.name).join('、');
        if (!confirm(`資料庫中已有名稱相似的品項：${names}\n確定要新增為一筆全新的項目嗎？`)) return;
      }
      this.submitting = true;
      try {
        const isBook = this.isBookCategory(this.itemForm.categoryId);
        const data = { categoryId: this.itemForm.categoryId, name: this.itemForm.name, total: Number(this.itemForm.total), photo: this.itemForm.photo || null, publisherId: isBook ? (this.itemForm.publisherId || null) : null };
        if (this.itemForm.id) {
          const it = this.items.find(i => i.id === this.itemForm.id);
          const borrowedOut = it.total - it.remaining;
          data.remaining = Math.max(0, data.total - borrowedOut);
          await this.db.collection('items').doc(this.itemForm.id).update(data);
          this.showToast(`已更新項目：${data.name}`);
        } else {
          data.remaining = data.total; data.createdAt = Date.now();
          await this.db.collection('items').add(data);
          this.showToast(`已新增項目：${data.name}`);
        }
        this.openGroups[this.itemForm.categoryId || 'uncategorized'] = true;
        this.itemFormOpen = false; this.resetItemForm();
      } catch (e) { this.showToast('儲存失敗，請再試一次'); }
      this.submitting = false;
    },

    downloadImportTemplate() {
      const rows = [
        ['分類', '名稱', '出版社', '總數量'],
        ['繪本書籍', '好餓的毛毛蟲', '上誼文化', 5],
        ['積木區', '原木大積木組', '', 6],
      ];
      const csv = rows.map(r => r.map(v => {
        const s = String(v ?? '');
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
      }).join(',')).join('\r\n');
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = '繪本教具匯入範本.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      this.showToast('已下載匯入範本，請依欄位填寫後再匯入');
    },

    async handleExcelImport(e) {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file) return;
      if (!window.XLSX) { this.showToast('匯入功能尚未載入完成，請重新整理頁面再試一次'); return; }

      this.importing = true; this.importSummary = '';
      try {
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });

        if (!rows.length) { this.importSummary = '這個檔案裡沒有讀到任何資料列，請確認格式。'; this.importing = false; return; }

        let success = 0;
        const errors = [];
        for (let i = 0; i < rows.length; i++) {
          const row = rows[i];
          const rowNo = i + 2; // 含表頭，資料從第2列開始
          const catName = String(row['分類'] ?? '').trim();
          const name = String(row['名稱'] ?? '').trim();
          const pubName = String(row['出版社'] ?? '').trim();
          const totalRaw = row['總數量'];
          const total = Number(totalRaw);

          if (!catName || !name) { errors.push(`第 ${rowNo} 列：分類或名稱是空的，已略過`); continue; }
          const cat = this.categories.find(c => c.name === catName);
          if (!cat) { errors.push(`第 ${rowNo} 列：找不到類別「${catName}」，已略過（請先在「借用類別管理」建立這個類別）`); continue; }
          if (!totalRaw || !Number.isFinite(total) || total < 1) { errors.push(`第 ${rowNo} 列：總數量「${totalRaw}」不是有效數字，已略過`); continue; }

          let publisherId = null;
          if (cat.isBook && pubName) {
            const pub = this.publishers.find(p => p.name === pubName);
            if (pub) publisherId = pub.id;
            else errors.push(`第 ${rowNo} 列：找不到出版社「${pubName}」，此列仍會匯入，但出版社留空（請先在「繪本出版社管理」建立）`);
          }

          try {
            await this.db.collection('items').add({
              categoryId: cat.id, name, total, remaining: total,
              photo: null, publisherId, createdAt: Date.now(),
            });
            success++;
          } catch (err) { errors.push(`第 ${rowNo} 列：「${name}」寫入失敗`); }
        }

        let summary = `匯入完成：成功新增 ${success} 筆（共 ${rows.length} 列）。`;
        if (errors.length) summary += `\n\n以下 ${errors.length} 列需要留意：\n` + errors.join('\n');
        this.importSummary = summary;
        this.showToast(`匯入完成，成功新增 ${success} 筆`);
      } catch (err) {
        this.importSummary = '讀取檔案失敗，請確認檔案格式是否為 .xlsx / .xls / .csv。';
      }
      this.importing = false;
    },

    async addClass() {
      const name = this.newClassName.trim();
      if (!name) return;
      if (this.classes.includes(name)) { this.showToast('此班級已存在'); return; }
      try { await this.db.collection('roster').doc('classes').set({ list: [...this.classes, name] }, { merge: true }); this.newClassName = ''; }
      catch (e) { this.showToast('新增失敗，請再試一次'); }
    },
    async deleteClass(name) {
      if (!confirm(`確定要刪除班級「${name}」嗎？`)) return;
      try { await this.db.collection('roster').doc('classes').set({ list: this.classes.filter(c => c !== name) }, { merge: true }); }
      catch (e) { this.showToast('刪除失敗，請再試一次'); }
    },
    async addTeacherRoster() {
      const name = this.newTeacherRosterName.trim();
      if (!name) return;
      if (this.teacherRoster.includes(name)) { this.showToast('此老師已存在'); return; }
      try { await this.db.collection('roster').doc('teachers').set({ list: [...this.teacherRoster, name] }, { merge: true }); this.newTeacherRosterName = ''; }
      catch (e) { this.showToast('新增失敗，請再試一次'); }
    },
    async deleteTeacherRoster(name) {
      if (!confirm(`確定要刪除老師「${name}」嗎？`)) return;
      try { await this.db.collection('roster').doc('teachers').set({ list: this.teacherRoster.filter(n => n !== name) }, { merge: true }); }
      catch (e) { this.showToast('刪除失敗，請再試一次'); }
    },

    get laminateRemaining() { return this.laminateStock ? Number(this.laminateStock.remaining || 0) : 0; },
    get laminatePendingQty() { return this.laminateRequests.filter(r => r.status === 'pending').reduce((n, r) => n + Number(r.qty || 0), 0); },
    get laminateAvailable() { return this.laminateStock ? Math.max(0, this.laminateRemaining - this.laminatePendingQty) : 0; },
    get pendingLaminateRequests() { return this.laminateRequests.filter(r => r.status === 'pending').sort((a,b) => (a.createdAt||0) - (b.createdAt||0)); },
    get recentLaminateRequests() { return [...this.laminateRequests].sort((a,b) => (b.createdAt||0) - (a.createdAt||0)).slice(0, 8); },
    get filteredLaminateRecords() {
      const kw = this.lamQ.trim().toLowerCase();
      return this.laminateRequests.filter(r => {
        if (this.lamStatus !== 'all' && r.status !== this.lamStatus) return false;
        if (this.lamFrom && (r.requestDate || '') < this.lamFrom) return false;
        if (this.lamTo && (r.requestDate || '') > this.lamTo) return false;
        if (!kw) return true;
        return [r.borrower, r.className, r.purpose, r.fileNote].some(v => (v || '').toLowerCase().includes(kw));
      }).sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
    },
    get visibleLaminateRecords() { return this.lamShowAll ? this.filteredLaminateRecords : this.filteredLaminateRecords.slice(0, 3); },
    exportLaminateCSV() {
      const rows = [['申請日期','老師','班級','張數','用途','檔案名稱','狀態','申請時間','確認時間']];
      this.filteredLaminateRecords.forEach(r => rows.push([r.requestDate, r.borrower, r.className, r.qty, r.purpose, r.fileNote || '', r.status === 'confirmed' ? '已確認' : '待確認', r.requestTimestamp || '', r.confirmedTimestamp || '']));
      rows.push([]);
      rows.push(['符合筆數', this.filteredLaminateRecords.length]);
      rows.push(['已確認張數合計', this.filteredLaminateRecords.filter(r => r.status === 'confirmed').reduce((n,r) => n + Number(r.qty||0), 0)]);
      rows.push(['目前護貝膜剩餘張數', this.laminateStock ? this.laminateRemaining : '']);
      rows.push(['匯出時間', this.getTaipeiTimestamp()]);
      const csv = rows.map(r => r.map(v => { const t = String(v ?? ''); return /[",\n]/.test(t) ? '"' + t.replace(/"/g,'""') + '"' : t; }).join(',')).join('\r\n');
      const url = URL.createObjectURL(new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' }));
      const a = document.createElement('a'); a.href = url; a.download = `護貝膜申請總表_${this.getTaipeiDateString()}.csv`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
      this.showToast('已匯出護貝膜申請總表');
    },
    async submitLaminate() {
      this.laminateError = '';
      const f = this.laminateForm, qty = Number(f.qty);
      if (!f.borrower.trim() || !f.className || !f.purpose.trim()) { this.laminateError = '請填寫老師姓名、班級與用途'; return; }
      if (!Number.isInteger(qty) || qty < 1) { this.laminateError = '申請張數需為大於 0 的整數'; return; }
      if (!this.laminateStock) { this.laminateError = '護貝膜庫存尚未設定，請洽管理員'; return; }
      if (qty > this.laminateAvailable) { this.laminateError = `目前僅可申請 ${this.laminateAvailable} 張（部分張數已有待確認的申請）`; return; }
      if (!f.fileNote.trim()) { this.laminateError = '請填寫您上傳的檔案名稱'; return; }
      if (!f.uploaded) { this.laminateError = '請先將檔案上傳到雲端資料夾，並勾選「我已上傳」'; return; }
      this.submitting = true;
      try {
        await this.db.collection('laminateRequests').add({
          borrower: f.borrower.trim(), className: f.className, qty, purpose: f.purpose.trim(), fileNote: f.fileNote.trim(),
          requestDate: f.requestDate, requestTimestamp: this.getTaipeiTimestamp(), status: 'pending', createdAt: Date.now(),
        });
        this.showToast(`已送出護貝膜申請：${qty} 張，請等待管理員確認`);
        this.notifyLine(`🧷 新的護貝膜申請（待確認）\n${f.borrower.trim()}（${f.className}）\n張數：${qty} 張\n用途：${f.purpose.trim()}\n檔名：${f.fileNote.trim()}\n請至管理者後台確認`);
        this.laminateForm.borrower = ''; this.laminateForm.className = ''; this.laminateForm.qty = 1;
        this.laminateForm.purpose = ''; this.laminateForm.fileNote = ''; this.laminateForm.uploaded = false;
      } catch (e) { console.error(e); this.laminateError = `送出失敗（${e.code || e.message}），請確認 Firestore 規則後再試一次`; }
      this.submitting = false;
    },
    async confirmLaminateRequest(req) {
      const stockRef = this.db.collection('laminateStock').doc('main'), reqRef = this.db.collection('laminateRequests').doc(req.id);
      try {
        await this.db.runTransaction(async tx => {
          const st = await tx.get(stockRef), rq = await tx.get(reqRef);
          if (!rq.exists || rq.data().status !== 'pending') throw new Error('already');
          const remain = st.exists ? Number(st.data().remaining || 0) : 0;
          if (remain < req.qty) throw new Error('stock');
          tx.update(stockRef, { remaining: remain - req.qty });
          tx.update(reqRef, { status: 'confirmed', confirmedTimestamp: this.getTaipeiTimestamp() });
        });
        this.showToast(`已確認：${req.borrower} 護貝膜 ${req.qty} 張`);
      } catch (e) {
        this.showToast(e.message === 'stock' ? '剩餘張數不足，請先補貨並調整庫存' : e.message === 'already' ? '此申請已被處理' : `確認失敗（${e.code || e.message}）`, 5000);
      }
    },
    async rejectLaminateRequest(req) {
      if (!confirm(`確定要取消「${req.borrower}」申請的 ${req.qty} 張護貝膜嗎？`)) return;
      try { await this.db.collection('laminateRequests').doc(req.id).delete(); this.showToast('已取消該筆申請'); }
      catch (e) { this.showToast('取消失敗，請再試一次'); }
    },
    async adjustLaminateStock() {
      const n = Number(this.laminateStockInput);
      if (this.laminateStockInput === '' || !Number.isInteger(n) || n < 0) { this.showToast('請輸入 0 以上的整數'); return; }
      try { await this.db.collection('laminateStock').doc('main').set({ remaining: n }, { merge: true }); this.laminateStockInput = ''; this.showToast(`已將護貝膜剩餘張數設為 ${n} 張`); }
      catch (e) { this.showToast(`更新失敗（${e.code || e.message}）`); }
    },

    snapErr(label) { return (err) => { console.error(label, err); this.showToast(`${label}（${(err && (err.code || err.message)) || '未知錯誤'}）`, 6000); }; },
    showToast(msg, ms = 2600) { this.toast = msg; clearTimeout(this._toastTimer); this._toastTimer = setTimeout(() => { this.toast=''; }, ms); },

    get adminPendingCount() { return this.pendingReturnRequests.length + this.pendingLaminateRequests.length; },
    playBeep() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        this.audioCtx = this.audioCtx || new AC();
        const ctx = this.audioCtx, now = ctx.currentTime;
        [880, 1175].forEach((f, k) => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
          g.gain.setValueAtTime(0.0001, now + k*0.22); g.gain.exponentialRampToValueAtTime(0.25, now + k*0.22 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, now + k*0.22 + 0.2);
          o.start(now + k*0.22); o.stop(now + k*0.22 + 0.22);
        });
      } catch (e) {}
    },
    flashTitle(text) {
      if (!document.hidden) return;
      this.stopTitleFlash(); let on = false;
      this.titleTimer = setInterval(() => { on = !on; document.title = on ? `🔔 ${text}` : this.baseTitle; }, 1000);
    },
    stopTitleFlash() { if (this.titleTimer) { clearInterval(this.titleTimer); this.titleTimer = null; document.title = this.baseTitle; } },
    notifyAdmin(title, body) {
      this.showToast(`🔔 ${title}：${body}`, 8000);
      this.playBeep();
      this.flashTitle(title);
      if (window.Notification && Notification.permission === 'granted') {
        try { new Notification(`教具借還系統 － ${title}`, { body: `${body}。請至管理者後台查看。`, tag: 'kg-' + Date.now(), requireInteraction: true }); } catch (e) {}
      }
    },
    async enableNotifications() {
      if (!window.Notification) { this.notifPerm = 'unsupported'; return; }
      try { this.notifPerm = await Notification.requestPermission(); } catch (e) {}
      this.playBeep();
      this.showToast(this.notifPerm === 'granted' ? '已開啟通知 ✅' : '通知未開啟，請在瀏覽器網站設定中允許通知', 4000);
    },
    async notifyLine(text) {
      try {
        const user = this.auth && this.auth.currentUser; if (!user) return;
        const idToken = await user.getIdToken();
        fetch('/.netlify/functions/line-notify', {
          method: 'POST', keepalive: true,
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + idToken },
          body: JSON.stringify({ text }),
        }).then(r => { if (!r.ok) console.warn('LINE 通知未送出', r.status); }).catch(e => console.warn('LINE 通知失敗', e));
      } catch (e) { console.warn('LINE 通知失敗', e); }
    },
    notifyNewReturnRequest(req) {
      this.notifyAdmin('新的歸還申請', `${req.borrower||''}（${req.className||''}）申請歸還 ${req.itemName||''} × ${req.qty||''}`);
    },
  };
}
</script>
