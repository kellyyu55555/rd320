<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小樹屋 繪本教具借還管理系統</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          cream: '#FAF3E6',
          paper: '#FFFDF8',
          wood: { DEFAULT: '#8B5E3C', light: '#C8A27A', dark: '#6B4527' },
          sage: { DEFAULT: '#8FA37E', light: '#DCE6D3', dark: '#5F7350' },
          mustard: '#E3B23C',
          coral: '#E0785B',
          skyish: '#7C98A6',
        },
        fontFamily: {
          heading: ['"Noto Sans TC"', 'sans-serif'],
          body: ['"Noto Sans TC"', 'sans-serif'],
          num: ['"Fredoka"', '"Noto Sans TC"', 'sans-serif'],
        },
        boxShadow: {
          soft: '0 4px 14px rgba(107, 69, 39, 0.08)',
          card: '0 2px 8px rgba(107, 69, 39, 0.06)',
        }
      }
    }
  }
</script>
<style>
  body { font-family: 'Noto Sans TC', sans-serif; }
  .font-num { font-family: 'Fredoka', 'Noto Sans TC', sans-serif; }

  /* 簽名元素：借閱票根風格標籤（像圖書館借書卡 / 姓名貼紙） */
  .tag-badge {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px 4px 18px;
    border-radius: 999px;
    font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
    font-weight: 600;
    font-size: 0.78rem;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .tag-badge::before {
    content: '';
    position: absolute;
    left: 7px;
    top: 50%;
    transform: translateY(-50%);
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: currentColor;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.6);
  }
  .tag-returned { background: #E4EFDC; color: #4C7A3E; }
  .tag-borrowing { background: #FBEBC6; color: #A5760D; }
  .tag-overdue { background: #F7DAD1; color: #C05432; }

  .paper-card {
    background: #FFFDF8;
    border: 1px solid #EEE2CF;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #D8C4A5; border-radius: 999px; }

  [x-cloak] { display: none !important; }

  .washi-tab-active {
    background: #8B5E3C;
    color: #FFFDF8;
    box-shadow: 0 3px 0 #6B4527;
  }
  .washi-tab-active:active { box-shadow: 0 1px 0 #6B4527; transform: translateY(2px); }

  .chip {
    padding: 6px 14px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.8rem;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .chip-active { border-color: #6B4527 !important; }

  .item-pick-card {
    cursor: pointer;
    border: 2px solid transparent;
    transition: all .15s;
  }
  .item-pick-card.selected { border-color: #8FA37E; box-shadow: 0 0 0 3px rgba(143,163,126,0.25); }
  .item-pick-card.disabled { opacity: .45; cursor: not-allowed; }

  input:focus, select:focus, textarea:focus {
    outline: none;
    box-shadow: 0 0 0 3px rgba(143,163,126,0.35);
    border-color: #8FA37E;
  }

  .swatch-btn { width: 28px; height: 28px; border-radius: 999px; border: 2px solid rgba(0,0,0,0.08); cursor: pointer; }
  .swatch-btn.selected { border-color: #6B4527; box-shadow: 0 0 0 2px #FAF3E6, 0 0 0 4px #6B4527; }
</style>
</head>
<body class="bg-cream text-wood-dark min-h-screen">

<div x-data="kgApp()" x-init="init()" x-cloak class="min-h-screen pb-16">

  <!-- ===== Header ===== -->
  <header class="bg-wood text-paper shadow-soft sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-wood-dark/40 flex items-center justify-center text-2xl">🌳</div>
        <div>
          <h1 class="font-heading font-black text-xl leading-tight tracking-wide">小樹屋・繪本教具借還</h1>
          <p class="text-xs text-cream/70 font-medium">溫柔照看每一本書、每一件教具的旅程</p>
        </div>
      </div>
      <div class="hidden sm:flex items-center gap-2 text-sm bg-wood-dark/30 rounded-full px-4 py-2">
        <span class="font-num">📅</span>
        <span x-text="todayLabel"></span>
      </div>
    </div>

    <!-- Tabs -->
    <nav class="max-w-6xl mx-auto px-5 flex gap-2 pb-3">
      <button @click="view = 'teacher'"
        class="px-5 py-2 rounded-full font-heading font-bold text-sm transition-all"
        :class="view==='teacher' ? 'washi-tab-active' : 'bg-paper/20 text-paper/85 hover:bg-paper/30'">
        🧸 老師借還登記區
      </button>
      <button @click="view = 'admin'"
        class="px-5 py-2 rounded-full font-heading font-bold text-sm transition-all"
        :class="view==='admin' ? 'washi-tab-active' : 'bg-paper/20 text-paper/85 hover:bg-paper/30'">
        📋 管理者後台儀表板
      </button>
    </nav>
  </header>

  <main class="max-w-6xl mx-auto px-5 mt-6">

    <!-- ============================================================ -->
    <!-- ============ TEACHER VIEW ================================= -->
    <!-- ============================================================ -->
    <section x-show="view==='teacher'" class="grid md:grid-cols-5 gap-6">

      <!-- 借還登記表單 -->
      <div class="md:col-span-2 paper-card rounded-3xl p-6 shadow-card h-fit">
        <h2 class="font-heading font-black text-lg mb-4 flex items-center gap-2">
          <span class="text-2xl">✏️</span> 借還登記
        </h2>

        <div class="flex bg-sage-light rounded-full p-1 mb-5">
          <button @click="formMode='borrow'" class="flex-1 py-2 rounded-full text-sm font-heading font-bold transition-all"
            :class="formMode==='borrow' ? 'bg-sage text-paper shadow' : 'text-sage-dark'">📚 借用</button>
          <button @click="formMode='return'" class="flex-1 py-2 rounded-full text-sm font-heading font-bold transition-all"
            :class="formMode==='return' ? 'bg-sage text-paper shadow' : 'text-sage-dark'">↩️ 歸還</button>
        </div>

        <!-- 借用表單 -->
        <template x-if="formMode==='borrow'">
          <form @submit.prevent="submitBorrow" class="space-y-4">
            <div>
              <label class="text-sm font-bold text-wood-dark/80">老師姓名</label>
              <input list="teacherNames" x-model="borrowForm.borrower" required placeholder="例如：王老師"
                class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
              <datalist id="teacherNames">
                <template x-for="n in teacherSuggestions" :key="n"><option :value="n"></option></template>
              </datalist>
            </div>
            <div>
              <label class="text-sm font-bold text-wood-dark/80">班級</label>
              <select x-model="borrowForm.className" required class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
                <option value="">請選擇班級</option>
                <option>草莓班</option><option>蘋果班</option><option>向日葵班</option><option>彩虹班</option><option>其他</option>
              </select>
            </div>

            <!-- Step 1：先選類別 -->
            <div>
              <label class="text-sm font-bold text-wood-dark/80">① 選擇類別</label>
              <select x-model.number="borrowForm.categoryId" @change="borrowForm.itemId=''" required
                class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
                <option value="">請選擇類別</option>
                <template x-for="cat in categories" :key="cat.id">
                  <option :value="cat.id" x-text="`${cat.emoji} ${cat.name}`"></option>
                </template>
              </select>
            </div>

            <!-- Step 2：該類別下的全部項目，點選後再借用 -->
            <template x-if="borrowForm.categoryId">
              <div>
                <label class="text-sm font-bold text-wood-dark/80">② 選擇借用項目</label>
                <div class="mt-1 grid grid-cols-2 gap-2 max-h-64 overflow-y-auto p-1">
                  <template x-for="it in borrowCategoryItems" :key="it.id">
                    <div @click="selectBorrowItem(it)"
                      class="item-pick-card rounded-xl p-2 bg-paper border border-wood-light/30 flex flex-col gap-1"
                      :class="[borrowForm.itemId===it.id ? 'selected' : '', it.remaining<=0 ? 'disabled' : '']">
                      <img x-show="photoOf(it)" :src="photoOf(it)" class="w-full h-16 object-cover rounded-lg">
                      <div x-show="!photoOf(it)" class="w-full h-16 rounded-lg flex items-center justify-center text-2xl"
                        :style="categoryStyle(it.categoryId)" x-text="categoryEmojiOf(it.categoryId)"></div>
                      <p class="text-xs font-bold leading-tight" x-text="it.name"></p>
                      <p class="text-[11px] font-num" :class="it.remaining<=0 ? 'text-coral' : 'text-sage-dark'"
                        x-text="it.remaining<=0 ? '無庫存' : `剩餘 ${it.remaining}/${it.total}`"></p>
                    </div>
                  </template>
                  <p x-show="borrowCategoryItems.length===0" class="col-span-2 text-xs text-wood-dark/40 text-center py-4">此類別目前尚無項目</p>
                </div>
              </div>
            </template>

            <template x-if="borrowForm.itemId">
              <div class="flex items-center gap-3 bg-cream rounded-xl p-2 border border-wood-light/30">
                <img x-show="photoOf(getItemById(borrowForm.itemId))" :src="photoOf(getItemById(borrowForm.itemId))"
                  class="w-12 h-12 rounded-lg object-cover border border-wood-light/40">
                <div x-show="!photoOf(getItemById(borrowForm.itemId))" class="w-12 h-12 rounded-lg flex items-center justify-center text-xl"
                  :style="categoryStyle(getItemById(borrowForm.itemId)?.categoryId)" x-text="categoryEmojiOf(getItemById(borrowForm.itemId)?.categoryId)"></div>
                <p class="text-sm font-bold">已選擇：<span x-text="getItemById(borrowForm.itemId)?.name"></span></p>
              </div>
            </template>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-sm font-bold text-wood-dark/80">借用數量</label>
                <input type="number" min="1" :max="selectedItemRemaining" x-model.number="borrowForm.qty" required
                  class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
              </div>
              <div>
                <label class="text-sm font-bold text-wood-dark/80">借用日期</label>
                <input type="date" x-model="borrowForm.borrowDate" required
                  class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
              </div>
            </div>
            <div>
              <label class="text-sm font-bold text-wood-dark/80">預計歸還日</label>
              <input type="date" x-model="borrowForm.dueDate" required
                class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
            </div>
            <p x-show="borrowError" x-text="borrowError" class="text-coral text-xs font-bold"></p>
            <button type="submit" class="w-full py-3 rounded-xl bg-sage text-paper font-heading font-bold hover:bg-sage-dark transition-colors">
              確認借用
            </button>
          </form>
        </template>

        <!-- 歸還表單 -->
        <template x-if="formMode==='return'">
          <form @submit.prevent="submitReturn" class="space-y-4">
            <div>
              <label class="text-sm font-bold text-wood-dark/80">選擇要歸還的借閱紀錄</label>
              <select x-model="returnForm.recordId" required class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
                <option value="">請選擇借閱中的項目</option>
                <template x-for="r in openRecords" :key="r.id">
                  <option :value="r.id" x-text="`${r.borrower}（${r.className}）－${r.itemName} 尚欠 ${outstanding(r)} 件`"></option>
                </template>
              </select>
              <template x-if="returnForm.recordId">
                <div class="mt-2 flex items-center gap-3 bg-cream rounded-xl p-2 border border-wood-light/30">
                  <img x-show="photoOf(getItemById(getRecord(returnForm.recordId)?.itemId))" :src="photoOf(getItemById(getRecord(returnForm.recordId)?.itemId))"
                    class="w-12 h-12 rounded-lg object-cover border border-wood-light/40">
                  <div x-show="!photoOf(getItemById(getRecord(returnForm.recordId)?.itemId))" class="w-12 h-12 rounded-lg flex items-center justify-center text-xl"
                    :style="categoryStyleByName(getRecord(returnForm.recordId)?.category)" x-text="categoryEmojiByName(getRecord(returnForm.recordId)?.category)"></div>
                  <div>
                    <p class="text-sm font-bold" x-text="getRecord(returnForm.recordId)?.itemName"></p>
                    <p class="text-xs text-wood-dark/50" x-text="`${getRecord(returnForm.recordId)?.borrower}（${getRecord(returnForm.recordId)?.className}）`"></p>
                  </div>
                </div>
              </template>
            </div>
            <template x-if="returnForm.recordId">
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="text-sm font-bold text-wood-dark/80">歸還數量</label>
                  <input type="number" min="1" :max="outstanding(getRecord(returnForm.recordId))" x-model.number="returnForm.qty"
                    class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
                </div>
                <div>
                  <label class="text-sm font-bold text-wood-dark/80">歸還日期</label>
                  <input type="date" x-model="returnForm.returnDate" required
                    class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
                </div>
              </div>
            </template>
            <p x-show="returnError" x-text="returnError" class="text-coral text-xs font-bold"></p>
            <button type="submit" class="w-full py-3 rounded-xl bg-mustard text-wood-dark font-heading font-bold hover:brightness-95 transition">
              確認歸還
            </button>
          </form>
        </template>
      </div>

      <!-- 目前可借用清單 -->
      <div class="md:col-span-3">
        <h2 class="font-heading font-black text-lg mb-3 flex items-center gap-2">
          <span class="text-2xl">🧺</span> 目前可借用的圖書與教具
        </h2>
        <div class="flex flex-wrap gap-2 mb-4">
          <button @click="browseCategoryFilter=''" class="chip"
            :class="browseCategoryFilter==='' ? 'chip-active bg-wood text-paper' : 'bg-sage-light text-sage-dark'">全部</button>
          <template x-for="cat in categories" :key="cat.id">
            <button @click="browseCategoryFilter=cat.id" class="chip"
              :class="browseCategoryFilter===cat.id ? 'chip-active' : ''"
              :style="browseCategoryFilter===cat.id ? categoryStyle(cat.id) : 'background:#F2E9D8;color:#8B5E3C'"
              x-text="`${cat.emoji} ${cat.name}`"></button>
          </template>
        </div>
        <div class="grid sm:grid-cols-2 gap-4">
          <template x-for="it in filteredBrowseItems" :key="it.id">
            <div class="paper-card rounded-2xl p-4 shadow-card flex flex-col gap-3">
              <img x-show="photoOf(it)" :src="photoOf(it)" class="w-full h-32 object-cover rounded-xl border border-wood-light/30">
              <div x-show="!photoOf(it)" class="w-full h-32 rounded-xl flex items-center justify-center text-4xl"
                :style="categoryStyle(it.categoryId)" x-text="categoryEmojiOf(it.categoryId)"></div>
              <div class="flex items-start justify-between">
                <span class="tag-badge" :style="categoryStyle(it.categoryId)" x-text="categoryNameOf(it.categoryId)"></span>
                <span class="font-num text-xs text-wood-dark/50" x-text="'#'+it.id"></span>
              </div>
              <h3 class="font-heading font-bold text-base" x-text="it.name"></h3>
              <div class="flex items-center justify-between text-sm">
                <span class="text-wood-dark/60">剩餘 / 總數</span>
                <span class="font-num font-semibold" x-text="`${it.remaining} / ${it.total}`"></span>
              </div>
              <div class="w-full h-2 rounded-full bg-sage-light overflow-hidden">
                <div class="h-full rounded-full" :class="it.remaining===0 ? 'bg-coral' : 'bg-sage'"
                  :style="`width:${(it.remaining/it.total*100)}%`"></div>
              </div>
              <span class="text-xs font-bold" :class="it.remaining===0 ? 'text-coral' : 'text-sage-dark'"
                x-text="it.remaining===0 ? '目前已全部借出' : '可借用'"></span>
            </div>
          </template>
          <p x-show="filteredBrowseItems.length===0" class="col-span-2 text-center text-wood-dark/40 py-8">此類別目前沒有項目</p>
        </div>
      </div>
    </section>

    <!-- ============================================================ -->
    <!-- ============ ADMIN VIEW ==================================== -->
    <!-- ============================================================ -->
    <section x-show="view==='admin'" class="space-y-8">

      <!-- 關鍵指標 -->
      <div class="grid sm:grid-cols-3 gap-4">
        <div class="paper-card rounded-2xl p-5 shadow-card flex items-center gap-4">
          <div class="w-12 h-12 rounded-2xl bg-sage-light flex items-center justify-center text-2xl">📦</div>
          <div>
            <p class="text-xs font-bold text-wood-dark/60">館藏品項數</p>
            <p class="font-num text-2xl font-bold" x-text="items.length"></p>
          </div>
        </div>
        <div class="paper-card rounded-2xl p-5 shadow-card flex items-center gap-4">
          <div class="w-12 h-12 rounded-2xl bg-mustard/30 flex items-center justify-center text-2xl">📖</div>
          <div>
            <p class="text-xs font-bold text-wood-dark/60">目前借出中數量</p>
            <p class="font-num text-2xl font-bold" x-text="borrowingCount"></p>
          </div>
        </div>
        <div class="paper-card rounded-2xl p-5 shadow-card flex items-center gap-4">
          <div class="w-12 h-12 rounded-2xl bg-coral/20 flex items-center justify-center text-2xl">⏰</div>
          <div>
            <p class="text-xs font-bold text-wood-dark/60">逾期未還數量</p>
            <p class="font-num text-2xl font-bold text-coral" x-text="overdueCount"></p>
          </div>
        </div>
      </div>

      <!-- 借還紀錄明細 -->
      <div class="paper-card rounded-3xl p-6 shadow-card">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
          <h2 class="font-heading font-black text-lg flex items-center gap-2"><span class="text-2xl">📋</span> 借還紀錄明細</h2>
          <div class="flex bg-sage-light rounded-full p-1 text-sm">
            <button @click="recordFilter='all'" class="px-4 py-1.5 rounded-full font-bold transition"
              :class="recordFilter==='all' ? 'bg-sage text-paper' : 'text-sage-dark'">全部</button>
            <button @click="recordFilter='borrowing'" class="px-4 py-1.5 rounded-full font-bold transition"
              :class="recordFilter==='borrowing' ? 'bg-sage text-paper' : 'text-sage-dark'">借用中</button>
            <button @click="recordFilter='overdue'" class="px-4 py-1.5 rounded-full font-bold transition"
              :class="recordFilter==='overdue' ? 'bg-sage text-paper' : 'text-sage-dark'">逾期</button>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-sm min-w-[720px]">
            <thead>
              <tr class="text-left text-wood-dark/50 text-xs uppercase tracking-wide border-b border-wood-light/30">
                <th class="py-2 pr-3">老師 / 班級</th>
                <th class="py-2 pr-3">項目</th>
                <th class="py-2 pr-3">數量</th>
                <th class="py-2 pr-3">借用日</th>
                <th class="py-2 pr-3">預計歸還</th>
                <th class="py-2 pr-3">狀態</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="r in filteredRecords" :key="r.id">
                <tr class="border-b border-wood-light/15 hover:bg-cream/60">
                  <td class="py-3 pr-3">
                    <p class="font-bold" x-text="r.borrower"></p>
                    <p class="text-xs text-wood-dark/50" x-text="r.className"></p>
                  </td>
                  <td class="py-3 pr-3">
                    <p x-text="r.itemName"></p>
                    <p class="text-xs text-wood-dark/50" x-text="r.category"></p>
                  </td>
                  <td class="py-3 pr-3 font-num" x-text="`${r.qty - r.returnedQty} / ${r.qty}`"></td>
                  <td class="py-3 pr-3 font-num" x-text="r.borrowDate"></td>
                  <td class="py-3 pr-3 font-num" x-text="r.dueDate"></td>
                  <td class="py-3 pr-3">
                    <span class="tag-badge"
                      :class="statusOf(r)==='returned' ? 'tag-returned' : statusOf(r)==='overdue' ? 'tag-overdue' : 'tag-borrowing'"
                      x-text="statusLabel(statusOf(r))"></span>
                  </td>
                </tr>
              </template>
              <tr x-show="filteredRecords.length===0">
                <td colspan="6" class="py-8 text-center text-wood-dark/40">目前沒有符合條件的紀錄</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 借用類別管理 -->
      <div class="paper-card rounded-3xl p-6 shadow-card">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-heading font-black text-lg flex items-center gap-2"><span class="text-2xl">🏷️</span> 借用類別管理</h2>
          <button @click="categoryFormOpen = !categoryFormOpen; resetCategoryForm()"
            class="px-4 py-2 rounded-full bg-wood text-paper text-sm font-bold hover:bg-wood-dark transition">
            <span x-text="categoryFormOpen ? '取消' : '＋ 新增類別'"></span>
          </button>
        </div>

        <form x-show="categoryFormOpen" @submit.prevent="saveCategory" class="bg-cream rounded-2xl p-4 mb-5 space-y-3">
          <div class="grid sm:grid-cols-3 gap-3">
            <div>
              <label class="text-xs font-bold text-wood-dark/60">類別名稱</label>
              <input x-model="categoryForm.name" required placeholder="例如：音樂律動區"
                class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
            </div>
            <div>
              <label class="text-xs font-bold text-wood-dark/60">圖示 Emoji</label>
              <input x-model="categoryForm.emoji" maxlength="2" placeholder="🧸"
                class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
              <div class="mt-1 flex flex-wrap gap-1">
                <template x-for="em in emojiChoices" :key="em">
                  <button type="button" @click="categoryForm.emoji=em"
                    class="w-7 h-7 rounded-lg text-sm hover:bg-sage-light" x-text="em"></button>
                </template>
              </div>
            </div>
            <div>
              <label class="text-xs font-bold text-wood-dark/60">代表色</label>
              <div class="mt-1 flex flex-wrap gap-2">
                <template x-for="(sw, idx) in presetSwatches" :key="idx">
                  <button type="button" @click="categoryForm.bg=sw.bg; categoryForm.text=sw.text"
                    class="swatch-btn" :class="categoryForm.bg===sw.bg ? 'selected' : ''"
                    :style="`background:${sw.bg}`"></button>
                </template>
              </div>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <span class="tag-badge" :style="`background:${categoryForm.bg};color:${categoryForm.text}`"
              x-text="`${categoryForm.emoji} ${categoryForm.name || '預覽'}`"></span>
            <p x-show="categoryError" x-text="categoryError" class="text-coral text-xs font-bold"></p>
          </div>
          <button type="submit" class="px-5 py-2 rounded-xl bg-sage text-paper font-bold text-sm hover:bg-sage-dark transition"
            x-text="categoryForm.id ? '儲存修改' : '新增類別'"></button>
        </form>

        <div class="flex flex-wrap gap-3">
          <template x-for="cat in categories" :key="cat.id">
            <div class="flex items-center gap-2 paper-card rounded-full pl-1 pr-2 py-1">
              <span class="tag-badge" :style="`background:${cat.bg};color:${cat.text}`" x-text="`${cat.emoji} ${cat.name}`"></span>
              <button @click="editCategory(cat)" class="text-sage-dark text-xs font-bold hover:underline">編輯</button>
              <button @click="deleteCategory(cat)" class="text-coral text-xs font-bold hover:underline">刪除</button>
            </div>
          </template>
        </div>
      </div>

      <!-- 教具/繪本資料管理（依類別分組） -->
      <div class="paper-card rounded-3xl p-6 shadow-card">
        <h2 class="font-heading font-black text-lg mb-4 flex items-center gap-2"><span class="text-2xl">🗂️</span> 繪本與教具資料管理</h2>

        <form x-show="itemFormOpen" @submit.prevent="saveItem" class="grid sm:grid-cols-5 gap-3 mb-6 bg-cream rounded-2xl p-4 items-start">
          <div>
            <label class="text-xs font-bold text-wood-dark/60">分類</label>
            <select x-model.number="itemForm.categoryId" required class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
              <option value="">選擇分類</option>
              <template x-for="cat in categories" :key="cat.id">
                <option :value="cat.id" x-text="`${cat.emoji} ${cat.name}`"></option>
              </template>
            </select>
          </div>
          <div>
            <label class="text-xs font-bold text-wood-dark/60">名稱</label>
            <input x-model="itemForm.name" required placeholder="項目名稱" class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
          </div>
          <div>
            <label class="text-xs font-bold text-wood-dark/60">總數量</label>
            <input type="number" min="1" x-model.number="itemForm.total" required class="mt-1 w-full rounded-xl border border-wood-light/50 bg-paper px-3 py-2 text-sm">
          </div>
          <div>
            <label class="text-xs font-bold text-wood-dark/60">照片</label>
            <input type="file" accept="image/*" @change="handlePhotoUpload($event)"
              class="mt-1 w-full text-xs file:mr-2 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:bg-sage file:text-paper file:font-bold file:text-xs">
            <div class="mt-2 flex items-center gap-2" x-show="itemForm.photo">
              <img :src="itemForm.photo" class="w-10 h-10 rounded-lg object-cover border border-wood-light/40">
              <button type="button" @click="itemForm.photo = null" class="text-xs text-coral font-bold hover:underline">移除照片</button>
            </div>
          </div>
          <div class="flex items-end gap-2 h-full">
            <button type="submit" class="w-full py-2 rounded-xl bg-sage text-paper font-bold text-sm hover:bg-sage-dark transition"
              x-text="itemForm.id ? '儲存修改' : '新增項目'"></button>
            <button type="button" @click="itemFormOpen=false; resetItemForm()" class="py-2 px-3 rounded-xl bg-paper border border-wood-light/40 text-xs font-bold">取消</button>
          </div>
        </form>

        <div class="space-y-6">
          <template x-for="group in itemsByCategory" :key="group.id">
            <div>
              <div class="flex items-center justify-between mb-2">
                <span class="tag-badge" :style="`background:${group.bg};color:${group.text}`" x-text="`${group.emoji} ${group.name}（${group.list.length}）`"></span>
                <button @click="openAddItemForCategory(group.id)" class="text-xs font-bold text-sage-dark hover:underline">＋ 新增此類別項目</button>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-sm min-w-[560px]">
                  <thead>
                    <tr class="text-left text-wood-dark/50 text-xs uppercase tracking-wide border-b border-wood-light/30">
                      <th class="py-2 pr-3">照片</th>
                      <th class="py-2 pr-3">名稱</th>
                      <th class="py-2 pr-3">總數量</th>
                      <th class="py-2 pr-3">目前剩餘</th>
                      <th class="py-2 pr-3">操作</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="it in group.list" :key="it.id">
                      <tr class="border-b border-wood-light/15">
                        <td class="py-3 pr-3">
                          <img x-show="photoOf(it)" :src="photoOf(it)" class="w-10 h-10 rounded-lg object-cover border border-wood-light/30">
                          <div x-show="!photoOf(it)" class="w-10 h-10 rounded-lg flex items-center justify-center text-lg"
                            :style="`background:${group.bg};color:${group.text}`" x-text="group.emoji"></div>
                        </td>
                        <td class="py-3 pr-3 font-bold" x-text="it.name"></td>
                        <td class="py-3 pr-3 font-num" x-text="it.total"></td>
                        <td class="py-3 pr-3 font-num" x-text="it.remaining"></td>
                        <td class="py-3 pr-3 flex gap-3">
                          <button @click="editItem(it)" class="text-sage-dark font-bold text-xs hover:underline">編輯</button>
                          <button @click="deleteItem(it)" class="text-coral font-bold text-xs hover:underline">刪除</button>
                        </td>
                      </tr>
                    </template>
                    <tr x-show="group.list.length===0">
                      <td colspan="5" class="py-4 text-center text-wood-dark/30 text-xs">此類別尚無項目</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </template>
        </div>
      </div>
    </section>
  </main>

  <!-- Toast -->
  <div x-show="toast" x-transition class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-wood-dark text-paper px-5 py-3 rounded-full shadow-soft font-bold text-sm z-50"
    x-text="toast"></div>
</div>

<script>
function kgApp() {
  return {
    view: 'teacher',
    formMode: 'borrow',
    recordFilter: 'all',
    browseCategoryFilter: '',
    itemFormOpen: false,
    categoryFormOpen: false,
    toast: '',
    categories: [],
    items: [],
    records: [],
    borrowForm: { borrower: '', className: '', categoryId: '', itemId: '', qty: 1, borrowDate: '', dueDate: '' },
    returnForm: { recordId: '', qty: 1, returnDate: '' },
    itemForm: { id: null, categoryId: '', name: '', total: 1, photo: null },
    categoryForm: { id: null, name: '', emoji: '📦', bg: '#DDE6D3', text: '#4C7A3E' },
    borrowError: '',
    returnError: '',
    categoryError: '',

    emojiChoices: ['📖','🎨','🔤','🔢','🧩','🧱','🍳','🧦','🎵','⚽','🔬','🧵','🌱','🚗','🖍️','🧸'],
    presetSwatches: [
      { bg: '#DDE6D3', text: '#4C7A3E' },
      { bg: '#F3CFC0', text: '#B0553B' },
      { bg: '#F3D9A0', text: '#8A5F14' },
      { bg: '#D6E2E6', text: '#3E6470' },
      { bg: '#E4D7ED', text: '#6E4E8C' },
      { bg: '#EAD9C5', text: '#8B5E3C' },
      { bg: '#F6DCC0', text: '#B36B2E' },
      { bg: '#F0DCE0', text: '#A15A72' },
    ],

    init() {
      const today = new Date().toISOString().slice(0, 10);
      this.todayLabel = new Date().toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
      this.borrowForm.borrowDate = today;
      this.borrowForm.dueDate = this.addDays(today, 7);
      this.returnForm.returnDate = today;

      const storedCategories = localStorage.getItem('kg_categories');
      const storedItems = localStorage.getItem('kg_items');
      const storedRecords = localStorage.getItem('kg_records');

      if (storedCategories && storedItems && storedRecords) {
        this.categories = JSON.parse(storedCategories);
        this.items = JSON.parse(storedItems);
        this.records = JSON.parse(storedRecords);
      } else {
        this.seedData(today);
        this.persist();
      }

      this.$watch('categories', () => this.persist());
      this.$watch('items', () => this.persist());
      this.$watch('records', () => this.persist());
    },

    seedData(today) {
      this.categories = [
        { id: 1, name: '繪本書籍', emoji: '📖', bg: '#DDE6D3', text: '#4C7A3E' },
        { id: 2, name: '美勞區', emoji: '🎨', bg: '#F3CFC0', text: '#B0553B' },
        { id: 3, name: '語文區', emoji: '🔤', bg: '#F3D9A0', text: '#8A5F14' },
        { id: 4, name: '數學區', emoji: '🔢', bg: '#D6E2E6', text: '#3E6470' },
        { id: 5, name: '組合建構區', emoji: '🧩', bg: '#E4D7ED', text: '#6E4E8C' },
        { id: 6, name: '積木區', emoji: '🧱', bg: '#EAD9C5', text: '#8B5E3C' },
        { id: 7, name: '烹飪區', emoji: '🍳', bg: '#F6DCC0', text: '#B36B2E' },
        { id: 8, name: '生活自理區', emoji: '🧦', bg: '#F0DCE0', text: '#A15A72' },
      ];
      this.items = [
        { id: 1, categoryId: 1, name: '好餓的毛毛蟲', total: 5, remaining: 4, photo: null },
        { id: 2, categoryId: 1, name: '猜猜我有多愛你', total: 4, remaining: 4, photo: null },
        { id: 3, categoryId: 2, name: '安全彩色黏土組', total: 8, remaining: 8, photo: null },
        { id: 4, categoryId: 3, name: '注音符號磁鐵卡組', total: 3, remaining: 2, photo: null },
        { id: 5, categoryId: 4, name: '數字對應積木教具', total: 6, remaining: 6, photo: null },
        { id: 6, categoryId: 5, name: '齒輪組合玩具箱', total: 4, remaining: 4, photo: null },
        { id: 7, categoryId: 6, name: '原木大積木組', total: 6, remaining: 4, photo: null },
        { id: 8, categoryId: 7, name: '兒童扮家家酒廚房組', total: 3, remaining: 3, photo: null },
        { id: 9, categoryId: 8, name: '穿脫扣練習板', total: 5, remaining: 5, photo: null },
      ];
      this.records = [
        { id: 1, itemId: 1, itemName: '好餓的毛毛蟲', category: '繪本書籍', borrower: '王老師', className: '草莓班', qty: 1, returnedQty: 0, borrowDate: this.addDays(today, -2), dueDate: this.addDays(today, 5), returnDate: null },
        { id: 2, itemId: 7, itemName: '原木大積木組', category: '積木區', borrower: '陳老師', className: '蘋果班', qty: 2, returnedQty: 0, borrowDate: this.addDays(today, -10), dueDate: this.addDays(today, -3), returnDate: null },
        { id: 3, itemId: 4, itemName: '注音符號磁鐵卡組', category: '語文區', borrower: '林老師', className: '向日葵班', qty: 1, returnedQty: 0, borrowDate: this.addDays(today, -3), dueDate: this.addDays(today, 4), returnDate: null },
        { id: 4, itemId: 2, itemName: '猜猜我有多愛你', category: '繪本書籍', borrower: '林老師', className: '向日葵班', qty: 1, returnedQty: 1, borrowDate: this.addDays(today, -14), dueDate: this.addDays(today, -7), returnDate: this.addDays(today, -8) },
      ];
    },

    persist() {
      localStorage.setItem('kg_categories', JSON.stringify(this.categories));
      localStorage.setItem('kg_items', JSON.stringify(this.items));
      localStorage.setItem('kg_records', JSON.stringify(this.records));
    },

    addDays(dateStr, n) {
      const d = new Date(dateStr);
      d.setDate(d.getDate() + n);
      return d.toISOString().slice(0, 10);
    },

    // ---------- 分類輔助 ----------
    getCategory(id) {
      return this.categories.find(c => c.id == id) || { id: null, name: '未分類', emoji: '📦', bg: '#E7E0D2', text: '#6B4527' };
    },
    categoryStyle(id) {
      const c = this.getCategory(id);
      return `background:${c.bg};color:${c.text}`;
    },
    categoryEmojiOf(id) {
      return this.getCategory(id).emoji;
    },
    categoryNameOf(id) {
      return this.getCategory(id).name;
    },
    getCategoryByName(name) {
      return this.categories.find(c => c.name === name) || { name: name || '未分類', emoji: '📦', bg: '#E7E0D2', text: '#6B4527' };
    },
    categoryStyleByName(name) {
      const c = this.getCategoryByName(name);
      return `background:${c.bg};color:${c.text}`;
    },
    categoryEmojiByName(name) {
      return this.getCategoryByName(name).emoji;
    },

    photoOf(it) {
      return it && it.photo ? it.photo : null;
    },

    getItemById(id) {
      return this.items.find(i => i.id == id);
    },

    handlePhotoUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) { this.showToast('請上傳圖片檔案'); return; }
      const reader = new FileReader();
      reader.onload = (ev) => { this.itemForm.photo = ev.target.result; };
      reader.readAsDataURL(file);
    },

    // ---------- 借用清單瀏覽 ----------
    get filteredBrowseItems() {
      if (!this.browseCategoryFilter) return this.items;
      return this.items.filter(i => i.categoryId == this.browseCategoryFilter);
    },

    get borrowCategoryItems() {
      return this.items.filter(i => i.categoryId == this.borrowForm.categoryId);
    },

    selectBorrowItem(it) {
      if (it.remaining <= 0) { this.showToast('此項目目前無庫存'); return; }
      this.borrowForm.itemId = it.id;
      this.borrowForm.qty = 1;
    },

    get selectedItemRemaining() {
      const it = this.items.find(i => i.id == this.borrowForm.itemId);
      return it ? it.remaining : 1;
    },

    get teacherSuggestions() {
      return [...new Set(this.records.map(r => r.borrower))];
    },

    outstanding(r) {
      if (!r) return 0;
      return r.qty - r.returnedQty;
    },

    statusOf(r) {
      if (r.returnedQty >= r.qty) return 'returned';
      const today = new Date().toISOString().slice(0, 10);
      if (today > r.dueDate) return 'overdue';
      return 'borrowing';
    },

    statusLabel(s) {
      return s === 'returned' ? '已歸還' : s === 'overdue' ? '逾期未還' : '借用中';
    },

    get openRecords() {
      return this.records.filter(r => this.statusOf(r) !== 'returned');
    },

    get filteredRecords() {
      const sorted = [...this.records].sort((a, b) => b.borrowDate.localeCompare(a.borrowDate));
      if (this.recordFilter === 'all') return sorted;
      return sorted.filter(r => this.statusOf(r) === this.recordFilter);
    },

    get borrowingCount() {
      return this.records.filter(r => this.statusOf(r) !== 'returned')
        .reduce((sum, r) => sum + this.outstanding(r), 0);
    },

    get overdueCount() {
      return this.records.filter(r => this.statusOf(r) === 'overdue')
        .reduce((sum, r) => sum + this.outstanding(r), 0);
    },

    getRecord(id) {
      return this.records.find(r => r.id == id);
    },

    submitBorrow() {
      this.borrowError = '';
      const it = this.items.find(i => i.id == this.borrowForm.itemId);
      if (!it) { this.borrowError = '請選擇借用項目'; return; }
      const qty = Number(this.borrowForm.qty);
      if (!qty || qty < 1) { this.borrowError = '借用數量需大於 0'; return; }
      if (qty > it.remaining) { this.borrowError = `目前僅剩 ${it.remaining} 件，無法借出 ${qty} 件`; return; }
      if (this.borrowForm.dueDate < this.borrowForm.borrowDate) { this.borrowError = '預計歸還日不能早於借用日'; return; }

      it.remaining -= qty;
      const newId = this.records.length ? Math.max(...this.records.map(r => r.id)) + 1 : 1;
      this.records.push({
        id: newId, itemId: it.id, itemName: it.name, category: this.categoryNameOf(it.categoryId),
        borrower: this.borrowForm.borrower.trim(), className: this.borrowForm.className,
        qty, returnedQty: 0, borrowDate: this.borrowForm.borrowDate, dueDate: this.borrowForm.dueDate, returnDate: null,
      });

      this.showToast(`已登記借出：${it.name} × ${qty}`);
      this.borrowForm.borrower = '';
      this.borrowForm.className = '';
      this.borrowForm.categoryId = '';
      this.borrowForm.itemId = '';
      this.borrowForm.qty = 1;
    },

    submitReturn() {
      this.returnError = '';
      const r = this.getRecord(this.returnForm.recordId);
      if (!r) { this.returnError = '請選擇一筆借閱紀錄'; return; }
      const qty = Number(this.returnForm.qty);
      const remain = this.outstanding(r);
      if (!qty || qty < 1) { this.returnError = '歸還數量需大於 0'; return; }
      if (qty > remain) { this.returnError = `此筆紀錄僅剩 ${remain} 件尚未歸還`; return; }

      r.returnedQty += qty;
      if (r.returnedQty >= r.qty) r.returnDate = this.returnForm.returnDate;
      const it = this.items.find(i => i.id === r.itemId);
      if (it) it.remaining += qty;

      this.showToast(`已登記歸還：${r.itemName} × ${qty}`);
      this.returnForm.recordId = '';
      this.returnForm.qty = 1;
    },

    // ---------- 類別管理 ----------
    resetCategoryForm() {
      this.categoryError = '';
      this.categoryForm = { id: null, name: '', emoji: '📦', bg: '#DDE6D3', text: '#4C7A3E' };
    },

    editCategory(cat) {
      this.categoryFormOpen = true;
      this.categoryForm = { id: cat.id, name: cat.name, emoji: cat.emoji, bg: cat.bg, text: cat.text };
    },

    saveCategory() {
      this.categoryError = '';
      const name = this.categoryForm.name.trim();
      if (!name) { this.categoryError = '請輸入類別名稱'; return; }
      const dup = this.categories.find(c => c.name === name && c.id !== this.categoryForm.id);
      if (dup) { this.categoryError = '此類別名稱已存在'; return; }

      if (this.categoryForm.id) {
        const cat = this.categories.find(c => c.id === this.categoryForm.id);
        cat.name = name; cat.emoji = this.categoryForm.emoji || '📦';
        cat.bg = this.categoryForm.bg; cat.text = this.categoryForm.text;
        this.showToast(`已更新類別：${cat.name}`);
      } else {
        const newId = this.categories.length ? Math.max(...this.categories.map(c => c.id)) + 1 : 1;
        this.categories.push({ id: newId, name, emoji: this.categoryForm.emoji || '📦', bg: this.categoryForm.bg, text: this.categoryForm.text });
        this.showToast(`已新增類別：${name}`);
      }
      this.categoryFormOpen = false;
      this.resetCategoryForm();
    },

    deleteCategory(cat) {
      const count = this.items.filter(i => i.categoryId == cat.id).length;
      const msg = count > 0
        ? `「${cat.name}」目前有 ${count} 個項目使用此類別，刪除後這些項目會顯示為未分類樣式。確定要刪除嗎？`
        : `確定要刪除類別「${cat.name}」嗎？`;
      if (!confirm(msg)) return;
      this.categories = this.categories.filter(c => c.id !== cat.id);
      this.showToast(`已刪除類別：${cat.name}`);
    },

    // ---------- 項目管理 ----------
    get itemsByCategory() {
      const groups = this.categories.map(cat => ({ ...cat, list: this.items.filter(i => i.categoryId == cat.id) }));
      const orphan = this.items.filter(i => !this.categories.find(c => c.id == i.categoryId));
      if (orphan.length) {
        groups.push({ id: null, name: '未分類', emoji: '📦', bg: '#E7E0D2', text: '#6B4527', list: orphan });
      }
      return groups;
    },

    openAddItemForCategory(catId) {
      this.resetItemForm();
      this.itemForm.categoryId = catId;
      this.itemFormOpen = true;
    },

    resetItemForm() {
      this.itemForm = { id: null, categoryId: '', name: '', total: 1, photo: null };
    },

    editItem(it) {
      this.itemFormOpen = true;
      this.itemForm = { id: it.id, categoryId: it.categoryId, name: it.name, total: it.total, photo: it.photo || null };
    },

    deleteItem(it) {
      const outstanding = this.records.some(r => r.itemId === it.id && this.statusOf(r) !== 'returned');
      if (outstanding) { this.showToast('此項目仍有借閱中或逾期的紀錄，無法刪除'); return; }
      if (!confirm(`確定要刪除「${it.name}」嗎？此動作無法復原。`)) return;
      this.items = this.items.filter(i => i.id !== it.id);
      this.showToast(`已刪除項目：${it.name}`);
    },

    saveItem() {
      if (this.itemForm.id) {
        const it = this.items.find(i => i.id === this.itemForm.id);
        const borrowedOut = it.total - it.remaining;
        it.categoryId = this.itemForm.categoryId;
        it.name = this.itemForm.name;
        it.total = Number(this.itemForm.total);
        it.remaining = Math.max(0, it.total - borrowedOut);
        it.photo = this.itemForm.photo || null;
        this.showToast(`已更新項目：${it.name}`);
      } else {
        const newId = this.items.length ? Math.max(...this.items.map(i => i.id)) + 1 : 1;
        this.items.push({ id: newId, categoryId: this.itemForm.categoryId, name: this.itemForm.name, total: Number(this.itemForm.total), remaining: Number(this.itemForm.total), photo: this.itemForm.photo || null });
        this.showToast(`已新增項目：${this.itemForm.name}`);
      }
      this.itemFormOpen = false;
      this.resetItemForm();
    },

    showToast(msg) {
      this.toast = msg;
      setTimeout(() => { this.toast = ''; }, 2400);
    },
  };
}
</script>
</body>
</html>
